<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laboratory Management - Smart Access</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>
  /* VARIABLE TEMA (DEFAULT LIGHT MODE) */
  :root {
    --bg-color: #f4f6f9;
    --text-color: #212529;
    --card-bg: #ffffff;
    --sidebar-bg: #032b67;
    --sidebar-hover: #0d6efd;
    --sidebar-mobile-bg: #021f4b;
    --table-border: #dee2e6;
    --muted-color: #6c757d;
    --input-bg: #ffffff;
    --input-border: #ced4da;
    --modal-bg: #ffffff;
    --locked-color: #dc3545;
    --unlocked-color: #28a745;
  }

  /* DARK MODE OVERRIDES */
  body.dark-mode {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --card-bg: #1e1e1e;
    --sidebar-bg: #0b192c;
    --sidebar-hover: #1e40af;
    --sidebar-mobile-bg: #070f1e;
    --table-border: #333333;
    --muted-color: #a0a0a0;
    --input-bg: #2b2b2b;
    --input-border: #444444;
    --modal-bg: #1e1e1e;
    --locked-color: #f87171;
    --unlocked-color: #34d399;
  }

  body { 
    background: var(--bg-color); 
    color: var(--text-color);
    font-family: 'Segoe UI', sans-serif; 
    margin: 0;
    transition: background 0.3s, color 0.3s;
  }

  /* LAPTOP / DESKTOP VIEW */
  .sidebar { 
    width: 240px; 
    height: 100vh; 
    background: var(--sidebar-bg); 
    position: fixed; 
    color: white; 
    top: 0; 
    left: 0; 
    z-index: 1000;
    transition: background 0.3s;
  }

  .logo { 
    text-align: center; 
    padding: 20px; 
    border-bottom: 1px solid rgba(255,255,255,.2); 
  }

  .logo h5 { 
    margin-top: 10px; 
  }

  .sidebar-menu {
    display: block;
  }

  .sidebar a { 
    display: block; 
    color: white; 
    text-decoration: none; 
    padding: 12px 20px; 
    transition: background 0.2s;
  }

  .sidebar a:hover, .sidebar a.active { 
    background: var(--sidebar-hover); 
  }

  .content { 
    margin-left: 240px; 
    padding: 20px; 
  }

  .table-box { 
    background: var(--card-bg); 
    color: var(--text-color);
    padding: 20px; 
    border-radius: 10px; 
    box-shadow: 0 2px 8px rgba(0,0,0,.15); 
    transition: background 0.3s, color 0.3s;
  }

  .locked { color: var(--locked-color); font-weight: bold; }
  .unlocked { color: var(--unlocked-color); font-weight: bold; }

  body.dark-mode .table {
    color: var(--text-color);
    border-color: var(--table-border);
  }

  body.dark-mode .table th, 
  body.dark-mode .table td {
    background-color: var(--card-bg);
    color: var(--text-color);
    border-color: var(--table-border);
  }

  body.dark-mode .modal-content {
    background-color: var(--modal-bg);
    color: var(--text-color);
    border-color: var(--table-border);
  }
  body.dark-mode .modal-header,
  body.dark-mode .modal-footer {
    border-color: var(--table-border);
  }
  body.dark-mode .btn-close {
    filter: invert(1) grayscale(100%) brightness(200%);
  }

  body.dark-mode .form-control,
  body.dark-mode .form-select {
    background-color: var(--input-bg);
    color: var(--text-color);
    border-color: var(--input-border);
  }
  body.dark-mode .form-control::placeholder {
    color: #a0a0a0;
  }

  /* PHONE VIEW (< 992px) */
  @media (max-width: 991.98px) {
    .sidebar {
      width: 100%;
      height: auto;
      position: relative;
    }

    .logo {
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo i {
      font-size: 1.8rem !important;
    }

    .logo h5 {
      margin: 0;
      font-size: 1.1rem;
    }

    .sidebar-menu {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      background: var(--sidebar-mobile-bg);
      padding: 5px 0;
    }

    .sidebar a {
      padding: 10px 15px;
      font-size: 0.9rem;
    }

    .content {
      margin-left: 0;
      padding: 15px;
    }

    .table-box {
      padding: 15px;
    }
  }
</style>

<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
</script>
</head>
<body>

<!-- SIDEBAR ADMIN -->
<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <div class="sidebar-menu">
    <a href="dashboard.html"><i class="fa fa-chart-line"></i> Dashboard</a>
    <a href="users.html"><i class="fa fa-users"></i> Users</a>
    <a href="booking.html"><i class="fa fa-calendar-check"></i> Bookings</a>
    <a href="accesslog.html"><i class="fa fa-clock"></i> Access Log</a>
    <a href="laboratory.html" class="active"><i class="fa fa-building"></i> Laboratories</a>
    <a href="reports.html"><i class="fa fa-file"></i> Reports</a>
    <a href="notification.html"><i class="fa fa-bell"></i> Notifications</a>
    <a href="help.html"><i class="fa fa-robot"></i> AI Assistant</a>
    <a href="settings.html"><i class="fa fa-cog"></i> Settings</a>
    <a href="profile.html"><i class="fa fa-user"></i> Profile</a>
    <a href="#" id="logoutBtn"><i class="fa fa-sign-out-alt"></i> Logout</a>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="content">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h3 class="mb-0">Laboratory Management</h3>
    <div id="adminNameDisplay">Admin 👤</div>
  </div>

  <!-- JADUAL MAKMAL & BUTANG TAMBAH -->
  <div class="row g-3">
    <div class="col-12">
      <div class="table-box">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h5 class="m-0 fw-semibold">Registered Laboratories</h5>
          <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modal" onclick="resetLabForm()">
            <i class="fa fa-plus me-1"></i> Add New Laboratory
          </button>
        </div>
        <div class="table-responsive">
          <table class="table align-middle text-center mb-0" id="labTable">
            <thead>
              <tr>
                <th>Lab ID</th>
                <th>Laboratory</th>
                <th>Location</th>
                <th>Door Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="labTableBody">
              <tr><td colspan="5" class="text-muted">Loading laboratories...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Add / Edit Laboratory -->
<div class="modal fade" id="modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="labModalTitle">Add New Laboratory</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="text" id="labId" class="form-control mb-3" placeholder="Lab ID (e.g. LAB001)" required>
        <input type="text" id="labName" class="form-control mb-3" placeholder="Laboratory Name" required>
        <input type="text" id="location" class="form-control mb-3" placeholder="Location" required>
        <select id="status" class="form-select mb-3">
          <option value="Locked">Locked</option>
          <option value="Unlocked">Unlocked</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="saveLabBtn">Save Laboratory</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  import { auth, signOut, onAuthStateChanged, db, ref, set, get, child, onValue, remove } from './firebase-config.js';

  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    const dbRef = ref(db);
    let userRole = 'user';
    let userName = user.email || 'Admin';

    const snapshot = await get(child(dbRef, `users/${user.uid}`));
    if (snapshot.exists()) {
      const data = snapshot.val();
      if (data.role) userRole = data.role.toString().toLowerCase();
      if (data.name) userName = data.name;
    } else {
      const allUsersSnap = await get(child(dbRef, 'users'));
      if (allUsersSnap.exists()) {
        const allUsers = allUsersSnap.val();
        Object.keys(allUsers).forEach(key => {
          if (allUsers[key].email && allUsers[key].email.toLowerCase() === user.email.toLowerCase()) {
            if (allUsers[key].role) userRole = allUsers[key].role.toString().toLowerCase();
            if (allUsers[key].name) userName = allUsers[key].name;
          }
        });
      }
    }

    if (userRole !== 'admin') {
      alert("Akses ditolak! Halaman ini khusus untuk Pentadbir (Admin) sahaja.");
      window.location.href = "user-dashboard.html";
      return;
    }

    document.getElementById("adminNameDisplay").innerText = `${userName} 👤`;
  });

  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", (e) => {
      e.preventDefault();
      signOut(auth)
        .then(() => {
          window.location.href = "index.html";
        })
        .catch((error) => {
          console.error("Logout Error:", error);
          alert("Gagal untuk log keluar. Sila cuba lagi.");
        });
    });
  }

  const labsRef = ref(db, 'laboratories');

  onValue(labsRef, (snapshot) => {
    const tableBody = document.getElementById("labTableBody");
    tableBody.innerHTML = "";
    const data = snapshot.val();

    if (data) {
      Object.keys(data).forEach((key) => {
        const lab = data[key];
        const displayLabId = lab.labId || key;
        const displayLabName = lab.labName || 'N/A';
        const displayLocation = lab.location || 'N/A';
        const isUnlocked = lab.status === "Unlocked";
        
        const statusHtml = isUnlocked 
          ? "<span class='unlocked'>🔓 Unlocked</span>" 
          : "<span class='locked'>🔒 Locked</span>";

        tableBody.innerHTML += `
          <tr>
            <td><code>${displayLabId}</code></td>
            <td>${displayLabName}</td>
            <td>${displayLocation}</td>
            <td>${statusHtml}</td>
            <td>
              <button class="btn btn-warning btn-sm me-1" onclick="editLab('${displayLabId}', '${displayLabName}', '${displayLocation}', '${lab.status || 'Locked'}')">
                <i class="fa fa-edit"></i>
              </button>
              <button class="btn btn-danger btn-sm" onclick="deleteLab('${key}')">
                <i class="fa fa-trash"></i>
              </button>
            </td>
          </tr>`;
      });
    } else {
      tableBody.innerHTML = `<tr><td colspan="5" class="text-muted">No laboratories found</td></tr>`;
    }
  });

  const modalEl = document.getElementById('modal');
  const bsModal = new bootstrap.Modal(modalEl);

  document.getElementById("saveLabBtn").addEventListener("click", () => {
    const labId = document.getElementById("labId").value.trim();
    const labName = document.getElementById("labName").value.trim();
    const location = document.getElementById("location").value.trim();
    const status = document.getElementById("status").value;

    if (!labId || !labName || !location) {
      alert("Sila isi semua maklumat!");
      return;
    }

    set(ref(db, `laboratories/${labId}`), {
      labId: labId,
      labName: labName,
      location: location,
      status: status,
      updatedAt: Date.now()
    }).then(() => {
      bsModal.hide();
      resetLabForm();
    }).catch((error) => {
      console.error("Save Error:", error);
      alert("Gagal menyimpan data.");
    });
  });

  window.editLab = function(labId, labName, location, status) {
    document.getElementById("labModalTitle").innerText = "Edit Laboratory";
    document.getElementById("labId").value = labId;
    document.getElementById("labId").readOnly = true;
    document.getElementById("labName").value = labName;
    document.getElementById("location").value = location;
    document.getElementById("status").value = status;
    bsModal.show();
  };

  window.deleteLab = function(key) {
    if (confirm("Adakah anda pasti untuk memadam makmal ini?")) {
      remove(ref(db, `laboratories/${key}`)).catch(err => {
        console.error("Error deleting lab:", err);
        alert("Gagal memadam makmal.");
      });
    }
  };

  window.resetLabForm = function() {
    document.getElementById("labModalTitle").innerText = "Add New Laboratory";
    document.getElementById("labId").readOnly = false;
    document.getElementById("labId").value = "";
    document.getElementById("labName").value = "";
    document.getElementById("location").value = "";
    document.getElementById("status").value = "Locked";
  };
</script>
</body>
</html>
