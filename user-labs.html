<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Booking - Smart Access</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
</script>

<style>
  :root {
    --bg-color: #f4f6f9;
    --text-color: #212529;
    --card-bg: #ffffff;
    --sidebar-bg: #032b67;
    --sidebar-hover: #3b82f6;
    --sidebar-mobile-bg: #021f4b;
    --border-color: #dee2e6;
    --input-bg: #ffffff;
    --input-text: #212529;
  }

  html.dark-mode, body.dark-mode {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --card-bg: #1e1e1e;
    --sidebar-bg: #0b192c;
    --sidebar-hover: #1d4ed8;
    --sidebar-mobile-bg: #070f1e;
    --border-color: #333333;
    --input-bg: #2d2d2d;
    --input-text: #ffffff;
  }

  body { 
    background: var(--bg-color); 
    color: var(--text-color);
    font-family: 'Segoe UI', sans-serif; 
    margin: 0;
    transition: background 0.3s, color 0.3s;
  }

  .sidebar { 
    width: 240px; 
    height: 100vh; 
    background: var(--sidebar-bg); 
    position: fixed; 
    color: white; 
    top: 0; 
    left: 0; 
    z-index: 1000;
  }

  .logo { text-align: center; padding: 20px; border-bottom: 1px solid rgba(255,255,255,.2); }
  .logo h5 { margin-top: 10px; }
  .sidebar a { display: block; color: white; text-decoration: none; padding: 12px 20px; transition: background 0.2s; }
  .sidebar a:hover, .sidebar a.active { background: var(--sidebar-hover); }

  .content { margin-left: 240px; padding: 20px; }

  .stat-card {
    background: var(--card-bg);
    color: var(--text-color);
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .form-control, .form-select {
    background-color: var(--input-bg);
    color: var(--input-text);
    border-color: var(--border-color);
  }

  .table-custom { color: var(--text-color); background: var(--card-bg); }
  .table-custom th, .table-custom td { border-color: var(--border-color); background: transparent; color: var(--text-color); }

  .time-slot-row {
    background: rgba(0, 0, 0, 0.02);
    border: 1px dashed var(--border-color);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
  }

  @media (max-width: 991.98px) {
    .sidebar { width: 100%; height: auto; position: relative; }
    .content { margin-left: 0; padding: 15px; }
    .sidebar-menu { display: flex; overflow-x: auto; white-space: nowrap; background: var(--sidebar-mobile-bg); }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <div class="sidebar-menu">
    <a href="user-dashboard.html"><i class="fa fa-chart-line"></i> Dashboard</a>
    <a href="user-labs.html"><i class="fa fa-door-open"></i> Status Makmal</a>
    <a href="user-booking.html" class="active"><i class="fa fa-calendar-plus"></i> Lab Booking</a>
    <a href="user-notifications.html"><i class="fa fa-bell"></i> Notifications</a>
    <a href="user-profile.html"><i class="fa fa-user"></i> Profile</a>
    <a href="user-settings.html"><i class="fa fa-gear"></i> Settings</a>
    <a href="user-help.html"><i class="fa fa-robot"></i> AI Help Bot</a>
    <a href="#" id="logoutBtn"><i class="fa fa-sign-out-alt"></i> Logout</a>
  </div>
</div>

<div class="content">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div>
      <h3 class="mb-0">Lab Booking</h3>
      <p class="text-muted small mb-0">Permohonan tempahan akses makmal pengguna.</p>
    </div>
    <div id="userHeaderName" class="fw-bold text-primary">User 👤</div>
  </div>

  <div class="row g-4">
    <!-- Borang Tempahan -->
    <div class="col-12 col-lg-6">
      <div class="stat-card">
        <h5 class="fw-bold mb-3"><i class="fa-regular fa-pen-to-square me-2"></i>Borang Tempahan</h5>
        
        <form id="bookingForm">
          <div class="mb-3">
            <label class="form-label fw-bold small">Pilih Makmal</label>
            <select id="labSelect" class="form-select" required>
              <option value="">-- Pilih Makmal --</option>
              <option value="Makmal Komputer 1">Makmal Komputer 1</option>
              <option value="Makmal Komputer 2">Makmal Komputer 2</option>
              <option value="Makmal Rangkaian">Makmal Rangkaian</option>
              <option value="Makmal Siber">Makmal Siber</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small">Tarikh Tempahan</label>
            <input type="date" id="bookingDate" class="form-control" required>
          </div>

          <!-- Bekas Tempahan Masa Dinamik -->
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <label class="form-label fw-bold small mb-0">Waktu Tempahan (Slot Masa)</label>
              <button type="button" class="btn btn-sm btn-outline-primary" id="addTimeSlotBtn">
                <i class="fa fa-plus me-1"></i> Tambah Waktu
              </button>
            </div>
            
            <div id="timeSlotsContainer">
              <!-- Slot Masa Asal (Baris Pertama) -->
              <div class="time-slot-row">
                <div class="row g-2 align-items-center">
                  <div class="col-5">
                    <label class="form-label small text-muted mb-1">Masa Mula</label>
                    <input type="time" class="form-control startTime" required>
                  </div>
                  <div class="col-5">
                    <label class="form-label small text-muted mb-1">Masa Tamat</label>
                    <input type="time" class="form-control endTime" required>
                  </div>
                  <div class="col-2 text-end pt-3">
                    <button type="button" class="btn btn-sm btn-outline-danger remove-slot-btn" disabled>
                      <i class="fa fa-trash"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small">Tujuan / Catatan</label>
            <textarea id="bookingReason" class="form-control" rows="3" placeholder="Sebab penggunaan makmal..." required></textarea>
          </div>

          <button type="submit" class="btn btn-primary w-100 fw-bold" id="submitBookingBtn">
            <i class="fa fa-paper-plane me-2"></i>Hantar Permohonan
          </button>
        </form>
      </div>
    </div>

    <!-- Senarai Permohonan Pengguna -->
    <div class="col-12 col-lg-6">
      <div class="stat-card">
        <h5 class="fw-bold mb-3"><i class="fa-solid fa-list-check me-2"></i>Status Permohonan Saya</h5>
        
        <div class="table-responsive">
          <table class="table table-custom align-middle mb-0">
            <thead>
              <tr>
                <th>Makmal</th>
                <th>Tarikh & Masa</th>
                <th>Tujuan</th>
                <th>Status</th>
                <th>Tindakan</th>
              </tr>
            </thead>
            <tbody id="userBookingsTable">
              <tr>
                <td colspan="5" class="text-center text-muted py-4">Memuatkan permohonan...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  import { auth, db, ref, get, child, push, set, onValue, remove, onAuthStateChanged, signOut } from './firebase-config.js';

  let currentUserId = null;
  let currentUserEmail = "";
  let currentUserName = "User";

  // 1. TAMBAH / PADAM SLOT MASA DINAMIK
  const timeSlotsContainer = document.getElementById("timeSlotsContainer");
  const addTimeSlotBtn = document.getElementById("addTimeSlotBtn");

  addTimeSlotBtn.addEventListener("click", () => {
    const slotDiv = document.createElement("div");
    slotDiv.className = "time-slot-row";
    slotDiv.innerHTML = `
      <div class="row g-2 align-items-center">
        <div class="col-5">
          <label class="form-label small text-muted mb-1">Masa Mula</label>
          <input type="time" class="form-control startTime" required>
        </div>
        <div class="col-5">
          <label class="form-label small text-muted mb-1">Masa Tamat</label>
          <input type="time" class="form-control endTime" required>
        </div>
        <div class="col-2 text-end pt-3">
          <button type="button" class="btn btn-sm btn-outline-danger remove-slot-btn">
            <i class="fa fa-trash"></i>
          </button>
        </div>
      </div>
    `;
    timeSlotsContainer.appendChild(slotDiv);
    updateRemoveButtonsState();
  });

  timeSlotsContainer.addEventListener("click", (e) => {
    if (e.target.closest(".remove-slot-btn")) {
      const row = e.target.closest(".time-slot-row");
      if (document.querySelectorAll(".time-slot-row").length > 1) {
        row.remove();
        updateRemoveButtonsState();
      }
    }
  });

  function updateRemoveButtonsState() {
    const rows = document.querySelectorAll(".time-slot-row");
    rows.forEach((row) => {
      const btn = row.querySelector(".remove-slot-btn");
      if (rows.length === 1) {
        btn.setAttribute("disabled", "true");
      } else {
        btn.removeAttribute("disabled");
      }
    });
  }

  // 2. KAWALAN AKSES & PENGESAHAN PENGGUNA
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    currentUserId = user.uid;
    currentUserEmail = user.email || "";

    const dbRef = ref(db);
    const snapshot = await get(child(dbRef, `users/${currentUserId}`));

    if (snapshot.exists()) {
      const data = snapshot.val();
      if (data.name) currentUserName = data.name;
    } else {
      currentUserName = user.displayName || currentUserEmail.split('@')[0];
    }

    document.getElementById("userHeaderName").innerText = `${currentUserName} 👤`;
    loadUserBookings();
  });

  // 3. HANTAR BORANG TEMPAHAN DENGAN BANYAK SLOT MASA
  document.getElementById("bookingForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const labName = document.getElementById("labSelect").value;
    const date = document.getElementById("bookingDate").value;
    const reason = document.getElementById("bookingReason").value.trim();

    // Ambil kesemua slot masa yang diisi
    const startTimeInputs = document.querySelectorAll(".startTime");
    const endTimeInputs = document.querySelectorAll(".endTime");

    let timeSlots = [];
    let isValid = true;

    startTimeInputs.forEach((startInput, index) => {
      const startVal = startInput.value;
      const endVal = endTimeInputs[index].value;

      if (!startVal || !endVal) {
        isValid = false;
        return;
      }

      if (startVal >= endVal) {
        alert(`Slot masa ke-${index + 1}: Masa Tamat mesti selepas Masa Mula.`);
        isValid = false;
        return;
      }

      timeSlots.push(`${startVal} - ${endVal}`);
    });

    if (!isValid || timeSlots.length === 0) return;

    // Setiap slot masa dihantar sebagai entri permohonan berasingan atau gabungan slot
    try {
      const bookingsRef = ref(db, 'bookings');

      // Masukkan semua slot masa serentak ke Firebase
      const promises = timeSlots.map((timeRange) => {
        const newBookingRef = push(bookingsRef);
        return set(newBookingRef, {
          userId: currentUserId,
          userName: currentUserName,
          userEmail: currentUserEmail,
          labName: labName,
          date: date,
          timeSlot: timeRange,
          reason: reason,
          status: 'Pending',
          createdAt: new Date().toISOString()
        });
      });

      await Promise.all(promises);

      alert(`Berjaya menghantar ${timeSlots.length} slot masa permohonan tempahan!`);
      document.getElementById("bookingForm").reset();

      // Semula bentuk container ke 1 baris
      timeSlotsContainer.innerHTML = `
        <div class="time-slot-row">
          <div class="row g-2 align-items-center">
            <div class="col-5">
              <label class="form-label small text-muted mb-1">Masa Mula</label>
              <input type="time" class="form-control startTime" required>
            </div>
            <div class="col-5">
              <label class="form-label small text-muted mb-1">Masa Tamat</label>
              <input type="time" class="form-control endTime" required>
            </div>
            <div class="col-2 text-end pt-3">
              <button type="button" class="btn btn-sm btn-outline-danger remove-slot-btn" disabled>
                <i class="fa fa-trash"></i>
              </button>
            </div>
          </div>
        </div>
      `;

    } catch (err) {
      alert("Gagal menghantar permohonan: " + err.message);
    }
  });

  // 4. MUATKAN STATUS PERMOHONAN SAYA
  function loadUserBookings() {
    const bookingsRef = ref(db, 'bookings');
    onValue(bookingsRef, (snapshot) => {
      const tableBody = document.getElementById("userBookingsTable");
      tableBody.innerHTML = "";

      if (!snapshot.exists()) {
        tableBody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">Tiada rekod tempahan.</td></tr>`;
        return;
      }

      const bookings = snapshot.val();
      let hasData = false;

      // Susun mengikut rekod baharu
      const sortedKeys = Object.keys(bookings).reverse();

      sortedKeys.forEach((key) => {
        const item = bookings[key];

        if (item.userId === currentUserId || (item.userEmail && item.userEmail.toLowerCase() === currentUserEmail.toLowerCase())) {
          hasData = true;

          let statusBadge = `<span class="badge bg-warning text-dark">Pending</span>`;
          if (item.status === 'Approved' || item.status === 'Approved') {
            statusBadge = `<span class="badge bg-success">Approved</span>`;
          } else if (item.status === 'Cancelled' || item.status === 'Rejected') {
            statusBadge = `<span class="badge bg-secondary">Cancelled</span>`;
          }

          let actionBtn = item.status === 'Pending' || item.status === 'Approved'
            ? `<button class="btn btn-sm btn-outline-danger cancel-booking-btn" data-id="${key}"><i class="fa fa-ban me-1"></i>Batalkan</button>`
            : `-`;

          tableBody.innerHTML += `
            <tr>
              <td><strong>${item.labName}</strong></td>
              <td>${item.date}<br><small class="text-muted">${item.timeSlot}</small></td>
              <td>${item.reason}</td>
              <td>${statusBadge}</td>
              <td>${actionBtn}</td>
            </tr>
          `;
        }
      });

      if (!hasData) {
        tableBody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">Tiada rekod tempahan.</td></tr>`;
      }
    });
  }

  // 5. BATALKAN TEMPAHAN
  document.getElementById("userBookingsTable").addEventListener("click", async (e) => {
    const btn = e.target.closest(".cancel-booking-btn");
    if (btn) {
      const bookingId = btn.getAttribute("data-id");
      if (confirm("Adakah anda pasti untuk membatalkan tempahan ini?")) {
        try {
          await set(ref(db, `bookings/${bookingId}/status`), 'Cancelled');
          alert("Tempahan telah dibatalkan.");
        } catch (err) {
          alert("Gagal membatalkan: " + err.message);
        }
      }
    }
  });

  // LOGOUT
  document.getElementById("logoutBtn").addEventListener("click", (e) => {
    e.preventDefault();
    signOut(auth).then(() => {
      window.location.href = "index.html";
    });
  });
</script>

</body>
</html>
