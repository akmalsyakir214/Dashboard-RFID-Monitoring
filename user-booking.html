<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Booking - Smart Access</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
</script>

<style>
  :root {
    --bg-color: #f4f6f9;
    --text-color: #212529;
    --card-bg: #ffffff;
    --sidebar-bg: #032b67;
    --sidebar-hover: #00aaff;
    --sidebar-mobile-bg: #021f4b;
    --border-color: #dee2e6;
    --input-bg: #ffffff;
    --input-text: #212529;
    --subtext-color: #6c757d;
  }

  html.dark-mode, body.dark-mode {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --card-bg: #1e1e1e;
    --sidebar-bg: #0b192c;
    --sidebar-hover: #00aaff;
    --sidebar-mobile-bg: #070f1e;
    --border-color: #333333;
    --input-bg: #2d2d2d;
    --input-text: #ffffff;
    --subtext-color: #b0b0b0;
  }

  body { 
    background: var(--bg-color); 
    color: var(--text-color);
    font-family: 'Segoe UI', sans-serif; 
    margin: 0;
    transition: background 0.3s, color 0.3s;
  }

  .text-muted {
    color: var(--subtext-color) !important;
  }

  .sidebar { 
    width: 240px; 
    height: 100vh; 
    background: var(--sidebar-bg); 
    position: fixed; 
    color: white; 
    top: 0; 
    left: 0; 
    z-index: 1000;
  }

  .logo { text-align: center; padding: 20px; border-bottom: 1px solid rgba(255,255,255,.2); }
  .logo h5 { margin-top: 10px; }
  
  .sidebar a { 
    display: block; 
    color: white; 
    text-decoration: none; 
    padding: 12px 20px; 
    transition: background 0.2s, color 0.2s; 
  }

  .sidebar a:hover, 
  .sidebar a.active { 
    background: var(--sidebar-hover); 
    color: #ffffff;
    font-weight: 600;
  }

  .content { margin-left: 240px; padding: 20px; }

  .stat-card {
    background: var(--card-bg);
    color: var(--text-color);
    border-radius: 10px;
    border: 1px solid var(--border-color);
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: background 0.3s, color 0.3s, border-color 0.3s;
  }

  .form-control, .form-select {
    background-color: var(--input-bg);
    color: var(--input-text);
    border-color: var(--border-color);
  }

  .table-custom { color: var(--text-color); background: var(--card-bg); }
  .table-custom th, .table-custom td { border-color: var(--border-color); background: transparent; color: var(--text-color); }

  .time-slot-row {
    background: rgba(0, 0, 0, 0.02);
    border: 1px dashed var(--border-color);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
  }

  body.dark-mode .time-slot-row {
    background: rgba(255, 255, 255, 0.02);
  }

  .time-badge {
    display: inline-block;
    background: rgba(13, 110, 253, 0.12);
    color: #0d6efd;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.8rem;
    font-weight: 600;
    margin: 2px 2px 2px 0;
  }

  body.dark-mode .time-badge {
    background: rgba(59, 130, 246, 0.2);
    color: #60a5fa;
  }

  @media (max-width: 991.98px) {
    .sidebar { width: 100%; height: auto; position: relative; }
    .content { margin-left: 0; padding: 15px; }
    .sidebar-menu { display: flex; overflow-x: auto; white-space: nowrap; background: var(--sidebar-mobile-bg); }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <div class="sidebar-menu">
    <a href="user-dashboard.html"><i class="fa fa-chart-line"></i> <span data-i18n="nav_dashboard">Dashboard</span></a>
    <a href="user-booking.html"><i class="fa fa-calendar-plus"></i> <span data-i18n="nav_booking">Lab Booking</span></a>
    <a href="user-profile.html"><i class="fa fa-user"></i> <span data-i18n="nav_profile">Profile</span></a>
    <a href="user-settings.html"><i class="fa fa-gear"></i> <span data-i18n="nav_settings">Settings</span></a>
    <a href="logout.html"><i class="fa fa-sign-out-alt"></i> <span data-i18n="nav_logout">Logout</span></a>
  </div>
</div>

<div class="content">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div>
      <h3 class="mb-0" data-i18n="page_title">Lab Booking</h3>
      <p class="text-muted small mb-0" data-i18n="page_desc">Permohonan tempahan akses makmal pengguna.</p>
    </div>
    <div id="userHeaderName" class="fw-bold text-primary">User 👤</div>
  </div>

  <div class="row g-4">
    <!-- Borang Tempahan -->
    <div class="col-12 col-lg-5">
      <div class="stat-card">
        <h5 class="fw-bold mb-3"><i class="fa-regular fa-pen-to-square me-2"></i><span data-i18n="form_title">Borang Tempahan</span></h5>
        
        <form id="bookingForm">
          <input type="hidden" id="bookingDay">

          <div class="mb-3">
            <label class="form-label fw-bold small" data-i18n="label_select_lab">Pilih Makmal</label>
            <select id="labSelect" class="form-select" required>
              <option value="" data-i18n="opt_default_lab">-- Pilih Makmal --</option>
              <option value="Makmal Komputer 1">Makmal Komputer 1</option>
              <option value="Makmal Komputer 2">Makmal Komputer 2</option>
              <option value="Makmal Rangkaian">Makmal Rangkaian</option>
              <option value="Makmal Siber">Makmal Siber</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small" data-i18n="label_booking_date">Tarikh Tempahan</label>
            <input type="date" id="bookingDate" class="form-control" required>
          </div>

          <!-- Bekas Tempahan Masa Dinamik -->
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <label class="form-label fw-bold small mb-0" data-i18n="label_time_slots">Waktu Tempahan (Slot Masa)</label>
              <button type="button" class="btn btn-sm btn-outline-primary" id="addTimeSlotBtn">
                <i class="fa fa-plus me-1"></i> <span data-i18n="btn_add_time">Tambah Waktu</span>
              </button>
            </div>
            
            <div id="timeSlotsContainer">
              <div class="time-slot-row">
                <div class="row g-2 align-items-center">
                  <div class="col-5">
                    <label class="form-label small text-muted mb-1" data-i18n="label_start_time">Masa Mula</label>
                    <input type="time" class="form-control startTime" required>
                  </div>
                  <div class="col-5">
                    <label class="form-label small text-muted mb-1" data-i18n="label_end_time">Masa Tamat</label>
                    <input type="time" class="form-control endTime" required>
                  </div>
                  <div class="col-2 text-end pt-3">
                    <button type="button" class="btn btn-sm btn-outline-danger remove-slot-btn" disabled>
                      <i class="fa fa-trash"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small" data-i18n="label_reason">Tujuan / Catatan</label>
            <textarea id="bookingReason" class="form-control" rows="3" data-i18n-placeholder="placeholder_reason" placeholder="Sebab penggunaan makmal..." required></textarea>
          </div>

          <button type="submit" class="btn btn-primary w-100 fw-bold" id="submitBookingBtn">
            <i class="fa fa-paper-plane me-2"></i><span data-i18n="btn_submit">Hantar Permohonan</span>
          </button>
        </form>
      </div>
    </div>

    <!-- Senarai Permohonan Pengguna -->
    <div class="col-12 col-lg-7">
      <div class="stat-card">
        <h5 class="fw-bold mb-3"><i class="fa-solid fa-list-check me-2"></i><span data-i18n="my_status_title">Status Permohonan Saya</span></h5>
        
        <div class="table-responsive">
          <table class="table table-custom align-middle mb-0">
            <thead>
              <tr>
                <th data-i18n="th_lab">Makmal</th>
                <th data-i18n="th_datetime">Tarikh & Masa</th>
                <th data-i18n="th_reason">Tujuan</th>
                <th data-i18n="th_status">Status</th>
                <th data-i18n="th_action">Tindakan</th>
              </tr>
            </thead>
            <tbody id="userBookingsTable">
              <tr>
                <td colspan="5" class="text-center text-muted py-4" data-i18n="loading_text">Memuatkan permohonan...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- KAMUS TERJEMAHAN BAHASA (I18N) -->
<script>
  const translations = {
    en: {
      nav_dashboard: "Dashboard",
      nav_booking: "Lab Booking",
      nav_profile: "Profile",
      nav_settings: "Settings",
      nav_logout: "Logout",
      page_title: "Lab Booking",
      page_desc: "User lab access booking application.",
      form_title: "Booking Form",
      label_select_lab: "Select Lab",
      opt_default_lab: "-- Select Lab --",
      label_booking_date: "Booking Date",
      label_time_slots: "Booking Time (Time Slots)",
      btn_add_time: "Add Time",
      label_start_time: "Start Time",
      label_end_time: "End Time",
      label_reason: "Purpose / Notes",
      placeholder_reason: "Reason for lab usage...",
      btn_submit: "Submit Application",
      my_status_title: "My Booking Status",
      th_lab: "Lab",
      th_datetime: "Date & Time",
      th_reason: "Purpose",
      th_status: "Status",
      th_action: "Action",
      loading_text: "Loading applications...",
      status_pending: "Pending",
      status_approved: "Approved",
      status_rejected: "Rejected",
      status_cancelled: "Cancelled",
      btn_cancel: "Cancel",
      no_records: "No booking records.",
      confirm_cancel: "Are you sure you want to cancel this booking?",
      alert_success: "Successfully submitted booking application!",
      alert_time_err: "End time must be after start time."
    },
    ms: {
      nav_dashboard: "Utama (Dashboard)",
      nav_booking: "Tempahan Makmal",
      nav_profile: "Profil",
      nav_settings: "Tetapan",
      nav_logout: "Log Keluar",
      page_title: "Lab Booking",
      page_desc: "Permohonan tempahan akses makmal pengguna.",
      form_title: "Borang Tempahan",
      label_select_lab: "Pilih Makmal",
      opt_default_lab: "-- Pilih Makmal --",
      label_booking_date: "Tarikh Tempahan",
      label_time_slots: "Waktu Tempahan (Slot Masa)",
      btn_add_time: "Tambah Waktu",
      label_start_time: "Masa Mula",
      label_end_time: "Masa Tamat",
      label_reason: "Tujuan / Catatan",
      placeholder_reason: "Sebab penggunaan makmal...",
      btn_submit: "Hantar Permohonan",
      my_status_title: "Status Permohonan Saya",
      th_lab: "Makmal",
      th_datetime: "Tarikh & Masa",
      th_reason: "Tujuan",
      th_status: "Status",
      th_action: "Tindakan",
      loading_text: "Memuatkan permohonan...",
      status_pending: "Pending",
      status_approved: "Approved",
      status_rejected: "Rejected",
      status_cancelled: "Cancelled",
      btn_cancel: "Batalkan",
      no_records: "Tiada rekod tempahan.",
      confirm_cancel: "Adakah anda pasti untuk membatalkan tempahan ini?",
      alert_success: "Berjaya menghantar permohonan tempahan!",
      alert_time_err: "Masa Tamat mesti selepas Masa Mula."
    }
  };

  function setLanguage(lang) {
    document.querySelectorAll("[data-i18n]").forEach(element => {
      const key = element.getAttribute("data-i18n");
      if (translations[lang] && translations[lang][key]) {
        element.innerText = translations[lang][key];
      }
    });

    document.querySelectorAll("[data-i18n-placeholder]").forEach(element => {
      const key = element.getAttribute("data-i18n-placeholder");
      if (translations[lang] && translations[lang][key]) {
        element.setAttribute("placeholder", translations[lang][key]);
      }
    });
  }

  document.addEventListener("DOMContentLoaded", () => {
    const savedLang = localStorage.getItem("language") || "en";
    setLanguage(savedLang);

    const currentPath = window.location.pathname.split("/").pop();
    const sidebarLinks = document.querySelectorAll(".sidebar-menu a");

    sidebarLinks.forEach(link => {
      const href = link.getAttribute("href");
      if (href === currentPath) {
        link.classList.add("active");
      } else {
        link.classList.remove("active");
      }
    });

    const todayStr = new Date().toISOString().split('T')[0];
    const dateInput = document.getElementById("bookingDate");
    if (dateInput) {
      dateInput.setAttribute("min", todayStr);
    }

    const savedBooking = localStorage.getItem("autoSelectBooking");
    if (savedBooking) {
      try {
        const data = JSON.parse(savedBooking);

        const labSelect = document.getElementById("labSelect");
        const bookingDate = document.getElementById("bookingDate");
        const bookingDay = document.getElementById("bookingDay");

        if (labSelect && data.lab) labSelect.value = data.lab;
        if (bookingDate && data.date) bookingDate.value = data.date;
        if (bookingDay && data.day) bookingDay.value = data.day;

        const startTimeInput = document.querySelector(".startTime");
        const endTimeInput = document.querySelector(".endTime");

        if (startTimeInput && data.startTime) {
          startTimeInput.value = data.startTime;
          startTimeInput.readOnly = true;
          startTimeInput.style.backgroundColor = "var(--input-bg)";
          startTimeInput.style.opacity = "0.7";
        }

        if (endTimeInput && data.endTime) {
          endTimeInput.value = data.endTime;
          endTimeInput.readOnly = true;
          endTimeInput.style.backgroundColor = "var(--input-bg)";
          endTimeInput.style.opacity = "0.7";
        }

        const addTimeBtn = document.getElementById("addTimeSlotBtn");
        if (addTimeBtn) addTimeBtn.style.display = "none";

      } catch (e) {
        console.error("Ralat membaca data autoSelectBooking:", e);
      }

      localStorage.removeItem("autoSelectBooking");
    }

    document.getElementById("bookingDate").addEventListener("change", (e) => {
      if (e.target.value) {
        const d = new Date(e.target.value);
        const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        document.getElementById("bookingDay").value = days[d.getDay()];
      }
    });
  });
</script>

<script type="module">
  import { auth, db, ref, get, child, push, set, update, onValue } from './firebase-config.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
    document.body.classList.add("dark-mode");
  }

  let currentUserId = null;
  let currentUserEmail = "";
  let currentUserName = "User";

  const timeSlotsContainer = document.getElementById("timeSlotsContainer");
  const addTimeSlotBtn = document.getElementById("addTimeSlotBtn");

  addTimeSlotBtn.addEventListener("click", () => {
    const slotDiv = document.createElement("div");
    slotDiv.className = "time-slot-row";
    slotDiv.innerHTML = `
      <div class="row g-2 align-items-center">
        <div class="col-5">
          <label class="form-label small text-muted mb-1" data-i18n="label_start_time">${localStorage.getItem("language") === 'ms' ? 'Masa Mula' : 'Start Time'}</label>
          <input type="time" class="form-control startTime" required>
        </div>
        <div class="col-5">
          <label class="form-label small text-muted mb-1" data-i18n="label_end_time">${localStorage.getItem("language") === 'ms' ? 'Masa Tamat' : 'End Time'}</label>
          <input type="time" class="form-control endTime" required>
        </div>
        <div class="col-2 text-end pt-3">
          <button type="button" class="btn btn-sm btn-outline-danger remove-slot-btn">
            <i class="fa fa-trash"></i>
          </button>
        </div>
      </div>
    `;
    timeSlotsContainer.appendChild(slotDiv);
    updateRemoveButtonsState();
  });

  timeSlotsContainer.addEventListener("click", (e) => {
    if (e.target.closest(".remove-slot-btn")) {
      const row = e.target.closest(".time-slot-row");
      if (document.querySelectorAll(".time-slot-row").length > 1) {
        row.remove();
        updateRemoveButtonsState();
      }
    }
  });

  function updateRemoveButtonsState() {
    const rows = document.querySelectorAll(".time-slot-row");
    rows.forEach((row) => {
      const btn = row.querySelector(".remove-slot-btn");
      if (rows.length === 1) {
        btn.setAttribute("disabled", "true");
      } else {
        btn.removeAttribute("disabled");
      }
    });
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    currentUserId = user.uid;
    currentUserEmail = user.email || "";

    const dbRef = ref(db);
    try {
      const snapshot = await get(child(dbRef, `users/${currentUserId}`));
      if (snapshot.exists() && snapshot.val().name) {
        currentUserName = snapshot.val().name;
      } else {
        currentUserName = user.displayName || currentUserEmail.split('@')[0];
      }
    } catch (e) {
      console.error(e);
      currentUserName = user.displayName || "User";
    }

    document.getElementById("userHeaderName").innerText = `${currentUserName} 👤`;
    loadUserBookings();
  });

  function timeToMinutes(t) {
    if (!t) return 0;
    const cleanT = t.trim();
    const parts = cleanT.split(':');
    const h = parseInt(parts[0], 10) || 0;
    const m = parseInt(parts[1], 10) || 0;
    return h * 60 + m;
  }

  function getDayNameFromDate(dateStr) {
    if (!dateStr) return 'Monday';
    const d = new Date(dateStr);
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    return days[d.getDay()] || 'Monday';
  }

  async function checkBookingConflict(labName, dateStr, newStartMin, newEndMin) {
    const dbRef = ref(db);

    const requestsSnap = await get(child(dbRef, 'lab_requests'));
    if (requestsSnap.exists()) {
      const requests = requestsSnap.val();
      for (let key in requests) {
        const item = requests[key];
        const itemStatus = (item.status || '').toLowerCase();
        
        if (itemStatus === 'pending' || itemStatus === 'approved' || itemStatus === 'diluluskan') {
          const itemLab = (item.labName || item.lab || '').trim();
          const itemDate = (item.bookingDate || item.date || '').trim();

          if (itemLab.toLowerCase() === labName.toLowerCase() && itemDate === dateStr) {
            let slots = [];
            if (item.timeSlots && Array.isArray(item.timeSlots)) {
              slots = item.timeSlots;
            } else if (item.timeSlot || item.time) {
              slots = [item.timeSlot || item.time];
            }

            for (let slot of slots) {
              const parts = slot.split('-');
              if (parts.length === 2) {
                const existingStart = timeToMinutes(parts[0]);
                const existingEnd = timeToMinutes(parts[1]);

                if (newStartMin < existingEnd && newEndMin > existingStart) {
                  return true;
                }
              }
            }
          }
        }
      }
    }

    const schedulesSnap = await get(child(dbRef, 'lab_schedules'));
    if (schedulesSnap.exists()) {
      const schedules = schedulesSnap.val();
      const targetDay = getDayNameFromDate(dateStr);

      for (let key in schedules) {
        const sched = schedules[key];
        const schedLab = (sched.labName || '').trim();
        const schedDay = (sched.day || '').trim();

        if (schedLab.toLowerCase() === labName.toLowerCase() && schedDay.toLowerCase() === targetDay.toLowerCase()) {
          const schedStart = timeToMinutes(sched.startTime);
          const schedEnd = timeToMinutes(sched.endTime);

          if (newStartMin < schedEnd && newEndMin > schedStart) {
            return true;
          }
        }
      }
    }

    return false;
  }

  document.getElementById("bookingForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const labName = document.getElementById("labSelect").value;
    const bookingDate = document.getElementById("bookingDate").value;
    const bookingDay = document.getElementById("bookingDay").value;
    const reason = document.getElementById("bookingReason").value.trim();

    const startTimeInputs = document.querySelectorAll(".startTime");
    const endTimeInputs = document.querySelectorAll(".endTime");

    let timeSlots = [];
    let isValid = true;
    const lang = localStorage.getItem("language") || "en";

    startTimeInputs.forEach((startInput, index) => {
      const startVal = startInput.value;
      const endVal = endTimeInputs[index].value;

      if (!startVal || !endVal) {
        isValid = false;
        return;
      }

      if (startVal >= endVal) {
        alert(translations[lang].alert_time_err);
        isValid = false;
        return;
      }

      timeSlots.push(`${startVal}-${endVal}`);
    });

    if (!isValid || timeSlots.length === 0) return;

    const submitBtn = document.getElementById("submitBookingBtn");
    submitBtn.disabled = true;
    submitBtn.innerHTML = `<i class="fa fa-spinner fa-spin me-2"></i>${lang === 'ms' ? 'Memeriksa ketersediaan...' : 'Checking availability...'}`;

    try {
      for (let slot of timeSlots) {
        const [sTime, eTime] = slot.split('-');
        const sMin = timeToMinutes(sTime);
        const eMin = timeToMinutes(eTime);

        const hasConflict = await checkBookingConflict(labName, bookingDate, sMin, eMin);
        if (hasConflict) {
          alert(lang === 'ms' ? `Ralat: Makmal "${labName}" sudah ditempah atau mempunyai kelas pada slot waktu (${slot}) pada tarikh tersebut!` : `Error: Lab "${labName}" is already booked or has class during slot (${slot}) on that date!`);
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i class="fa fa-paper-plane me-2"></i>${translations[lang].btn_submit}`;
          return;
        }
      }

      const requestsRef = ref(db, 'lab_requests');
      const newRequestRef = push(requestsRef);

      await set(newRequestRef, {
        userId: currentUserId,
        userName: currentUserName,
        userEmail: currentUserEmail,
        labName: labName,
        bookingDate: bookingDate,
        bookingDay: bookingDay,
        timeSlots: timeSlots,
        reason: reason,
        status: 'Pending',
        createdAt: new Date().toISOString()
      });

      alert(translations[lang].alert_success);
      document.getElementById("bookingForm").reset();

      const addTimeBtn = document.getElementById("addTimeSlotBtn");
      if (addTimeBtn) addTimeBtn.style.display = "inline-block";

      timeSlotsContainer.innerHTML = `
        <div class="time-slot-row">
          <div class="row g-2 align-items-center">
            <div class="col-5">
              <label class="form-label small text-muted mb-1" data-i18n="label_start_time">${lang === 'ms' ? 'Masa Mula' : 'Start Time'}</label>
              <input type="time" class="form-control startTime" required>
            </div>
            <div class="col-5">
              <label class="form-label small text-muted mb-1" data-i18n="label_end_time">${lang === 'ms' ? 'Masa Tamat' : 'End Time'}</label>
              <input type="time" class="form-control endTime" required>
            </div>
            <div class="col-2 text-end pt-3">
              <button type="button" class="btn btn-sm btn-outline-danger remove-slot-btn" disabled>
                <i class="fa fa-trash"></i>
              </button>
            </div>
          </div>
        </div>
      `;

    } catch (err) {
      alert("Error: " + err.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = `<i class="fa fa-paper-plane me-2"></i>${translations[lang].btn_submit}`;
    }
  });

  function loadUserBookings() {
    const requestsRef = ref(db, 'lab_requests');
    onValue(requestsRef, (snapshot) => {
      const tableBody = document.getElementById("userBookingsTable");
      tableBody.innerHTML = "";
      const lang = localStorage.getItem("language") || "en";

      if (!snapshot.exists()) {
        tableBody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">${translations[lang].no_records}</td></tr>`;
        return;
      }

      const requests = snapshot.val();
      let hasData = false;
      const sortedKeys = Object.keys(requests).reverse();

      sortedKeys.forEach((key) => {
        const item = requests[key];

        if (item.userId === currentUserId || (item.userEmail && item.userEmail.toLowerCase() === currentUserEmail.toLowerCase())) {
          hasData = true;

          const rawStatus = (item.status || 'pending').toLowerCase();
          let statusBadge = `<span class="badge bg-warning text-dark">Pending</span>`;

          if (rawStatus === 'approved' || rawStatus === 'diluluskan') {
            statusBadge = `<span class="badge bg-success">Approved</span>`;
          } else if (rawStatus === 'rejected' || rawStatus === 'ditolak') {
            statusBadge = `<span class="badge bg-danger">Rejected</span>`;
          } else if (rawStatus === 'cancelled' || rawStatus === 'dibatalkan') {
            statusBadge = `<span class="badge bg-secondary">Cancelled</span>`;
          }

          let timeDisplay = "";
          if (item.timeSlots && Array.isArray(item.timeSlots)) {
            timeDisplay = item.timeSlots.map(t => `<span class="time-badge"><i class="fa-regular fa-clock me-1"></i>${t}</span>`).join(" ");
          } else if (item.timeSlot || item.time) {
            timeDisplay = `<span class="time-badge"><i class="fa-regular fa-clock me-1"></i>${item.timeSlot || item.time}</span>`;
          } else {
            timeDisplay = `<small class="text-muted">N/A</small>`;
          }

          let actionBtn = (rawStatus === 'pending' || rawStatus === 'approved')
            ? `<button class="btn btn-sm btn-outline-danger cancel-booking-btn" data-id="${key}"><i class="fa fa-ban me-1"></i>${translations[lang].btn_cancel}</button>`
            : `-`;

          const displayDate = item.bookingDate || item.date || 'N/A';
          const displayReason = item.reason || item.purpose || '-';
          const displayLab = item.labName || item.lab || 'Makmal';

          tableBody.innerHTML += `
            <tr>
              <td><strong>${displayLab}</strong></td>
              <td>${displayDate}<br>${timeDisplay}</td>
              <td>${displayReason}</td>
              <td>${statusBadge}</td>
              <td>${actionBtn}</td>
            </tr>
          `;
        }
      });

      if (!hasData) {
        tableBody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">${translations[lang].no_records}</td></tr>`;
      }
    });
  }

  document.getElementById("userBookingsTable").addEventListener("click", async (e) => {
    const btn = e.target.closest(".cancel-booking-btn");
    if (btn) {
      const requestId = btn.getAttribute("data-id");
      const lang = localStorage.getItem("language") || "en";
      if (confirm(translations[lang].confirm_cancel)) {
        try {
          await update(ref(db, `lab_requests/${requestId}`), {
            status: 'Cancelled',
            updatedAt: new Date().toISOString()
          });
        } catch (err) {
          alert("Error: " + err.message);
        }
      }
    }
  });
</script>

</body>
</html>
