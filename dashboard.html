<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Smart Access</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
body{ background:#f4f6f9; font-family:'Segoe UI',sans-serif; }

/* SIDEBAR DASHBOARD */
.sidebar{ width:240px; height:100vh; background:#032b67; position:fixed; color:white; top:0; left:0; }
.logo{ text-align:center; padding:20px; border-bottom:1px solid rgba(255,255,255,.2); }
.logo h5{ margin-top:10px; }
.sidebar a{ display:block; color:white; text-decoration:none; padding:12px 20px; }
.sidebar a:hover, .sidebar a.active{ background:#0d6efd; }

/* MAIN CONTENT */
.content{ margin-left:240px; padding:20px; }
.card-box{ border:none; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.1); }
.value{ font-size:28px; font-weight:bold; }
.green{ color:green; } .red{ color:red; } .blue{ color:#0d6efd; }
.chart-box, .table-box{ background:white; padding:20px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.1); }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <a href="dashboard.html" class="active"><i class="fa fa-chart-line"></i> Dashboard</a>
  <a href="users.html"><i class="fa fa-users"></i> Users</a>
  <a href="accesslog.html"><i class="fa fa-clock"></i> Access Log</a>
  <a href="laboratory.html"><i class="fa fa-building"></i> Laboratories</a>
  <a href="reports.html"><i class="fa fa-file"></i> Reports</a>
  <a href="notification.html"><i class="fa fa-bell"></i> Notifications</a>
  <a href="settings.html"><i class="fa fa-cog"></i> Settings</a>
  <a href="profile.html"><i class="fa fa-user"></i> Profile</a>
  <a href="logout.html"><i class="fa fa-sign-out-alt"></i> Logout</a>
</div>

<!-- MAIN CONTENT -->
<div class="content">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3>Dashboard</h3>
    <div>Admin 👤</div>
  </div>

  <div class="row">
    <div class="col-md-2"><div class="card card-box p-3"><small>Total Access</small><div class="value" id="totalAccess">0</div></div></div>
    <div class="col-md-2"><div class="card card-box p-3"><small>Successful Access</small><div class="value green" id="successAccess">0</div></div></div>
    <div class="col-md-2"><div class="card card-box p-3"><small>Failed Access</small><div class="value red" id="failedAccess">0</div></div></div>
    <div class="col-md-2"><div class="card card-box p-3"><small>Today's Access</small><div class="value blue" id="todayAccess">0</div></div></div>
    <div class="col-md-2"><div class="card card-box p-3"><small>Active Labs</small><div class="value" id="activeLabs">0</div></div></div>
  </div>

  <div class="row mt-4">
    <div class="col-md-8">
      <div class="chart-box">
        <h5>Access Statistics</h5>
        <canvas id="lineChart"></canvas>
      </div>
    </div>
    <div class="col-md-4">
      <div class="chart-box">
        <h5>Access Distribution</h5>
        <canvas id="pieChart"></canvas>
      </div>
    </div>
  </div>

  <div class="row mt-4">
    <div class="col-md-12">
      <div class="table-box">
        <h5>Recent Activity</h5>
        <table class="table">
          <thead>
            <tr><th>Name</th><th>Location</th><th>Time</th><th>Status</th></tr>
          </thead>
          <tbody id="recentTable"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module">
  import { auth, signOut, onAuthStateChanged, db, ref, onValue } from './firebase-config.js';

  // 1. SEMAKAN KESELAMATAN (DITUKAR KE index.html)
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "index.html";
    }
  });

  // 2. FUNGSI LOGOUT (DITUKAR KE index.html)
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", (e) => {
      e.preventDefault();
      
      signOut(auth)
        .then(() => {
          window.location.href = "index.html";
        })
        .catch((error) => {
          console.error("Logout Error:", error);
          alert("Gagal untuk log keluar. Sila cuba lagi.");
        });
    });
  }

  // 3. AMBIL DATA REALTIME
  let pieChartInstance = null;

  onValue(ref(db, 'access_logs'), (snapshot) => {
    const data = snapshot.val();
    let total = 0, success = 0, failed = 0, today = 0;
    const recentTable = document.getElementById("recentTable");
    recentTable.innerHTML = "";

    if (data) {
      const keys = Object.keys(data);
      total = keys.length;
      const todayStr = new Date().toISOString().split('T')[0];

      const sortedLogs = keys.map(k => data[k]).reverse();

      sortedLogs.forEach((log, idx) => {
        const status = (log.status || '').toLowerCase();
        if (status.includes('success') || status.includes('granted')) success++;
        else failed++;

        if (log.date === todayStr) today++;

        if (idx < 5) {
          const badge = (status.includes('success') || status.includes('granted')) 
            ? '<span class="badge bg-success">Success</span>' 
            : '<span class="badge bg-danger">Failed</span>';

          recentTable.innerHTML += `
            <tr>
              <td>${log.userName || log.name || 'Unknown'}</td>
              <td>${log.labName || log.location || 'N/A'}</td>
              <td>${log.time || 'N/A'}</td>
              <td>${badge}</td>
            </tr>`;
        }
      });
    }

    document.getElementById("totalAccess").innerText = total;
    document.getElementById("successAccess").innerText = success;
    document.getElementById("failedAccess").innerText = failed;
    document.getElementById("todayAccess").innerText = today;

    if (pieChartInstance) pieChartInstance.destroy();
    pieChartInstance = new Chart(document.getElementById("pieChart"), {
      type: "doughnut",
      data: {
        labels: ["Success", "Failed"],
        datasets: [{ data: [success, failed], backgroundColor: ['#28a745', '#dc3545'] }]
      }
    });
  });

  onValue(ref(db, 'laboratories'), (snapshot) => {
    const labs = snapshot.val();
    document.getElementById("activeLabs").innerText = labs ? Object.keys(labs).length : 0;
  });

  new Chart(document.getElementById("lineChart"), {
    type: "line",
    data: {
      labels: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
      datasets: [{ label: "Access Trend", data: [12, 19, 3, 5, 2, 3, 10], borderColor: '#0d6efd', fill: false }]
    }
  });
</script>
</body>
</html>
