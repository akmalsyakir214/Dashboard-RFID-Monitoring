<script type="module">
  import { auth, signOut, onAuthStateChanged, db, ref, get, child, onValue } from './firebase-config.js';

  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
  }

  // Semakan keselamatan peranan (Role Check) untuk Admin
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    const dbRef = ref(db);
    let userRole = 'user';
    let userName = user.email || 'Admin';

    const snapshot = await get(child(dbRef, `users/${user.uid}`));
    if (snapshot.exists()) {
      const data = snapshot.val();
      if (data.role) userRole = data.role.toString().toLowerCase();
      if (data.name) userName = data.name;
    } else {
      const allUsersSnap = await get(child(dbRef, 'users'));
      if (allUsersSnap.exists()) {
        const allUsers = allUsersSnap.val();
        Object.keys(allUsers).forEach(key => {
          if (allUsers[key].email && allUsers[key].email.toLowerCase() === user.email.toLowerCase()) {
            if (allUsers[key].role) userRole = allUsers[key].role.toString().toLowerCase();
            if (allUsers[key].name) userName = allUsers[key].name;
          }
        });
      }
    }

    if (userRole !== 'admin') {
      alert("Akses ditolak! Halaman ini khusus untuk Pentadbir (Admin) sahaja.");
      window.location.href = "user-dashboard.html";
      return;
    }

    document.getElementById("adminNameDisplay").innerHTML = `${userName} 👤`;
  });

  // Fungsi Log Keluar (Logout)
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", (e) => {
      e.preventDefault();
      signOut(auth)
        .then(() => window.location.href = "index.html")
        .catch((error) => console.error("Logout Error:", error));
    });
  }

  let pieChartInstance = null;

  // Paparan Data Akses Log Masa Nyata (Real-Time Lookup)
  onValue(ref(db, 'access_logs'), async (snapshot) => {
    const data = snapshot.val();
    let total = 0, success = 0, failed = 0, today = 0;
    const recentTable = document.getElementById("recentTable");
    recentTable.innerHTML = "";

    if (data) {
      // Ambil senarai semua pengguna dari node /users untuk padanan RFID UID
      const usersSnap = await get(ref(db, 'users'));
      const usersData = usersSnap.exists() ? usersSnap.val() : {};

      // Membina peta (map) rfid_uid -> nama pengguna
      const rfidUserMap = {};
      Object.keys(usersData).forEach(uidKey => {
        const u = usersData[uidKey];
        if (u.rfid) {
          rfidUserMap[u.rfid.toUpperCase()] = u.name || u.email || 'Unknown';
        }
      });

      const keys = Object.keys(data);
      total = keys.length;

      // Tarikh hari ini dalam format YYYY-MM-DD
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const todayStr = `${year}-${month}-${day}`;

      const sortedLogs = keys.map(k => data[k]).reverse();

      sortedLogs.forEach((log, idx) => {
        const status = (log.status || '').toLowerCase();
        const isSuccess = status.includes('success') || status.includes('granted') || status === 'allowed';

        if (isSuccess) success++;
        else failed++;

        // Semakan tarikh log berbanding tarikh hari ini
        const logTimestamp = log.timestamp || log.time || '';
        if (log.date === todayStr || logTimestamp.startsWith(todayStr)) {
          today++;
        }

        if (idx < 5) {
          // Cari nama berdasarkan log.userName, log.name, atau pemadanan RFID Card UID
          let displayName = log.userName || log.name;
          if (!displayName || displayName === 'Unknown') {
            const scannedUid = (log.uid || '').toUpperCase();
            displayName = rfidUserMap[scannedUid] || `Kad (${scannedUid || 'Tidak Dikenali'})`;
          }

          const locationName = log.labName || log.location || 'Makmal Utama';
          const timeDisplay = logTimestamp || 'N/A';

          const badge = isSuccess 
            ? '<span class="badge bg-success">Success</span>' 
            : '<span class="badge bg-danger">Failed</span>';

          recentTable.innerHTML += `
            <tr>
              <td><strong>${displayName}</strong></td>
              <td>${locationName}</td>
              <td>${timeDisplay}</td>
              <td>${badge}</td>
            </tr>`;
        }
      });
    } else {
      recentTable.innerHTML = `<tr><td colspan="4" class="text-center text-muted">Tiada rekod aktiviti terkini.</td></tr>`;
    }

    document.getElementById("totalAccess").innerText = total;
    document.getElementById("successAccess").innerText = success;
    document.getElementById("failedAccess").innerText = failed;
    document.getElementById("todayAccess").innerText = today;

    // Kemaskini Doughnut Chart
    if (pieChartInstance) pieChartInstance.destroy();
    pieChartInstance = new Chart(document.getElementById("pieChart"), {
      type: "doughnut",
      data: {
        labels: ["Success", "Failed"],
        datasets: [{ data: [success, failed], backgroundColor: ['#28a745', '#dc3545'] }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false
      }
    });
  });

  // Kira Bilangan Makmal Aktif
  onValue(ref(db, 'laboratories'), (snapshot) => {
    const labs = snapshot.val();
    document.getElementById("activeLabs").innerText = labs ? Object.keys(labs).length : 0;
  });

  // Carta Garisan (Line Chart)
  new Chart(document.getElementById("lineChart"), {
    type: "line",
    data: {
      labels: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
      datasets: [{ label: "Access Trend", data: [12, 19, 3, 5, 2, 3, 10], borderColor: '#0d6efd', fill: false }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  });
</script>
