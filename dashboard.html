<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Smart Access</title>

<!-- SKRIP SEGERA DALAM HEAD UNTUK ELAK WHITE FLICKER -->
<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
</script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>
  /* VARIABLE TEMA (DEFAULT LIGHT MODE) */
  :root {
    --bg-color: #f4f6f9;
    --text-color: #212529;
    --card-bg: #ffffff;
    --sidebar-bg: #032b67;
    --sidebar-hover: #0d6efd;
    --sidebar-mobile-bg: #021f4b;
    --table-border: #dee2e6;
  }

  /* DARK MODE OVERRIDES */
  :root.dark-mode {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --card-bg: #1e1e1e;
    --sidebar-bg: #0b192c;
    --sidebar-hover: #1e40af;
    --sidebar-mobile-bg: #070f1e;
    --table-border: #333333;
  }

  html {
    background-color: var(--bg-color);
  }

  body { 
    background-color: var(--bg-color); 
    color: var(--text-color);
    font-family: 'Segoe UI', sans-serif; 
    margin: 0; 
    transition: background 0.3s, color 0.3s;
  }

  /* SIDEBAR DASHBOARD */
  .sidebar { 
    width: 240px; 
    height: 100vh; 
    background: var(--sidebar-bg); 
    position: fixed; 
    color: white; 
    top: 0; 
    left: 0; 
    z-index: 1000; 
    transition: background 0.3s;
  }
  .logo { 
    text-align: center; 
    padding: 20px; 
    border-bottom: 1px solid rgba(255,255,255,.2); 
  }
  .logo h5 { margin-top: 10px; }
  .sidebar-menu { display: block; }
  .sidebar a { 
    display: block; 
    color: white; 
    text-decoration: none; 
    padding: 12px 20px; 
    transition: background 0.2s; 
  }
  .sidebar a:hover, .sidebar a.active { background: var(--sidebar-hover); }

  /* MAIN CONTENT */
  .content { margin-left: 240px; padding: 20px; }

  .card-box {
    background: var(--card-bg);
    color: var(--text-color);
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    transition: background 0.3s, color 0.3s;
  }

  .stat-card {
    border-left: 5px solid #0d6efd;
  }
  .stat-card.users { border-left-color: #0d6efd; }
  .stat-card.logs { border-left-color: #198754; }
  .stat-card.labs { border-left-color: #ffc107; }

  /* DARK MODE JADUAL */
  html.dark-mode .table {
    color: var(--text-color);
    border-color: var(--table-border);
  }
  html.dark-mode .table th, 
  html.dark-mode .table td {
    background-color: var(--card-bg);
    color: var(--text-color);
    border-color: var(--table-border);
  }

  /* RESPONSIVE TELEFON (< 992px) */
  @media (max-width: 991.98px) {
    .sidebar { width: 100%; height: auto; position: relative; }
    .logo { padding: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .logo i { font-size: 1.8rem !important; }
    .logo h5 { margin: 0; font-size: 1.1rem; }
    .sidebar-menu { display: flex; overflow-x: auto; white-space: nowrap; background: var(--sidebar-mobile-bg); padding: 5px 0; }
    .sidebar a { padding: 10px 15px; font-size: 0.9rem; }
    .content { margin-left: 0; padding: 15px; }
  }
</style>
</head>
<body>

<!-- SIDEBAR DASHBOARD -->
<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <div class="sidebar-menu">
    <a href="dashboard.html" class="active"><i class="fa fa-chart-line"></i> Dashboard</a>
    <a href="users.html"><i class="fa fa-users"></i> Users</a>
    <a href="accesslog.html"><i class="fa fa-clock"></i> Access Log</a>
    <a href="laboratory.html"><i class="fa fa-building"></i> Laboratories</a>
    <a href="reports.html"><i class="fa fa-file"></i> Reports</a>
    <a href="notification.html"><i class="fa fa-bell"></i> Notifications</a>
    <a href="settings.html"><i class="fa fa-cog"></i> Settings</a>
    <a href="profile.html"><i class="fa fa-user"></i> Profile</a>
    <a href="logout.html" id="logoutBtn"><i class="fa fa-sign-out-alt"></i> Logout</a>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="content">

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h3 class="mb-0">System Overview</h3>
    <div>Admin 👤</div>
  </div>

  <!-- STATISTIK RINGKASAN -->
  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card-box stat-card users">
        <div class="d-flex align-items-center justify-content-between">
          <div>
            <h6 class="text-muted mb-1">Total Users</h6>
            <h3 class="mb-0 fw-bold" id="totalUsers">0</h3>
          </div>
          <i class="fa fa-users fa-2x text-primary"></i>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card-box stat-card logs">
        <div class="d-flex align-items-center justify-content-between">
          <div>
            <h6 class="text-muted mb-1">Today Access Logs</h6>
            <h3 class="mb-0 fw-bold" id="todayLogs">0</h3>
          </div>
          <i class="fa fa-clock fa-2x text-success"></i>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card-box stat-card labs">
        <div class="d-flex align-items-center justify-content-between">
          <div>
            <h6 class="text-muted mb-1">Active Laboratories</h6>
            <h3 class="mb-0 fw-bold" id="activeLabs">0</h3>
          </div>
          <i class="fa fa-building fa-2x text-warning"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- JADUAL LOG TERBARU -->
  <div class="card-box">
    <h5 class="mb-3 fw-semibold">Recent Access Activity</h5>
    <div class="table-responsive">
      <table class="table table-hover align-middle text-center mb-0">
        <thead class="table-primary">
          <tr>
            <th>Time</th>
            <th>Name</th>
            <th>UID</th>
            <th>Location</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="recentLogsTable">
          <tr><td colspan="5" class="text-muted">Loading activity...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- SCRIPT FIREBASE -->
<script type="module">
  import { auth, signOut, onAuthStateChanged, db, ref, onValue } from './firebase-config.js';

  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
    document.body.classList.add("dark-mode");
  }

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "index.html";
    }
  });

  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", (e) => {
      e.preventDefault();
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    });
  }

  // BACA DATA REALTIME FIREBASE FOR DASHBOARD
  onValue(ref(db, 'users'), (snapshot) => {
    const data = snapshot.val();
    document.getElementById("totalUsers").innerText = data ? Object.keys(data).length : 0;
  });

  onValue(ref(db, 'logs'), (snapshot) => {
    const data = snapshot.val();
    const table = document.getElementById("recentLogsTable");
    table.innerHTML = "";

    if (data) {
      const logKeys = Object.keys(data).reverse().slice(0, 5);
      document.getElementById("todayLogs").innerText = Object.keys(data).length;

      logKeys.forEach((key) => {
        const log = data[key];
        table.innerHTML += `
          <tr>
            <td>${log.timestamp ? new Date(log.timestamp).toLocaleTimeString() : 'N/A'}</td>
            <td>${log.name || 'Unknown'}</td>
            <td>${log.uid || 'N/A'}</td>
            <td>${log.location || 'Main Gate'}</td>
            <td><span class="badge bg-success">Granted</span></td>
          </tr>`;
      });
    } else {
      document.getElementById("todayLogs").innerText = 0;
      table.innerHTML = `<tr><td colspan="5" class="text-muted">No recent activity</td></tr>`;
    }
  });

  onValue(ref(db, 'laboratories'), (snapshot) => {
    const data = snapshot.val();
    document.getElementById("activeLabs").innerText = data ? Object.keys(data).length : 0;
  });
</script>

</body>
</html>
