<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Smart Access</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>
  /* VARIABLE TEMA (DEFAULT LIGHT MODE) */
  :root {
    --bg-color: #f4f6f9;
    --text-color: #212529;
    --card-bg: #ffffff;
    --sidebar-bg: #032b67;
    --sidebar-hover: #0d6efd;
    --sidebar-mobile-bg: #021f4b;
    --table-border: #dee2e6;
    --muted-color: #6c757d;
  }

  /* DARK MODE OVERRIDES */
  body.dark-mode {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --card-bg: #1e1e1e;
    --sidebar-bg: #0b192c;
    --sidebar-hover: #1e40af;
    --sidebar-mobile-bg: #070f1e;
    --table-border: #333333;
    --muted-color: #a0a0a0;
  }

  body { 
    background: var(--bg-color); 
    color: var(--text-color);
    font-family: 'Segoe UI', sans-serif; 
    margin: 0;
    transition: background 0.3s, color 0.3s;
  }

  /* LAPTOP / DESKTOP VIEW */
  .sidebar { 
    width: 240px; 
    height: 100vh; 
    background: var(--sidebar-bg); 
    position: fixed; 
    color: white; 
    top: 0; 
    left: 0; 
    z-index: 1000;
    transition: background 0.3s;
  }

  .logo { 
    text-align: center; 
    padding: 20px; 
    border-bottom: 1px solid rgba(255,255,255,.2); 
  }

  .logo h5 { 
    margin-top: 10px; 
  }

  .sidebar-menu {
    display: block;
  }

  .sidebar a { 
    display: block; 
    color: white; 
    text-decoration: none; 
    padding: 12px 20px; 
    transition: background 0.2s;
  }

  .sidebar a:hover, .sidebar a.active { 
    background: var(--sidebar-hover); 
  }

  .content { 
    margin-left: 240px; 
    padding: 20px; 
  }

  .card-box { 
    border: none; 
    border-radius: 10px; 
    box-shadow: 0 2px 8px rgba(0,0,0,.15); 
    background: var(--card-bg);
    color: var(--text-color);
    transition: background 0.3s, color 0.3s;
  }

  .card-box small {
    color: var(--muted-color);
  }

  .value { 
    font-size: 28px; 
    font-weight: bold; 
  }

  .green { color: #28a745; } 
  .red { color: #dc3545; } 
  .blue { color: #0d6efd; }

  .chart-box, .table-box { 
    background: var(--card-bg); 
    color: var(--text-color);
    padding: 20px; 
    border-radius: 10px; 
    box-shadow: 0 2px 8px rgba(0,0,0,.15); 
    transition: background 0.3s, color 0.3s;
  }

  body.dark-mode .table {
    color: var(--text-color);
    border-color: var(--table-border);
  }

  body.dark-mode .table th, 
  body.dark-mode .table td {
    background-color: var(--card-bg);
    color: var(--text-color);
    border-color: var(--table-border);
  }

  /* PHONE VIEW (< 992px) */
  @media (max-width: 991.98px) {
    .sidebar {
      width: 100%;
      height: auto;
      position: relative;
    }

    .logo {
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo i {
      font-size: 1.8rem !important;
    }

    .logo h5 {
      margin: 0;
      font-size: 1.1rem;
    }

    .sidebar-menu {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      background: var(--sidebar-mobile-bg);
      padding: 5px 0;
    }

    .sidebar a {
      padding: 10px 15px;
      font-size: 0.9rem;
    }

    .content {
      margin-left: 0;
      padding: 15px;
    }

    .chart-box, .table-box {
      padding: 15px;
    }
  }
</style>

<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
</script>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <div class="sidebar-menu">
    <!-- KELAS ACTIVE DIKEMBALIKAN KEPADA DASHBOARD -->
    <a href="dashboard.html" class="active"><i class="fa fa-chart-line"></i> Dashboard</a>
    <a href="users.html"><i class="fa fa-users"></i> Users</a>
    <a href="booking.html"><i class="fa fa-calendar-check"></i> Bookings</a>
    <a href="accesslog.html"><i class="fa fa-clock"></i> Access Log</a>
    <a href="laboratory.html"><i class="fa fa-building"></i> Laboratories</a>
    <a href="reports.html"><i class="fa fa-file"></i> Reports</a>
    <a href="notification.html"><i class="fa fa-bell"></i> Notifications</a>
    <a href="help.html"><i class="fa fa-robot"></i> AI Assistant</a>
    <a href="settings.html"><i class="fa fa-cog"></i> Settings</a>
    <a href="profile.html"><i class="fa fa-user"></i> Profile</a>
    <a href="#" id="logoutBtn"><i class="fa fa-sign-out-alt"></i> Logout</a>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="content">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h3 class="mb-0">Dashboard</h3>
    <div id="adminNameDisplay">Admin 👤</div>
  </div>

  <!-- KAD STATISTIK RESPONSIVE (5 KAD) -->
  <div class="row g-3">
    <div class="col-12 col-sm-6 col-lg"><div class="card card-box p-3"><small>Total Access</small><div class="value" id="totalAccess">0</div></div></div>
    <div class="col-12 col-sm-6 col-lg"><div class="card card-box p-3"><small>Successful Access</small><div class="value green" id="successAccess">0</div></div></div>
    <div class="col-12 col-sm-6 col-lg"><div class="card card-box p-3"><small>Failed Access</small><div class="value red" id="failedAccess">0</div></div></div>
    <div class="col-12 col-sm-6 col-lg"><div class="card card-box p-3"><small>Today's Access</small><div class="value blue" id="todayAccess">0</div></div></div>
    <div class="col-12 col-sm-6 col-lg"><div class="card card-box p-3"><small>Active Labs</small><div class="value" id="activeLabs">0</div></div></div>
  </div>

  <!-- CARTA RESPONSIVE -->
  <div class="row g-3 mt-2">
    <div class="col-12 col-lg-8">
      <div class="chart-box">
        <h5>Access Statistics</h5>
        <div style="position: relative; height: 300px; width: 100%;">
          <canvas id="lineChart"></canvas>
        </div>
      </div>
    </div>
    <div class="col-12 col-lg-4">
      <div class="chart-box">
        <h5>Access Distribution</h5>
        <div style="position: relative; height: 300px; width: 100%;">
          <canvas id="pieChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- JADUAL RESPONSIVE -->
  <div class="row g-3 mt-2">
    <div class="col-12">
      <div class="table-box">
        <h5>Recent Activity</h5>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr><th>Name</th><th>Location</th><th>Time</th><th>Status</th></tr>
            </thead>
            <tbody id="recentTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module">
  import { auth, signOut, onAuthStateChanged, db, ref, get, child, onValue } from './firebase-config.js';

  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    const dbRef = ref(db);
    let userRole = 'user';
    let userName = user.email || 'Admin';

    const snapshot = await get(child(dbRef, `users/${user.uid}`));
    if (snapshot.exists()) {
      const data = snapshot.val();
      if (data.role) userRole = data.role.toString().toLowerCase();
      if (data.name) userName = data.name;
    } else {
      const allUsersSnap = await get(child(dbRef, 'users'));
      if (allUsersSnap.exists()) {
        const allUsers = allUsersSnap.val();
        Object.keys(allUsers).forEach(key => {
          if (allUsers[key].email && allUsers[key].email.toLowerCase() === user.email.toLowerCase()) {
            if (allUsers[key].role) userRole = allUsers[key].role.toString().toLowerCase();
            if (allUsers[key].name) userName = allUsers[key].name;
          }
        });
      }
    }

    if (userRole !== 'admin') {
      alert("Akses ditolak! Halaman ini khusus untuk Pentadbir (Admin) sahaja.");
      window.location.href = "user-dashboard.html";
      return;
    }

    document.getElementById("adminNameDisplay").innerHTML = `${userName} 👤`;
  });

  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", (e) => {
      e.preventDefault();
      signOut(auth)
        .then(() => {
          window.location.href = "index.html";
        })
        .catch((error) => {
          console.error("Logout Error:", error);
          alert("Gagal untuk log keluar. Sila cuba lagi.");
        });
    });
  }

  let pieChartInstance = null;

  onValue(ref(db, 'access_logs'), (snapshot) => {
    const data = snapshot.val();
    let total = 0, success = 0, failed = 0, today = 0;
    const recentTable = document.getElementById("recentTable");
    recentTable.innerHTML = "";

    if (data) {
      const keys = Object.keys(data);
      total = keys.length;
      const todayStr = new Date().toISOString().split('T')[0];

      const sortedLogs = keys.map(k => data[k]).reverse();

      sortedLogs.forEach((log, idx) => {
        const status = (log.status || '').toLowerCase();
        const isSuccess = status.includes('success') || status.includes('granted') || status === 'allowed';

        if (isSuccess) success++;
        else failed++;

        if (log.date === todayStr || (log.timestamp && new Date(log.timestamp).toISOString().split('T')[0] === todayStr)) {
          today++;
        }

        if (idx < 5) {
          const badge = isSuccess 
            ? '<span class="badge bg-success">Success</span>' 
            : '<span class="badge bg-danger">Failed</span>';

          recentTable.innerHTML += `
            <tr>
              <td>${log.userName || log.name || 'Unknown'}</td>
              <td>${log.labName || log.location || 'N/A'}</td>
              <td>${log.time || log.timestamp || 'N/A'}</td>
              <td>${badge}</td>
            </tr>`;
        }
      });
    } else {
      recentTable.innerHTML = `<tr><td colspan="4" class="text-center text-muted">Tiada rekod aktiviti terkini.</td></tr>`;
    }

    document.getElementById("totalAccess").innerText = total;
    document.getElementById("successAccess").innerText = success;
    document.getElementById("failedAccess").innerText = failed;
    document.getElementById("todayAccess").innerText = today;

    if (pieChartInstance) pieChartInstance.destroy();
    pieChartInstance = new Chart(document.getElementById("pieChart"), {
      type: "doughnut",
      data: {
        labels: ["Success", "Failed"],
        datasets: [{ data: [success, failed], backgroundColor: ['#28a745', '#dc3545'] }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false
      }
    });
  });

  onValue(ref(db, 'laboratories'), (snapshot) => {
    const labs = snapshot.val();
    document.getElementById("activeLabs").innerText = labs ? Object.keys(labs).length : 0;
  });

  new Chart(document.getElementById("lineChart"), {
    type: "line",
    data: {
      labels: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
      datasets: [{ label: "Access Trend", data: [12, 19, 3, 5, 2, 3, 10], borderColor: '#0d6efd', fill: false }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  });
</script>
</body>
</html>
