<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Management</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
body{ background:#f4f6f9; }
.sidebar{ width:240px; height:100vh; background:#032b67; position:fixed; }
.logo{ text-align:center; color:white; padding:20px; }
.sidebar a{ display:block; color:white; text-decoration:none; padding:12px 20px; }
.sidebar a:hover{ background:#0d6efd; }
.content{ margin-left:240px; padding:20px; }
.card-box{ background:white; border-radius:10px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.1); }
.btn-add{ background:#0d6efd; color:white; }
.status-active{ color:green; font-weight:bold; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <a href="dashboard.html"><i class="fa fa-chart-line"></i> Dashboard</a>
  <a href="users.html"><i class="fa fa-users"></i> Users</a>
  <a href="accesslog.html"><i class="fa fa-clock"></i> Access Log</a>
  <a href="laboratory.html"><i class="fa fa-building"></i> Laboratories</a>
  <a href="reports.html"><i class="fa fa-file"></i> Reports</a>
  <a href="notification.html"><i class="fa fa-bell"></i> Notifications</a>
  <a href="settings.html"><i class="fa fa-cog"></i> Settings</a>
  <a href="profile.html"><i class="fa fa-user"></i> Profile</a>
  <a href="login.html"><i class="fa fa-sign-out-alt"></i> Logout</a>
</div>

<div class="content">
  <div class="card-box">
    <div class="d-flex justify-content-between mb-3">
      <h3>User Management</h3>
      <button class="btn btn-add" data-bs-toggle="modal" data-bs-target="#addUserModal">
        <i class="fa fa-plus"></i> Add New User
      </button>
    </div>

    <table class="table table-bordered table-hover">
      <thead class="table-primary">
        <tr>
          <th>UID</th>
          <th>Name</th>
          <th>Student ID</th>
          <th>Role</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="userTable"></tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="addUserModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Add New User</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="text" id="uid" class="form-control mb-2" placeholder="UID Tag (e.g. DE88B906)">
        <input type="text" id="name" class="form-control mb-2" placeholder="Full Name">
        <input type="text" id="studentid" class="form-control mb-2" placeholder="Student / Staff ID">
        <select id="role" class="form-control">
          <option>Student</option>
          <option>Lecturer</option>
          <option>Admin</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="saveUserBtn">Save User</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  import { db, ref, set, onValue, remove } from './firebase-config.js';

  const usersRef = ref(db, 'users');

  // Load Realtime Data
  onValue(usersRef, (snapshot) => {
    const table = document.getElementById("userTable");
    table.innerHTML = "";
    const data = snapshot.val();

    if (data) {
      Object.keys(data).forEach((key) => {
        const user = data[key];
        table.innerHTML += `
          <tr>
            <td>${user.uid || key}</td>
            <td>${user.name}</td>
            <td>${user.studentId || 'N/A'}</td>
            <td>${user.role}</td>
            <td class="status-active">Active</td>
            <td>
              <button class="btn btn-danger btn-sm" onclick="deleteUser('${key}')">
                <i class="fa fa-trash"></i>
              </button>
            </td>
          </tr>`;
      });
    }
  });

  // Save User
  document.getElementById("saveUserBtn").addEventListener("click", () => {
    const uid = document.getElementById("uid").value.trim();
    const name = document.getElementById("name").value.trim();
    const studentId = document.getElementById("studentid").value.trim();
    const role = document.getElementById("role").value;

    if (!uid || !name) return alert("Please fill UID and Name!");

    set(ref(db, `users/${uid}`), {
      uid: uid,
      name: name,
      studentId: studentId,
      role: role,
      createdAt: Date.now()
    }).then(() => {
      const modal = bootstrap.Modal.getInstance(document.getElementById('addUserModal'));
      modal.hide();
      document.getElementById("uid").value = "";
      document.getElementById("name").value = "";
      document.getElementById("studentid").value = "";
    });
  });

  // Delete User
  window.deleteUser = function(key) {
    if (confirm("Delete this user?")) {
      remove(ref(db, `users/${key}`));
    }
  };
</script>
</body>
</html>
