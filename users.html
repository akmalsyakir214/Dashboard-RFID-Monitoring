<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Management - Smart Access</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>
  /* VARIABLE TEMA (DEFAULT LIGHT MODE) */
  :root {
    --bg-color: #f4f6f9;
    --text-color: #212529;
    --card-bg: #ffffff;
    --sidebar-bg: #032b67;
    --sidebar-hover: #0d6efd;
    --sidebar-mobile-bg: #021f4b;
    --table-border: #dee2e6;
    --muted-color: #6c757d;
    --input-bg: #ffffff;
    --input-border: #ced4da;
    --modal-bg: #ffffff;
  }

  /* DARK MODE OVERRIDES */
  body.dark-mode {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --card-bg: #1e1e1e;
    --sidebar-bg: #0b192c;
    --sidebar-hover: #1e40af;
    --sidebar-mobile-bg: #070f1e;
    --table-border: #333333;
    --muted-color: #a0a0a0;
    --input-bg: #2b2b2b;
    --input-border: #444444;
    --modal-bg: #1e1e1e;
  }

  body { 
    background: var(--bg-color); 
    color: var(--text-color);
    font-family: 'Segoe UI', sans-serif; 
    margin: 0;
    transition: background 0.3s, color 0.3s;
  }

  /* LAPTOP / DESKTOP VIEW */
  .sidebar { 
    width: 240px; 
    height: 100vh; 
    background: var(--sidebar-bg); 
    position: fixed; 
    color: white; 
    top: 0; 
    left: 0; 
    z-index: 1000;
    transition: background 0.3s;
  }

  .logo { 
    text-align: center; 
    padding: 20px; 
    border-bottom: 1px solid rgba(255,255,255,.2); 
  }

  .logo h5 { 
    margin-top: 10px; 
  }

  .sidebar-menu {
    display: block;
  }

  .sidebar a { 
    display: block; 
    color: white; 
    text-decoration: none; 
    padding: 12px 20px; 
    transition: background 0.2s;
  }

  .sidebar a:hover, .sidebar a.active { 
    background: var(--sidebar-hover); 
  }

  .content { 
    margin-left: 240px; 
    padding: 20px; 
  }

  .table-box { 
    background: var(--card-bg); 
    color: var(--text-color);
    padding: 20px; 
    border-radius: 10px; 
    box-shadow: 0 2px 8px rgba(0,0,0,.15); 
    transition: background 0.3s, color 0.3s;
  }

  body.dark-mode .table {
    color: var(--text-color);
    border-color: var(--table-border);
  }

  body.dark-mode .table th, 
  body.dark-mode .table td {
    background-color: var(--card-bg);
    color: var(--text-color);
    border-color: var(--table-border);
  }

  body.dark-mode .modal-content {
    background-color: var(--modal-bg);
    color: var(--text-color);
    border-color: var(--table-border);
  }
  body.dark-mode .modal-header,
  body.dark-mode .modal-footer {
    border-color: var(--table-border);
  }
  body.dark-mode .btn-close {
    filter: invert(1) grayscale(100%) brightness(200%);
  }

  body.dark-mode .form-control,
  body.dark-mode .form-select {
    background-color: var(--input-bg);
    color: var(--text-color);
    border-color: var(--input-border);
  }
  body.dark-mode .form-control::placeholder {
    color: #a0a0a0;
  }

  /* PHONE VIEW (< 992px) */
  @media (max-width: 991.98px) {
    .sidebar {
      width: 100%;
      height: auto;
      position: relative;
    }

    .logo {
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo i {
      font-size: 1.8rem !important;
    }

    .logo h5 {
      margin: 0;
      font-size: 1.1rem;
    }

    .sidebar-menu {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      background: var(--sidebar-mobile-bg);
      padding: 5px 0;
    }

    .sidebar a {
      padding: 10px 15px;
      font-size: 0.9rem;
    }

    .content {
      margin-left: 0;
      padding: 15px;
    }

    .table-box {
      padding: 15px;
    }
  }
</style>

<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
</script>
</head>
<body>

<!-- SIDEBAR ADMIN -->
<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <div class="sidebar-menu">
    <a href="dashboard.html"><i class="fa fa-chart-line"></i> Dashboard</a>
    <a href="users.html" class="active"><i class="fa fa-users"></i> Users</a>
    <a href="booking.html"><i class="fa fa-calendar-check"></i> Bookings</a>
    <a href="accesslog.html"><i class="fa fa-clock"></i> Access Log</a>
    <a href="laboratory.html"><i class="fa fa-building"></i> Laboratories</a>
    <a href="reports.html"><i class="fa fa-file"></i> Reports</a>
    <a href="settings.html"><i class="fa fa-cog"></i> Settings</a>
    <a href="profile.html"><i class="fa fa-user"></i> Profile</a>
    <a href="#" id="logoutBtn"><i class="fa fa-sign-out-alt"></i> Logout</a>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="content">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h3 class="mb-0">User Management</h3>
    <div id="adminNameDisplay">Admin 👤</div>
  </div>

  <!-- JADUAL PENGGUNA & BUTANG TAMBAH -->
  <div class="row g-3">
    <div class="col-12">
      <div class="table-box">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h5 class="m-0 fw-semibold">Registered Users</h5>
          <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#userModal" onclick="resetForm()">
            <i class="fa fa-plus me-1"></i> Add New User
          </button>
        </div>
        <div class="table-responsive">
          <table class="table align-middle text-center mb-0">
            <thead>
              <tr>
                <th>UID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Student / Staff ID</th>
                <th>Role</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="userTable">
              <tr><td colspan="7" class="text-muted">Loading users...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL ADD / EDIT USER -->
<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="userModalTitle">Add New User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="email" id="email" class="form-control mb-3" placeholder="Email (e.g. user@gmail.com)" required>
        <input type="password" id="password" class="form-control mb-3" placeholder="Password (Min 6 characters)">
        <input type="text" id="uid" class="form-control mb-3" placeholder="UID Tag (Generated automatically)" readonly>
        <input type="text" id="name" class="form-control mb-3" placeholder="Full Name" required>
        <input type="text" id="studentid" class="form-control mb-3" placeholder="Student / Staff ID">
        <select id="role" class="form-select">
          <option value="Student">Student</option>
          <option value="Lecturer">Lecturer</option>
          <option value="Admin">Admin</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="saveUserBtn">Save User</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  import { auth, signOut, onAuthStateChanged, db, ref, update, get, child, onValue, remove } from './firebase-config.js';
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signOut as secondarySignOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // Ambil konfigurasi asal dari Firebase SDK
  const firebaseConfig = auth.app.options;

  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
  }

  // SEMAK ADALAH ADMIN DISAHKAN
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    const dbRef = ref(db);
    let userRole = 'user';
    let userName = user.email || 'Admin';

    const snapshot = await get(child(dbRef, `users/${user.uid}`));
    if (snapshot.exists()) {
      const data = snapshot.val();
      if (data.role) userRole = data.role.toString().toLowerCase();
      if (data.name) userName = data.name;
    } else {
      const allUsersSnap = await get(child(dbRef, 'users'));
      if (allUsersSnap.exists()) {
        const allUsers = allUsersSnap.val();
        Object.keys(allUsers).forEach(key => {
          if (allUsers[key].email && allUsers[key].email.toLowerCase() === user.email.toLowerCase()) {
            if (allUsers[key].role) userRole = allUsers[key].role.toString().toLowerCase();
            if (allUsers[key].name) userName = allUsers[key].name;
          }
        });
      }
    }

    if (userRole !== 'admin') {
      alert("Akses ditolak! Halaman ini khusus untuk Pentadbir sahaja.");
      window.location.href = "user-dashboard.html";
      return;
    }

    document.getElementById("adminNameDisplay").innerText = `${userName} 👤`;
  });

  // LOGOUT
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", (e) => {
      e.preventDefault();
      signOut(auth)
        .then(() => {
          window.location.href = "index.html";
        })
        .catch((error) => {
          console.error("Logout Error:", error);
          alert("Gagal untuk log keluar. Sila cuba lagi.");
        });
    });
  }

  // MEMAPARKAN PENGGUNA DARI REALTIME DATABASE
  const usersRef = ref(db, 'users');

  onValue(usersRef, (snapshot) => {
    const table = document.getElementById("userTable");
    table.innerHTML = "";
    const data = snapshot.val();

    if (data) {
      Object.keys(data).forEach((key) => {
        const user = data[key];
        const role = user.role || 'Student';
        const studentId = user.studentId || user.studentID || 'N/A';
        const uName = user.name || 'N/A';
        const email = user.email || 'N/A';
        const displayUid = user.uid || key;

        table.innerHTML += `
          <tr>
            <td><code>${displayUid}</code></td>
            <td>${uName}</td>
            <td>${email}</td>
            <td>${studentId}</td>
            <td><span class="badge bg-secondary">${role}</span></td>
            <td class="text-success fw-bold">Active</td>
            <td>
              <button class="btn btn-warning btn-sm me-1" onclick="editUser('${displayUid}', '${uName}', '${email}', '${studentId}', '${role}')">
                <i class="fa fa-edit"></i>
              </button>
              <button class="btn btn-danger btn-sm" onclick="deleteUser('${key}')">
                <i class="fa fa-trash"></i>
              </button>
            </td>
          </tr>`;
      });
    } else {
      table.innerHTML = `<tr><td colspan="7" class="text-muted">No users found</td></tr>`;
    }
  });

  const modalEl = document.getElementById('userModal');
  const bsModal = new bootstrap.Modal(modalEl);

  // SIMPAN PENGGUNA DENGAN PENDAFTARAN FIREBASE AUTHENTICATION
  document.getElementById("saveUserBtn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    let uid = document.getElementById("uid").value.trim();
    const name = document.getElementById("name").value.trim();
    const studentId = document.getElementById("studentid").value.trim();
    const role = document.getElementById("role").value;

    const isEdit = document.getElementById("uid").readOnly && uid !== "";

    if (!name || !email) {
      return alert("Sila isi Nama dan E-mel!");
    }

    try {
      if (!isEdit) {
        // --- PROSES DAFTAR AUTHENTICATION BAHARU ---
        if (!password || password.length < 6) {
          return alert("Sila masukkan kata laluan sekurang-kurangnya 6 aksara untuk akaun baharu!");
        }

        // Cipta instans Firebase kedua supaya Admin tidak terkeluar (logout)
        const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp");
        const secondaryAuth = getAuth(secondaryApp);

        // Masukkan ke Firebase Authentication
        const userCredential = await createUserWithEmailAndPassword(secondaryAuth, email, password);
        const newUser = userCredential.user;
        uid = newUser.uid;

        // Signout daripada instans secondary
        await secondarySignOut(secondaryAuth);
      }

      // --- KEMASKINI KE REALTIME DATABASE ---
      await update(ref(db, `users/${uid}`), {
        uid: uid,
        email: email,
        name: name,
        studentId: studentId,
        role: role.toLowerCase(),
        updatedAt: Date.now()
      });

      alert(isEdit ? "Pengguna berjaya dikemaskini!" : "Pengguna berjaya didaftarkan ke Authentication & Database!");
      bsModal.hide();
      resetForm();

    } catch (err) {
      console.error("Ralat pendaftaran:", err);
      alert("Gagal menyimpan pengguna: " + err.message);
    }
  });

  window.editUser = function(uid, name, email, studentId, role) {
    document.getElementById("userModalTitle").innerText = "Edit User";
    document.getElementById("uid").value = uid;
    document.getElementById("uid").readOnly = true;
    document.getElementById("email").value = email === 'N/A' ? '' : email;
    document.getElementById("email").readOnly = true;
    document.getElementById("password").placeholder = "(Biarkan kosong jika tidak ubah)";
    document.getElementById("name").value = name;
    document.getElementById("studentid").value = studentId === 'N/A' ? '' : studentId;
    document.getElementById("role").value = role.charAt(0).toUpperCase() + role.slice(1);
    bsModal.show();
  };

  window.deleteUser = function(key) {
    if (confirm("Padam pengguna ini dari Realtime Database?")) {
      remove(ref(db, `users/${key}`)).catch(err => {
        console.error("Error deleting user:", err);
        alert("Gagal memadam pengguna.");
      });
    }
  };

  window.resetForm = function() {
    document.getElementById("userModalTitle").innerText = "Add New User";
    document.getElementById("uid").readOnly = true;
    document.getElementById("email").readOnly = false;
    document.getElementById("uid").value = "";
    document.getElementById("email").value = "";
    document.getElementById("password").value = "";
    document.getElementById("password").placeholder = "Password (Min 6 characters)";
    document.getElementById("name").value = "";
    document.getElementById("studentid").value = "";
    document.getElementById("role").value = "Student";
  };
</script>
</body>
</html>
