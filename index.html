<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Access - Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>
  /* VARIABLE TEMA SIANG (DEFAULT LIGHT MODE) */
  :root {
    --bg-gradient: linear-gradient(135deg, #032b67 0%, #0d6efd 100%);
    --card-bg: #ffffff;
    --text-color: #212529;
    --muted-color: #6c757d;
    --header-color: #032b67;
    --input-bg: #ffffff;
    --input-text: #212529;
    --input-border: #ced4da;
    --input-group-bg: #e9ecef;
    --input-group-text: #495057;
  }

  /* DARK MODE OVERRIDES */
  body.dark-mode {
    --bg-gradient: linear-gradient(135deg, #070f1e 0%, #0d1b2a 100%);
    --card-bg: #1e1e1e;
    --text-color: #ffffff;
    --muted-color: #b0b0b0;
    --header-color: #ffffff;
    --input-bg: #2b2b2b;
    --input-text: #ffffff;
    --input-border: #444444;
    --input-group-bg: #3d3d3d;
    --input-group-text: #ffffff;
  }

  /* SKRIP UNTUK ELAK SCREEN FLICKER */
  body {
    background: var(--bg-gradient);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: var(--text-color);
    transition: background 0.3s, color 0.3s;
  }

  .login-card {
    background: var(--card-bg);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 400px;
    padding: 30px;
    position: relative;
    transition: background 0.3s;
  }

  .logo-header {
    text-align: center;
    color: var(--header-color);
    margin-bottom: 25px;
  }

  .logo-header i {
    color: #0d6efd;
  }

  .logo-header small {
    color: var(--muted-color) !important;
  }

  .form-label {
    color: var(--text-color);
    font-weight: 500;
  }

  /* WARNA INPUT & TEKS APABILA TAIP */
  .form-control {
    background-color: var(--input-bg);
    color: var(--input-text) !important;
    border-color: var(--input-border);
  }

  .form-control:focus {
    background-color: var(--input-bg);
    color: var(--input-text) !important;
  }

  .form-control::placeholder {
    color: var(--muted-color);
  }

  .input-group-text {
    background-color: var(--input-group-bg);
    color: var(--input-group-text);
    border-color: var(--input-border);
  }

  .btn-primary {
    background-color: #0d6efd;
    border: none;
    padding: 10px;
    font-weight: 600;
  }

  .btn-primary:hover {
    background-color: #032b67;
  }

  .alert {
    display: none;
  }

  /* POSITION BUTANG THEME TOGGLE */
  .theme-toggle-container {
    position: absolute;
    top: 15px;
    right: 15px;
  }
</style>

<!-- SKRIP SEGERA APABILA PAGE LOAD UNTUK ELAK SCREEN FLICKER -->
<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
</script>
</head>
<body>

<div class="login-card">
  <!-- BUTANG TOGGLE TEMA LIGHT / DARK -->
  <div class="theme-toggle-container">
    <button class="btn btn-sm btn-outline-secondary" id="themeToggleBtn" type="button">
      <i class="fa-solid fa-moon" id="themeIcon"></i>
    </button>
  </div>

  <div class="logo-header">
    <i class="fa-solid fa-shield-halved fa-3x mb-2"></i>
    <h4 class="fw-bold">SMART ACCESS</h4>
    <small class="text-muted">RFID Security Management System</small>
  </div>

  <div id="errorAlert" class="alert alert-danger" role="alert"></div>

  <form id="loginForm">
    <div class="mb-3">
      <label for="email" class="form-label">Email Address</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fa fa-envelope"></i></span>
        <input type="email" class="form-control" id="email" placeholder="admin@gmail.com" required>
      </div>
    </div>

    <div class="mb-4">
      <label for="password" class="form-label">Password</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fa fa-lock"></i></span>
        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100" id="loginBtn">
      <span id="btnText">Login</span>
      <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
    </button>
  </form>
</div>

<script type="module">
  import { auth, signInWithEmailAndPassword } from './firebase-config.js';

  // -------------------------------------------------------------
  // LOGIK PENUKARAN TEMA DARK / LIGHT MODE
  // -------------------------------------------------------------
  const themeToggleBtn = document.getElementById("themeToggleBtn");
  const themeIcon = document.getElementById("themeIcon");

  // Semak tetapan yang disimpan dalam LocalStorage
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
    themeIcon.classList.replace("fa-moon", "fa-sun");
  }

  // Event Listener bila butang dipicit
  themeToggleBtn.addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");
    const isDark = document.body.classList.contains("dark-mode");

    if (isDark) {
      themeIcon.classList.replace("fa-moon", "fa-sun");
      localStorage.setItem("theme", "dark");
    } else {
      themeIcon.classList.replace("fa-sun", "fa-moon");
      localStorage.setItem("theme", "light");
    }
  });

  // -------------------------------------------------------------
  // LOGIK LOG MASUK FIREBASE
  // -------------------------------------------------------------
  const loginForm = document.getElementById("loginForm");
  const errorAlert = document.getElementById("errorAlert");
  const loginBtn = document.getElementById("loginBtn");
  const btnText = document.getElementById("btnText");
  const btnSpinner = document.getElementById("btnSpinner");

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    errorAlert.style.display = "none";
    errorAlert.innerText = "";

    loginBtn.disabled = true;
    btnText.innerText = "Signing in...";
    btnSpinner.classList.remove("d-none");

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = "dashboard.html";
    } catch (error) {
      loginBtn.disabled = false;
      btnText.innerText = "Login";
      btnSpinner.classList.add("d-none");

      let message = "Sila semak e-mel dan kata laluan anda.";
      if (error.code === "auth/invalid-credential" || error.code === "auth/wrong-password") {
        message = "E-mel atau kata laluan tidak sah.";
      } else if (error.code === "auth/user-not-found") {
        message = "Akaun pengguna tidak wujud di Firebase.";
      }

      errorAlert.innerText = message;
      errorAlert.style.display = "block";
    }
  });
</script>

</body>
</html>
