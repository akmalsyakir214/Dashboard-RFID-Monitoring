<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Masuk - Smart Access</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>
  :root {
    --bg-color: #f4f6f9;
    --card-bg: #ffffff;
    --text-color: #212529;
    --primary-color: #032b67;
  }

  body {
    background: var(--bg-color);
    color: var(--text-color);
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
  }

  .login-card {
    background: var(--card-bg);
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    padding: 30px;
    width: 100%;
    max-width: 400px;
  }

  .login-logo {
    text-align: center;
    margin-bottom: 25px;
    color: var(--primary-color);
  }

  .btn-primary {
    background-color: var(--primary-color);
    border-color: var(--primary-color);
  }

  .btn-primary:hover {
    background-color: #021f4b;
    border-color: #021f4b;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">
    <i class="fa-solid fa-shield-halved fa-3x mb-2"></i>
    <h4 class="fw-bold">SMART ACCESS</h4>
    <p class="text-muted small">Sistem Kawalan Keselamatan Makmal</p>
  </div>

  <form id="loginForm">
    <div class="mb-3">
      <label class="form-label fw-bold small">Alamat Emel</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fa fa-envelope"></i></span>
        <input type="email" id="loginEmail" class="form-control" placeholder="nama@email.com" required>
      </div>
    </div>

    <div class="mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <label class="form-label fw-bold small mb-0">Kata Laluan</label>
        <a href="#" class="small text-decoration-none" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">Lupa Kata Laluan?</a>
      </div>
      <div class="input-group mt-1">
        <span class="input-group-text"><i class="fa fa-lock"></i></span>
        <input type="password" id="loginPassword" class="form-control" placeholder="********" required>
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="loginBtn">
      <i class="fa fa-sign-in-alt me-2"></i> Log Masuk
    </button>
  </form>
</div>

<!-- MODAL LUPA KATA LALUAN -->
<div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold"><i class="fa fa-key me-2 text-primary"></i>Tetapan Semula Kata Laluan</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small">Masukkan alamat emel akaun anda. Kami akan menghantar pautan untuk menetapkan semula kata laluan ke emel tersebut.</p>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Alamat Emel Berdaftar</label>
          <input type="email" id="resetEmailInput" class="form-control" placeholder="nama@email.com">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary btn-sm" id="sendResetEmailBtn">Hantar Pautan Reset</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  import { auth, db, ref, get, child } from './firebase-config.js';
  import { signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // Proses Log Masuk
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value.trim();
    const loginBtn = document.getElementById("loginBtn");

    if (!email || !password) {
      alert("Sila masukkan emel dan kata laluan.");
      return;
    }

    try {
      loginBtn.disabled = true;
      loginBtn.innerHTML = `<i class="fa fa-spinner fa-spin me-2"></i> Memproses...`;

      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // Semak peranan (role) pengguna dalam Realtime Database
      const dbRef = ref(db);
      const snapshot = await get(child(dbRef, `users/${user.uid}`));

      let userRole = 'user';
      if (snapshot.exists() && snapshot.val().role) {
        userRole = snapshot.val().role.toString().toLowerCase();
      }

      // Halakan mengikut peranan
      if (userRole === 'admin') {
        window.location.href = "dashboard.html";
      } else {
        window.location.href = "user-dashboard.html";
      }

    } catch (err) {
      console.error("Ralat log masuk:", err);
      alert("Log masuk gagal: " + err.message);
      loginBtn.disabled = false;
      loginBtn.innerHTML = `<i class="fa fa-sign-in-alt me-2"></i> Log Masuk`;
    }
  });

  // Proses Hantar Emel Reset Kata Laluan dari Halaman Utama
  document.getElementById("sendResetEmailBtn").addEventListener("click", async () => {
    const emailInput = document.getElementById("resetEmailInput").value.trim();

    if (!emailInput) {
      alert("Sila masukkan alamat emel anda.");
      return;
    }

    try {
      await sendPasswordResetEmail(auth, emailInput);
      alert(`Pautan tetapan semula kata laluan telah berjaya dihantar ke: ${emailInput}`);
      
      // Tutup modal selepas berjaya
      const modalEl = document.getElementById('forgotPasswordModal');
      const modal = bootstrap.Modal.getInstance(modalEl);
      modal.hide();
      document.getElementById("resetEmailInput").value = "";

    } catch (err) {
      console.error("Ralat reset password:", err);
      alert("Gagal menghantar emel: " + err.message);
    }
  });
</script>

</body>
</html>
