<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Access - Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
  body {
    background: linear-gradient(135deg, #032b67 0%, #0d6efd 100%);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  .login-card {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    width: 100%;
    max-width: 400px;
    padding: 30px;
  }
  .logo-header {
    text-align: center;
    color: #032b67;
    margin-bottom: 25px;
  }
  .logo-header i {
    color: #0d6efd;
  }
  .btn-primary {
    background-color: #0d6efd;
    border: none;
    padding: 10px;
    font-weight: 600;
  }
  .btn-primary:hover {
    background-color: #032b67;
  }
  .alert {
    display: none;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo-header">
    <i class="fa-solid fa-shield-halved fa-3x mb-2"></i>
    <h4 class="fw-bold">SMART ACCESS</h4>
    <small class="text-muted">RFID Security Management System</small>
  </div>

  <div id="errorAlert" class="alert alert-danger" role="alert"></div>

  <form id="loginForm">
    <div class="mb-3">
      <label for="email" class="form-label">Email Address</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fa fa-envelope"></i></span>
        <input type="email" class="form-control" id="email" placeholder="admin@domain.com" required>
      </div>
    </div>

    <div class="mb-4">
      <label for="password" class="form-label">Password</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fa fa-lock"></i></span>
        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100" id="loginBtn">
      <span id="btnText">Login</span>
      <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
    </button>
  </form>
</div>

<script type="module">
  import { auth, signInWithEmailAndPassword, onAuthStateChanged } from './firebase-config.js';

  const loginForm = document.getElementById("loginForm");
  const errorAlert = document.getElementById("errorAlert");
  const loginBtn = document.getElementById("loginBtn");
  const btnText = document.getElementById("btnText");
  const btnSpinner = document.getElementById("btnSpinner");

  // Redirect if already logged in
  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.location.href = "dashboard.html";
    }
  });

  // Handle Form Submission
  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    // Reset alert
    errorAlert.style.display = "none";
    errorAlert.innerText = "";

    // Show loading state
    loginBtn.disabled = true;
    btnText.innerText = "Signing in...";
    btnSpinner.classList.remove("d-none");

    try {
      await signInWithEmailAndPassword(auth, email, password);
      // Successful login redirects automatically via onAuthStateChanged
    } catch (error) {
      // Handle Firebase Auth Errors
      loginBtn.disabled = false;
      btnText.innerText = "Login";
      btnSpinner.classList.add("d-none");

      let message = "Failed to sign in. Please check your credentials.";
      switch (error.code) {
        case "auth/invalid-email":
          message = "Invalid email format.";
          break;
        case "auth/user-not-found":
        case "auth/wrong-password":
        case "auth/invalid-credential":
          message = "Invalid email or password.";
          break;
        case "auth/too-many-requests":
          message = "Access blocked due to many failed attempts. Try again later.";
          break;
      }

      errorAlert.innerText = message;
      errorAlert.style.display = "block";
    }
  });
</script>

</body>
</html>
