<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - Smart Access</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>
  body { 
    background: #f4f6f9; 
    font-family: 'Segoe UI', sans-serif; 
    margin: 0;
  }

  /* ==================== 1. LAPTOP / DESKTOP VIEW ==================== */
  .sidebar { 
    width: 240px; 
    height: 100vh; 
    background: #032b67; 
    position: fixed; 
    color: white; 
    top: 0; 
    left: 0; 
    z-index: 1000;
  }

  .logo { 
    text-align: center; 
    padding: 20px; 
    border-bottom: 1px solid rgba(255,255,255,.2); 
  }

  .logo h5 { 
    margin-top: 10px; 
  }

  .sidebar-menu {
    display: block;
  }

  .sidebar a { 
    display: block; 
    color: white; 
    text-decoration: none; 
    padding: 12px 20px; 
    transition: background 0.2s;
  }

  .sidebar a:hover, .sidebar a.active { 
    background: #0d6efd; 
  }

  .content { 
    margin-left: 240px; 
    padding: 20px; 
  }

  .settings-card {
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
  }

  .section {
    margin-bottom: 30px;
  }

  .section h5 {
    margin-bottom: 18px;
    color: #032b67;
    font-weight: 600;
  }

  .switch-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
  }

  .switch-item:last-child {
    border-bottom: none;
  }

  /* ==================== 2. PHONE VIEW ONLY (< 992px) ==================== */
  @media (max-width: 991.98px) {
    .sidebar {
      width: 100%;
      height: auto;
      position: relative;
    }

    .logo {
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo i {
      font-size: 1.8rem !important;
    }

    .logo h5 {
      margin: 0;
      font-size: 1.1rem;
    }

    .sidebar-menu {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      background: #021f4b;
      padding: 5px 0;
    }

    .sidebar a {
      padding: 10px 15px;
      font-size: 0.9rem;
    }

    .content {
      margin-left: 0;
      padding: 15px;
    }

    .settings-card {
      padding: 20px;
    }
  }
</style>
</head>
<body>

<!-- SIDEBAR DASHBOARD -->
<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <div class="sidebar-menu">
    <a href="dashboard.html"><i class="fa fa-chart-line"></i> Dashboard</a>
    <a href="users.html"><i class="fa fa-users"></i> Users</a>
    <a href="accesslog.html"><i class="fa fa-clock"></i> Access Log</a>
    <a href="laboratory.html"><i class="fa fa-building"></i> Laboratories</a>
    <a href="reports.html"><i class="fa fa-file"></i> Reports</a>
    <a href="notification.html"><i class="fa fa-bell"></i> Notifications</a>
    <a href="settings.html" class="active"><i class="fa fa-cog"></i> Settings</a>
    <a href="profile.html"><i class="fa fa-user"></i> Profile</a>
    <a href="logout.html" id="logoutBtn"><i class="fa fa-sign-out-alt"></i> Logout</a>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="content">

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h3 class="mb-0">Settings</h3>
    <div>Admin 👤</div>
  </div>

  <div class="settings-card">

    <!-- SYSTEM SETTINGS -->
    <div class="section">
      <h5>System Settings</h5>
      <div class="mb-3">
        <label class="form-label fw-semibold">System Name</label>
        <input type="text" id="systemName" class="form-control" value="RFID Smart Access System">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Administrator Email</label>
        <input type="email" id="adminEmail" class="form-control" value="admin@gmail.com">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Auto Logout (Minutes)</label>
        <input type="number" id="autoLogout" class="form-control" value="15">
      </div>
    </div>

    <hr class="my-4">

    <!-- NOTIFICATION SETTINGS -->
    <div class="section">
      <h5>Notification Settings</h5>
      
      <div class="switch-item">
        <span>Email Notifications</span>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="emailNotif" checked>
        </div>
      </div>

      <div class="switch-item">
        <span>SMS Notifications</span>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="smsNotif">
        </div>
      </div>

      <div class="switch-item">
        <span>Door Forced Alert</span>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="doorForcedAlert" checked>
        </div>
      </div>

      <div class="switch-item">
        <span>Unknown RFID Alert</span>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="unknownRfidAlert" checked>
        </div>
      </div>
    </div>

    <hr class="my-4">

    <!-- SECURITY SETTINGS -->
    <div class="section">
      <h5>Security</h5>
      <div class="mb-3">
        <label class="form-label fw-semibold">Minimum Password Length</label>
        <select class="form-select" id="minPasswordLen">
          <option value="6">6 Characters</option>
          <option value="8" selected>8 Characters</option>
          <option value="10">10 Characters</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Maximum Login Attempts</label>
        <input type="number" id="maxLoginAttempts" class="form-control" value="5">
      </div>
    </div>

    <button class="btn btn-primary px-4 mt-2" id="saveSettingsBtn">
      <i class="fas fa-save me-2"></i>Save Changes
    </button>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- SCRIPT FIREBASE -->
<script type="module">
  import { auth, signOut, onAuthStateChanged, db, ref, set, get, child } from './firebase-config.js';

  // 1. SEMAKAN KESELAMATAN (AUTH PROTECTION)
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "index.html";
    }
  });

  // 2. FUNGSI LOGOUT FIREBASE
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", (e) => {
      e.preventDefault();
      
      signOut(auth)
        .then(() => {
          window.location.href = "index.html";
        })
        .catch((error) => {
          console.error("Logout Error:", error);
          alert("Gagal untuk log keluar. Sila cuba lagi.");
        });
    });
  }

  // 3. BACA TETAPAN SEMASA DARI FIREBASE REALTIME DATABASE
  const dbRef = ref(db);
  get(child(dbRef, 'settings')).then((snapshot) => {
    if (snapshot.exists()) {
      const settings = snapshot.val();
      if(settings.systemName !== undefined) document.getElementById("systemName").value = settings.systemName;
      if(settings.adminEmail !== undefined) document.getElementById("adminEmail").value = settings.adminEmail;
      if(settings.autoLogout !== undefined) document.getElementById("autoLogout").value = settings.autoLogout;
      
      if(settings.emailNotif !== undefined) document.getElementById("emailNotif").checked = settings.emailNotif;
      if(settings.smsNotif !== undefined) document.getElementById("smsNotif").checked = settings.smsNotif;
      if(settings.doorForcedAlert !== undefined) document.getElementById("doorForcedAlert").checked = settings.doorForcedAlert;
      if(settings.unknownRfidAlert !== undefined) document.getElementById("unknownRfidAlert").checked = settings.unknownRfidAlert;
      
      if(settings.minPasswordLen !== undefined) document.getElementById("minPasswordLen").value = settings.minPasswordLen;
      if(settings.maxLoginAttempts !== undefined) document.getElementById("maxLoginAttempts").value = settings.maxLoginAttempts;
    }
  }).catch((error) => {
    console.error("Error loading settings:", error);
  });

  // 4. SIMPAN TETAPAN KE FIREBASE
  const saveBtn = document.getElementById("saveSettingsBtn");
  saveBtn.addEventListener("click", () => {
    saveBtn.disabled = true;
    saveBtn.innerHTML = `<i class="fas fa-spinner fa-spin me-2"></i>Saving...`;

    const settingsData = {
      systemName: document.getElementById("systemName").value,
      adminEmail: document.getElementById("adminEmail").value,
      autoLogout: parseInt(document.getElementById("autoLogout").value) || 15,
      emailNotif: document.getElementById("emailNotif").checked,
      smsNotif: document.getElementById("smsNotif").checked,
      doorForcedAlert: document.getElementById("doorForcedAlert").checked,
      unknownRfidAlert: document.getElementById("unknownRfidAlert").checked,
      minPasswordLen: document.getElementById("minPasswordLen").value,
      maxLoginAttempts: parseInt(document.getElementById("maxLoginAttempts").value) || 5
    };

    set(ref(db, 'settings'), settingsData)
      .then(() => {
        alert("Settings saved successfully!");
      })
      .catch((error) => {
        console.error("Error saving settings:", error);
        alert("Gagal menyimpan tetapan.");
      })
      .finally(() => {
        saveBtn.disabled = false;
        saveBtn.innerHTML = `<i class="fas fa-save me-2"></i>Save Changes`;
      });
  });
</script>

</body>
</html>
