<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f4f6f9;
}

/* SIDEBAR */

.sidebar{
position:fixed;
left:0;
top:0;
width:300px;
height:100vh;
background:#052b6f;
color:white;
}

.logo{
text-align:center;
padding:25px;
}

.logo i{
font-size:65px;
margin-bottom:15px;
}

.logo h2{
font-size:20px;
}

.sidebar hr{
border:none;
border-top:1px solid rgba(255,255,255,0.15);
}

.sidebar ul{
list-style:none;
padding-top:15px;
}

.sidebar ul li{
margin:10px 0;
}

.sidebar ul li a{
display:flex;
align-items:center;
gap:15px;
padding:15px 25px;
text-decoration:none;
color:white;
font-size:18px;
}

.sidebar ul li a:hover{
background:rgba(255,255,255,.1);
}

.active{
background:rgba(255,255,255,.12);
border-left:4px solid white;
}

/* MAIN */

.main-content{
margin-left:300px;
padding:30px;
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.top-bar h2{
color:#333;
}

.settings-card{
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.section{
margin-bottom:30px;
}

.section h3{
margin-bottom:15px;
color:#052b6f;
}

.form-group{
margin-bottom:20px;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
}

input[type="text"],
input[type="email"],
input[type="number"],
select{

width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:6px;

}

.switch{

display:flex;
justify-content:space-between;
align-items:center;
padding:12px 0;
border-bottom:1px solid #eee;

}

.switch input{

width:20px;
height:20px;

}

.save-btn{

margin-top:20px;
background:#0d6efd;
color:white;
border:none;
padding:12px 25px;
border-radius:6px;
cursor:pointer;
font-size:16px;

}

.save-btn:hover{

background:#084db8;

}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">

<i class="fas fa-shield-alt"></i>

<h2>SMART ACCESS</h2>

</div>

<hr>

<ul>

<li><a href="dashboard.html"><i class="fas fa-chart-line"></i>Dashboard</a></li>

<li><a href="users.html"><i class="fas fa-users"></i>Users</a></li>

<li><a href="access-log.html"><i class="fas fa-clock"></i>Access Log</a></li>

<li><a href="laboratories.html"><i class="fas fa-building"></i>Laboratories</a></li>

<li><a href="reports.html"><i class="fas fa-file-alt"></i>Reports</a></li>

<li><a href="notifications.html"><i class="fas fa-bell"></i>Notifications</a></li>

<li><a class="active" href="settings.html"><i class="fas fa-cog"></i>Settings</a></li>

<li><a href="profile.html"><i class="fas fa-user"></i>Profile</a></li>

<li><a href="logout.php"><i class="fas fa-sign-out-alt"></i>Logout</a></li>

</ul>

</div>

<!-- MAIN -->

<div class="main-content">

<div class="top-bar">

<h2>Settings</h2>

<div>

Admin <i class="fas fa-user-circle"></i>

</div>

</div>

<div class="settings-card">

<div class="section">

<h3>System Settings</h3>

<div class="form-group">

<label>System Name</label>

<input type="text" value="RFID Smart Access System">

</div>

<div class="form-group">

<label>Administrator Email</label>

<input type="email" value="admin@gmail.com">

</div>

<div class="form-group">

<label>Auto Logout (Minutes)</label>

<input type="number" value="15">

</div>

</div>

<div class="section">

<h3>Notification Settings</h3>

<div class="switch">

<span>Email Notifications</span>

<input type="checkbox" checked>

</div>

<div class="switch">

<span>SMS Notifications</span>

<input type="checkbox">

</div>

<div class="switch">

<span>Door Forced Alert</span>

<input type="checkbox" checked>

</div>

<div class="switch">

<span>Unknown RFID Alert</span>

<input type="checkbox" checked>

</div>

</div>

<div class="section">

<h3>Security</h3>

<div class="form-group">

<label>Minimum Password Length</label>

<select>

<option>6 Characters</option>
<option selected>8 Characters</option>
<option>10 Characters</option>

</select>

</div>

<div class="form-group">

<label>Maximum Login Attempts</label>

<input type="number" value="5">

</div>

</div>

<button class="save-btn" onclick="saveSettings()">

<i class="fas fa-save"></i>

Save Changes

</button>

</div>

</div>

<script>

function saveSettings(){

alert("Settings saved successfully!");

}

</script>

</body>
</html>
