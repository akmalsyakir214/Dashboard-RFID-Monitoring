<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pageTitle">Reports - Smart Access</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  /* VARIABLE TEMA (DEFAULT LIGHT MODE) */
  :root {
    --bg-color: #f4f6f9;
    --text-color: #212529;
    --card-bg: #ffffff;
    --sidebar-bg: #032b67;
    --sidebar-hover: #0d6efd;
    --sidebar-mobile-bg: #021f4b;
    --border-color: #ced4da;
    --input-bg: #ffffff;
    --input-text: #212529;
    --subtext-color: #6c757d;
    --table-header-bg: #0d6efd;
    --table-header-text: #ffffff;
    --table-border: #dee2e6;
  }

  /* DARK MODE OVERRIDES */
  html.dark-mode, body.dark-mode {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --card-bg: #1e1e1e;
    --sidebar-bg: #0b192c;
    --sidebar-hover: #1e40af;
    --sidebar-mobile-bg: #070f1e;
    --border-color: #444444;
    --input-bg: #2d2d2d;
    --input-text: #ffffff;
    --subtext-color: #b0bec5;
    --table-header-bg: #1e3a5f;
    --table-header-text: #ffffff;
    --table-border: #333333;
  }

  body { 
    background: var(--bg-color); 
    color: var(--text-color);
    font-family: 'Segoe UI', sans-serif; 
    margin: 0;
    transition: background 0.3s, color 0.3s;
  }

  /* SIDEBAR DASHBOARD */
  .sidebar { 
    width: 240px; 
    height: 100vh; 
    background: var(--sidebar-bg); 
    position: fixed; 
    color: white; 
    top: 0; 
    left: 0; 
    z-index: 1000;
    transition: background 0.3s;
  }

  .logo { 
    text-align: center; 
    padding: 20px; 
    border-bottom: 1px solid rgba(255,255,255,.2); 
  }

  .logo h5 { 
    margin-top: 10px; 
  }

  .sidebar-menu {
    display: block;
  }

  .sidebar a { 
    display: block; 
    color: white; 
    text-decoration: none; 
    padding: 12px 20px; 
    transition: background 0.2s;
  }

  .sidebar a:hover, .sidebar a.active { 
    background: var(--sidebar-hover); 
  }

  /* MAIN CONTENT */
  .content { 
    margin-left: 240px; 
    padding: 20px; 
  }

  .filter-box, .card-box, .chart-box, .table-box { 
    background: var(--card-bg); 
    color: var(--text-color);
    padding: 20px; 
    border-radius: 10px; 
    box-shadow: 0 2px 8px rgba(0,0,0,.15); 
    border: none;
    transition: background 0.3s, color 0.3s;
  }

  .value { 
    font-size: 28px; 
    font-weight: bold; 
  }

  .green { color: #2ecc71 !important; } 
  .red { color: #e74c3c !important; } 
  .blue { color: #3498db !important; }

  /* FORM CONTROLS DENGAN SUPPORT TEMA & DARK MODE JELAS */
  .form-select, .form-control {
    background-color: var(--input-bg);
    color: var(--input-text);
    border-color: var(--border-color);
  }

  .form-select option {
    background-color: var(--input-bg);
    color: var(--input-text);
  }

  .form-select:focus, .form-control:focus {
    background-color: var(--input-bg);
    color: var(--input-text);
    border-color: #0d6efd;
  }

  html.dark-mode .text-muted, 
  body.dark-mode .text-muted {
    color: #b0bec5 !important;
  }

  /* STYLING JADUAL MOD GELAP */
  .table {
    color: var(--text-color);
    border-color: var(--table-border);
  }

  .table-primary {
    --bs-table-bg: var(--table-header-bg);
    --bs-table-color: var(--table-header-text);
  }

  html.dark-mode .table-hover tbody tr:hover {
    color: #ffffff;
    background-color: rgba(255, 255, 255, 0.05);
  }

  html.dark-mode .table th,
  html.dark-mode .table td {
    background-color: var(--card-bg);
    color: var(--text-color);
    border-color: var(--table-border);
  }

  /* RESPONSIVE UNTUK TELEFON (< 992px) */
  @media (max-width: 991.98px) {
    .sidebar {
      width: 100%;
      height: auto;
      position: relative;
    }

    .logo {
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo i {
      font-size: 1.8rem !important;
    }

    .logo h5 {
      margin: 0;
      font-size: 1.1rem;
    }

    .sidebar-menu {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      background: var(--sidebar-mobile-bg);
      padding: 5px 0;
    }

    .sidebar a {
      padding: 10px 15px;
      font-size: 0.9rem;
    }

    .content {
      margin-left: 0;
      padding: 15px;
    }

    .filter-box, .chart-box, .table-box {
      padding: 15px;
    }

    .filter-box .row {
      flex-direction: column;
      align-items: stretch !important;
    }

    .filter-box .col-auto {
      width: 100%;
    }

    .filter-box .btn {
      width: 100%;
      margin-top: 5px;
    }
  }

  /* PRINT STYLES */
  @media print {
    .sidebar, .filter-box, .btn, #logoutBtn {
      display: none !important;
    }
    .content {
      margin-left: 0 !important;
      padding: 0 !important;
    }
    .card-box, .chart-box, .table-box {
      box-shadow: none !important;
      border: 1px solid #ccc !important;
      background: white !important;
      color: black !important;
    }
  }
</style>

<!-- SKRIP SEGERA APABILA PAGE LOAD UNTUK ELAK SCREEN FLICKER -->
<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
</script>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <div class="sidebar-menu">
    <a href="dashboard.html"><i class="fa fa-chart-line"></i> <span data-i18n="menuDashboard">Dashboard</span></a>
    <a href="users.html"><i class="fa fa-users"></i> <span data-i18n="menuUsers">Users</span></a>
    <a href="booking.html"><i class="fa fa-calendar-check"></i> <span data-i18n="menuBookings">Bookings</span></a>
    <a href="accesslog.html"><i class="fa fa-clock"></i> <span data-i18n="menuAccessLog">Access Log</span></a>
    <a href="laboratory.html"><i class="fa fa-building"></i> <span data-i18n="menuLaboratories">Laboratories</span></a>
    <a href="reports.html" class="active"><i class="fa fa-file"></i> <span data-i18n="menuReports">Reports</span></a>
    <a href="settings.html"><i class="fa fa-cog"></i> <span data-i18n="menuSettings">Settings</span></a>
    <a href="profile.html"><i class="fa fa-user"></i> <span data-i18n="menuProfile">Profile</span></a>
    <a href="#" id="logoutBtn"><i class="fa fa-sign-out-alt"></i> <span data-i18n="menuLogout">Logout</span></a>
  </div>
</div>

<!-- CONTENT -->
<div class="content">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h3 class="mb-0" data-i18n="pageHeader">Reports</h3>
    <div id="adminHeaderName" class="fw-bold text-muted" data-i18n="loadingText">Admin 👤</div>
  </div>

  <!-- FILTER -->
  <div class="filter-box mb-4">
    <div class="row g-3 align-items-center">
      <div class="col-auto">
        <label class="col-form-label fw-bold" data-i18n="reportTypeLabel">Report Type</label>
      </div>
      <div class="col-auto">
        <select class="form-select" id="reportType">
          <option value="monthly" data-i18n="optMonthly">Monthly Report</option>
          <option value="weekly" data-i18n="optWeekly">Weekly Report</option>
          <option value="yearly" data-i18n="optYearly">Yearly Report</option>
        </select>
      </div>
      <div class="col-auto">
        <label class="col-form-label fw-bold" data-i18n="monthLabel">Month</label>
      </div>
      <div class="col-auto">
        <select class="form-select" id="reportMonth">
          <option value="0" data-i18n="m0">January</option>
          <option value="1" data-i18n="m1">February</option>
          <option value="2" data-i18n="m2">March</option>
          <option value="3" data-i18n="m3">April</option>
          <option value="4" data-i18n="m4">May</option>
          <option value="5" data-i18n="m5">June</option>
          <option value="6" data-i18n="m6">July</option>
          <option value="7" data-i18n="m7">August</option>
          <option value="8" data-i18n="m8">September</option>
          <option value="9" data-i18n="m9">October</option>
          <option value="10" data-i18n="m10">November</option>
          <option value="11" data-i18n="m11">December</option>
        </select>
      </div>
      <div class="col-auto ms-lg-auto">
        <button class="btn btn-primary generate w-100" id="generateBtn" data-i18n="generateBtnText">Generate Report</button>
      </div>
    </div>
  </div>

  <!-- SUMMARY CARDS -->
  <div class="row g-3 mb-4">
    <div class="col-12 col-sm-6 col-lg-3">
      <div class="card card-box p-3">
        <small class="text-muted fw-bold" data-i18n="cardTotalAccess">Total Access</small>
        <div class="value blue" id="totalAccess">0</div>
      </div>
    </div>
    <div class="col-12 col-sm-6 col-lg-3">
      <div class="card card-box p-3">
        <small class="text-muted fw-bold" data-i18n="cardSuccessAccess">Successful Access</small>
        <div class="value green" id="successAccess">0</div>
      </div>
    </div>
    <div class="col-12 col-sm-6 col-lg-3">
      <div class="card card-box p-3">
        <small class="text-muted fw-bold" data-i18n="cardFailedAccess">Failed Access</small>
        <div class="value red" id="failedAccess">0</div>
      </div>
    </div>
    <div class="col-12 col-sm-6 col-lg-3">
      <div class="card card-box p-3">
        <small class="text-muted fw-bold" data-i18n="cardRegUsers">Registered Users</small>
        <div class="value" id="registeredUsers">0</div>
      </div>
    </div>
  </div>

  <!-- CHARTS -->
  <div class="row g-3 mb-4">
    <div class="col-12 col-lg-8">
      <div class="chart-box">
        <h5 class="mb-3" data-i18n="chartAccessSummary">Access Summary</h5>
        <div style="position: relative; height: 300px; width: 100%;">
          <canvas id="barChart"></canvas>
        </div>
      </div>
    </div>
    <div class="col-12 col-lg-4">
      <div class="chart-box">
        <h5 class="mb-3" data-i18n="chartActiveLabs">Most Active Labs</h5>
        <div style="position: relative; height: 300px; width: 100%;">
          <canvas id="pieChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="row g-3 mb-4">
    <div class="col-12">
      <div class="table-box">
        <h5 class="mb-3" data-i18n="tableRecentReports">Recent Reports</h5>
        <div class="table-responsive">
          <table class="table table-hover text-center align-middle">
            <thead class="table-primary">
              <tr>
                <th data-i18n="thDate">Date</th>
                <th data-i18n="thLab">Lab</th>
                <th data-i18n="thSuccessful">Successful</th>
                <th data-i18n="thFailed">Failed</th>
              </tr>
            </thead>
            <tbody id="reportTableBody">
              <tr><td colspan="4" class="text-muted" data-i18n="loadingData">Loading data...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="mt-3 d-flex flex-wrap gap-2">
          <button class="btn btn-success download flex-fill flex-sm-grow-0" id="downloadBtn">
            <i class="fas fa-download me-1"></i> <span data-i18n="downloadCsvBtn">Download CSV</span>
          </button>
          <button class="btn btn-warning text-white print flex-fill flex-sm-grow-0" id="printBtn">
            <i class="fas fa-print me-1"></i> <span data-i18n="printBtn">Print</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  import { auth, signOut, onAuthStateChanged, db, ref, get, child, onValue } from './firebase-config.js';

  // KAMUS TERJEMAHAN BAHASA (EN & MS)
  const translations = {
    en: {
      pageTitle: "Reports - Smart Access",
      menuDashboard: "Dashboard",
      menuUsers: "Users",
      menuBookings: "Bookings",
      menuAccessLog: "Access Log",
      menuLaboratories: "Laboratories",
      menuReports: "Reports",
      menuSettings: "Settings",
      menuProfile: "Profile",
      menuLogout: "Logout",
      pageHeader: "Reports",
      loadingText: "Loading...",
      reportTypeLabel: "Report Type",
      optMonthly: "Monthly Report",
      optWeekly: "Weekly Report",
      optYearly: "Yearly Report",
      monthLabel: "Month",
      m0: "January", m1: "February", m2: "March", m3: "April", m4: "May", m5: "June",
      m6: "July", m7: "August", m8: "September", m9: "October", m10: "November", m11: "December",
      generateBtnText: "Generate Report",
      cardTotalAccess: "Total Access",
      cardSuccessAccess: "Successful Access",
      cardFailedAccess: "Failed Access",
      cardRegUsers: "Registered Users",
      chartAccessSummary: "Access Summary",
      chartActiveLabs: "Most Active Labs",
      tableRecentReports: "Recent Reports",
      thDate: "Date",
      thLab: "Lab",
      thSuccessful: "Successful",
      thFailed: "Failed",
      loadingData: "Loading data...",
      noReportData: "No report data available",
      downloadCsvBtn: "Download CSV",
      printBtn: "Print",
      successLabel: "Successful Access",
      failedLabel: "Failed Access",
      noDataLabel: "No Data"
    },
    ms: {
      pageTitle: "Laporan - Smart Access",
      menuDashboard: "Papan Utama",
      menuUsers: "Pengguna",
      menuBookings: "Tempahan",
      menuAccessLog: "Log Akses",
      menuLaboratories: "Makmal",
      menuReports: "Laporan",
      menuSettings: "Tetapan",
      menuProfile: "Profil",
      menuLogout: "Log Keluar",
      pageHeader: "Laporan",
      loadingText: "Memuatkan...",
      reportTypeLabel: "Jenis Laporan",
      optMonthly: "Laporan Bulanan",
      optWeekly: "Laporan Mingguan",
      optYearly: "Laporan Tahunan",
      monthLabel: "Bulan",
      m0: "Januari", m1: "Februari", m2: "Mac", m3: "April", m4: "Mei", m5: "Jun",
      m6: "Julai", m7: "Ogos", m8: "September", m9: "Oktober", m10: "November", m11: "Disember",
      generateBtnText: "Jana Laporan",
      cardTotalAccess: "Jumlah Akses",
      cardSuccessAccess: "Akses Berjaya",
      cardFailedAccess: "Akses Gagal",
      cardRegUsers: "Pengguna Berdaftar",
      chartAccessSummary: "Ringkasan Akses",
      chartActiveLabs: "Makmal Paling Aktif",
      tableRecentReports: "Laporan Terkini",
      thDate: "Tarikh",
      thLab: "Makmal",
      thSuccessful: "Berjaya",
      thFailed: "Gagal",
      loadingData: "Memuatkan data...",
      noReportData: "Tiada data laporan tersedia",
      downloadCsvBtn: "Muat Turun CSV",
      printBtn: "Cetak",
      successLabel: "Akses Berjaya",
      failedLabel: "Akses Gagal",
      noDataLabel: "Tiada Data"
    }
  };

  function setLanguage(lang) {
    const t = translations[lang] || translations.en;
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (t[key]) {
        if (el.tagName === "TITLE") {
          document.title = t[key];
        } else {
          el.innerText = t[key];
        }
      }
    });
  }

  // Muatkan bahasa serta-merta mengikut localStorage
  const currentLang = localStorage.getItem("language") || "en";
  setLanguage(currentLang);

  // 1. PELARASAN TEMA DARK / LIGHT MODE AUTOMATIK
  const isDarkMode = localStorage.getItem("theme") === "dark";
  if (isDarkMode) {
    document.documentElement.classList.add("dark-mode");
    document.body.classList.add("dark-mode");
  }

  // 2. KAWALAN AKSES PERANAN (ADMIN PROTECTION)
  let userNameGlobal = "Admin";
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    const dbRef = ref(db);
    let userRole = 'user';
    let userName = user.displayName || user.email || 'Admin';

    try {
      const snapshot = await get(child(dbRef, `users/${user.uid}`));
      if (snapshot.exists()) {
        const data = snapshot.val();
        if (data.role) userRole = data.role.toString().toLowerCase();
        if (data.name) userName = data.name;
      } else {
        const allUsersSnap = await get(child(dbRef, 'users'));
        if (allUsersSnap.exists()) {
          const allUsers = allUsersSnap.val();
          Object.keys(allUsers).forEach(key => {
            if (allUsers[key].email && allUsers[key].email.toLowerCase() === user.email.toLowerCase()) {
              if (allUsers[key].role) userRole = allUsers[key].role.toString().toLowerCase();
              if (allUsers[key].name) userName = allUsers[key].name;
            }
          });
        }
      }
    } catch (err) {
      console.error("Autentikasi Ralat:", err);
    }

    if (userRole !== 'admin') {
      alert("Akses ditolak! Halaman ini khusus untuk Pentadbir (Admin) sahaja.");
      window.location.href = "user-dashboard.html";
      return;
    }

    userNameGlobal = userName;
    document.getElementById("adminHeaderName").innerText = `${userName} 👤`;
  });

  // 3. FUNGSI LOGOUT FIREBASE
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", (e) => {
      e.preventDefault();
      signOut(auth)
        .then(() => { window.location.href = "index.html"; })
        .catch((error) => {
          console.error("Logout Error:", error);
          alert("Gagal untuk log keluar. Sila cuba lagi.");
        });
    });
  }

  // Set default pilihan bulan semasa pada dropdown
  document.getElementById("reportMonth").value = new Date().getMonth();

  // 4. REAL-TIME LISTENER: REGISTERED USERS
  onValue(ref(db, 'users'), (snapshot) => {
    const users = snapshot.val();
    document.getElementById("registeredUsers").innerText = users ? Object.keys(users).length : 0;
  });

  // Global Variable untuk Instance Chart & Rekod Log
  let pieChartInstance = null;
  let barChartInstance = null;
  let allLogsData = [];

  // 5. REAL-TIME LISTENER: ACCESS LOGS
  onValue(ref(db, 'access_logs'), (snapshot) => {
    const data = snapshot.val();
    allLogsData = [];

    if (data) {
      Object.keys(data).forEach((key) => {
        allLogsData.push(data[key]);
      });
    }
    filterAndRenderReports();
  });

  // FUNGSI PENAPISAN DATA (FILTER)
  function filterAndRenderReports() {
    const selectedMonth = parseInt(document.getElementById("reportMonth").value, 10);
    const selectedType = document.getElementById("reportType").value;

    const filteredLogs = allLogsData.filter(log => {
      const rawDate = log.timestamp || log.date || log.time;
      if (!rawDate) return true;
      
      const logDate = new Date(rawDate);
      if (isNaN(logDate.getTime())) return true;

      if (selectedType === 'monthly') {
        return logDate.getMonth() === selectedMonth;
      }
      return true;
    });

    processAndRenderReports(filteredLogs);
  }

  // FUNGSI MEMPROSES & PAPAR KAD, JADUAL DAN CARTA REAL-TIME
  function processAndRenderReports(logs) {
    let total = logs.length;
    let success = 0;
    let failed = 0;
    const labCounts = {};

    const weeklySuccess = [0, 0, 0, 0];
    const weeklyFailed = [0, 0, 0, 0];

    const reportBody = document.getElementById("reportTableBody");
    reportBody.innerHTML = "";

    logs.forEach((log) => {
      const status = (log.status || '').toLowerCase();
      const isSuccess = status.includes('success') || status.includes('granted') || status.includes('unlocked') || status.includes('berjaya');

      if (isSuccess) {
        success++;
      } else {
        failed++;
      }

      const labName = log.labName || log.location || log.lab || 'Unknown Lab';
      labCounts[labName] = (labCounts[labName] || 0) + 1;

      const rawDate = log.timestamp || log.date || log.time;
      if (rawDate) {
        const logDate = new Date(rawDate);
        if (!isNaN(logDate.getTime())) {
          const dayOfMonth = logDate.getDate();
          let weekIndex = Math.floor((dayOfMonth - 1) / 7);
          if (weekIndex > 3) weekIndex = 3;

          if (isSuccess) {
            weeklySuccess[weekIndex]++;
          } else {
            weeklyFailed[weekIndex]++;
          }
        }
      }
    });

    document.getElementById("totalAccess").innerText = total;
    document.getElementById("successAccess").innerText = success;
    document.getElementById("failedAccess").innerText = failed;

    const langNow = localStorage.getItem("language") || "en";
    const tMsg = translations[langNow] || translations.en;

    if (logs.length > 0) {
      const recentLogs = [...logs].reverse().slice(0, 5);
      recentLogs.forEach((log) => {
        const status = (log.status || '').toLowerCase();
        const isSuccess = status.includes('success') || status.includes('granted') || status.includes('unlocked') || status.includes('berjaya');

        reportBody.innerHTML += `
          <tr>
            <td>${log.date || log.time || log.timestamp || 'N/A'}</td>
            <td>${log.labName || log.location || log.lab || 'N/A'}</td>
            <td>${isSuccess ? 1 : 0}</td>
            <td>${!isSuccess ? 1 : 0}</td>
          </tr>`;
      });
    } else {
      reportBody.innerHTML = `<tr><td colspan="4" class="text-muted">${tMsg.noReportData}</td></tr>`;
    }

    const chartTextColor = isDarkMode ? '#e0e0e0' : '#6c757d';

    const labLabels = Object.keys(labCounts);
    const labValues = Object.values(labCounts);

    if (pieChartInstance) pieChartInstance.destroy();
    pieChartInstance = new Chart(document.getElementById('pieChart'), {
      type: 'pie',
      data: {
        labels: labLabels.length > 0 ? labLabels : [tMsg.noDataLabel],
        datasets: [{
          data: labValues.length > 0 ? labValues : [1],
          backgroundColor: ['#0d6efd', '#2ecc71', '#f1c40f', '#e74c3c', '#95a5a6']
        }]
      },
      options: { 
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { labels: { color: chartTextColor } }
        }
      }
    });

    if (barChartInstance) barChartInstance.destroy();
    barChartInstance = new Chart(document.getElementById('barChart'), {
      type: 'bar',
      data: {
        labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
        datasets: [
          {
            label: tMsg.successLabel,
            data: weeklySuccess,
            backgroundColor: '#0d6efd'
          },
          {
            label: tMsg.failedLabel,
            data: weeklyFailed,
            backgroundColor: '#e74c3c'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { 
            position: 'top',
            labels: { color: chartTextColor }
          }
        },
        scales: {
          x: { ticks: { color: chartTextColor }, grid: { display: false } },
          y: { 
            ticks: { color: chartTextColor, stepSize: 1 }, 
            grid: { color: isDarkMode ? '#333' : '#e5e5e5' } 
          }
        }
      }
    });
  }

  document.getElementById("generateBtn").onclick = filterAndRenderReports;
  document.getElementById("reportMonth").onchange = filterAndRenderReports;
  document.getElementById("reportType").onchange = filterAndRenderReports;

  document.getElementById("printBtn").onclick = function() {
    window.print();
  };

  document.getElementById("downloadBtn").onclick = function() {
    if (allLogsData.length === 0) {
      alert("Tiada data untuk dimuat turun.");
      return;
    }

    let csvContent = "data:text/csv;charset=utf-8,Date,Lab,Status\n";
    allLogsData.forEach(log => {
      csvContent += `"${log.date || log.timestamp || 'N/A'}","${log.labName || log.location || log.lab || 'N/A'}","${log.status || 'N/A'}"\n`;
    });

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `smart_access_report_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };
</script>

</body>
</html>
