<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports - Smart Access</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  /* VARIABLE TEMA (DEFAULT LIGHT MODE) */
  :root {
    --bg-color: #f4f6f9;
    --text-color: #212529;
    --card-bg: #ffffff;
    --sidebar-bg: #032b67;
    --sidebar-hover: #0d6efd;
    --sidebar-mobile-bg: #021f4b;
    --border-color: #ced4da;
    --input-bg: #ffffff;
    --input-text: #212529;
    --subtext-color: #6c757d;
    --table-header-bg: #0d6efd;
    --table-header-text: #ffffff;
    --table-border: #dee2e6;
  }

  /* DARK MODE OVERRIDES */
  body.dark-mode {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --card-bg: #1e1e1e;
    --sidebar-bg: #0b192c;
    --sidebar-hover: #1e40af;
    --sidebar-mobile-bg: #070f1e;
    --border-color: #444444;
    --input-bg: #2d2d2d;
    --input-text: #ffffff;
    --subtext-color: #aaa;
    --table-header-bg: #1e3a5f;
    --table-header-text: #ffffff;
    --table-border: #333333;
  }

  body { 
    background: var(--bg-color); 
    color: var(--text-color);
    font-family: 'Segoe UI', sans-serif; 
    margin: 0;
    transition: background 0.3s, color 0.3s;
  }

  /* SIDEBAR DASHBOARD */
  .sidebar { 
    width: 240px; 
    height: 100vh; 
    background: var(--sidebar-bg); 
    position: fixed; 
    color: white; 
    top: 0; 
    left: 0; 
    z-index: 1000;
    transition: background 0.3s;
  }

  .logo { 
    text-align: center; 
    padding: 20px; 
    border-bottom: 1px solid rgba(255,255,255,.2); 
  }

  .logo h5 { 
    margin-top: 10px; 
  }

  .sidebar-menu {
    display: block;
  }

  .sidebar a { 
    display: block; 
    color: white; 
    text-decoration: none; 
    padding: 12px 20px; 
    transition: background 0.2s;
  }

  .sidebar a:hover, .sidebar a.active { 
    background: var(--sidebar-hover); 
  }

  /* MAIN CONTENT */
  .content { 
    margin-left: 240px; 
    padding: 20px; 
  }

  .filter-box, .card-box, .chart-box, .table-box { 
    background: var(--card-bg); 
    color: var(--text-color);
    padding: 20px; 
    border-radius: 10px; 
    box-shadow: 0 2px 8px rgba(0,0,0,.15); 
    border: none;
    transition: background 0.3s, color 0.3s;
  }

  .value { 
    font-size: 28px; 
    font-weight: bold; 
  }

  .green { color: #198754; } 
  .red { color: #dc3545; } 
  .blue { color: #0d6efd; }

  /* FORM CONTROLS DENGAN SUPPORT TEMA */
  .form-select, .form-control {
    background-color: var(--input-bg);
    color: var(--input-text);
    border-color: var(--border-color);
  }

  .form-select:focus, .form-control:focus {
    background-color: var(--input-bg);
    color: var(--input-text);
    border-color: #0d6efd;
  }

  .text-muted {
    color: var(--subtext-color) !important;
  }

  /* STYLING JADUAL MOD GELAP */
  .table {
    color: var(--text-color);
    border-color: var(--table-border);
  }

  .table-primary {
    --bs-table-bg: var(--table-header-bg);
    --bs-table-color: var(--table-header-text);
  }

  body.dark-mode .table-hover tbody tr:hover {
    color: #ffffff;
    background-color: rgba(255, 255, 255, 0.05);
  }

  /* RESPONSIVE UNTUK TELEFON (< 992px) */
  @media (max-width: 991.98px) {
    .sidebar {
      width: 100%;
      height: auto;
      position: relative;
    }

    .logo {
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo i {
      font-size: 1.8rem !important;
    }

    .logo h5 {
      margin: 0;
      font-size: 1.1rem;
    }

    .sidebar-menu {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      background: var(--sidebar-mobile-bg);
      padding: 5px 0;
    }

    .sidebar a {
      padding: 10px 15px;
      font-size: 0.9rem;
    }

    .content {
      margin-left: 0;
      padding: 15px;
    }

    .filter-box, .chart-box, .table-box {
      padding: 15px;
    }

    .filter-box .row {
      flex-direction: column;
      align-items: stretch !important;
    }

    .filter-box .col-auto {
      width: 100%;
    }

    .filter-box .btn {
      width: 100%;
      margin-top: 5px;
    }
  }

  /* PRINT STYLES */
  @media print {
    .sidebar, .filter-box, .btn, #logoutBtn {
      display: none !important;
    }
    .content {
      margin-left: 0 !important;
      padding: 0 !important;
    }
    .card-box, .chart-box, .table-box {
      box-shadow: none !important;
      border: 1px solid #ccc !important;
      background: white !important;
      color: black !important;
    }
  }
</style>

<!-- SKRIP SEGERA APABILA PAGE LOAD UNTUK ELAK SCREEN FLICKER -->
<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
</script>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <div class="sidebar-menu">
    <a href="dashboard.html"><i class="fa fa-chart-line"></i> Dashboard</a>
    <a href="users.html"><i class="fa fa-users"></i> Users</a>
    <a href="accesslog.html"><i class="fa fa-clock"></i> Access Log</a>
    <a href="laboratory.html"><i class="fa fa-building"></i> Laboratories</a>
    <a href="reports.html" class="active"><i class="fa fa-file"></i> Reports</a>
    <a href="notification.html"><i class="fa fa-bell"></i> Notifications</a>
    <a href="settings.html"><i class="fa fa-cog"></i> Settings</a>
    <a href="profile.html"><i class="fa fa-user"></i> Profile</a>
    <a href="logout.html" id="logoutBtn"><i class="fa fa-sign-out-alt"></i> Logout</a>
  </div>
</div>

<!-- CONTENT -->
<div class="content">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h3 class="mb-0">Reports</h3>
    <div id="adminHeaderName">Admin 👤</div>
  </div>

  <!-- FILTER -->
  <div class="filter-box mb-4">
    <div class="row g-3 align-items-center">
      <div class="col-auto">
        <label class="col-form-label fw-bold">Report Type</label>
      </div>
      <div class="col-auto">
        <select class="form-select" id="reportType">
          <option value="monthly">Monthly Report</option>
          <option value="weekly">Weekly Report</option>
          <option value="yearly">Yearly Report</option>
        </select>
      </div>
      <div class="col-auto">
        <label class="col-form-label fw-bold">Month</label>
      </div>
      <div class="col-auto">
        <select class="form-select" id="reportMonth">
          <option value="0">January</option>
          <option value="1">February</option>
          <option value="2">March</option>
          <option value="3">April</option>
          <option value="4">May</option>
          <option value="5">June</option>
          <option value="6">July</option>
          <option value="7">August</option>
          <option value="8">September</option>
          <option value="9">October</option>
          <option value="10">November</option>
          <option value="11">December</option>
        </select>
      </div>
      <div class="col-auto ms-lg-auto">
        <button class="btn btn-primary generate w-100" id="generateBtn">Generate Report</button>
      </div>
    </div>
  </div>

  <!-- SUMMARY CARDS -->
  <div class="row g-3 mb-4">
    <div class="col-12 col-sm-6 col-lg-3">
      <div class="card card-box p-3">
        <small class="text-muted fw-bold">Total Access</small>
        <div class="value blue" id="totalAccess">0</div>
      </div>
    </div>
    <div class="col-12 col-sm-6 col-lg-3">
      <div class="card card-box p-3">
        <small class="text-muted fw-bold">Successful Access</small>
        <div class="value green" id="successAccess">0</div>
      </div>
    </div>
    <div class="col-12 col-sm-6 col-lg-3">
      <div class="card card-box p-3">
        <small class="text-muted fw-bold">Failed Access</small>
        <div class="value red" id="failedAccess">0</div>
      </div>
    </div>
    <div class="col-12 col-sm-6 col-lg-3">
      <div class="card card-box p-3">
        <small class="text-muted fw-bold">Registered Users</small>
        <div class="value" id="registeredUsers">0</div>
      </div>
    </div>
  </div>

  <!-- CHARTS -->
  <div class="row g-3 mb-4">
    <div class="col-12 col-lg-8">
      <div class="chart-box">
        <h5 class="mb-3">Access Summary</h5>
        <div style="position: relative; height: 300px; width: 100%;">
          <canvas id="barChart"></canvas>
        </div>
      </div>
    </div>
    <div class="col-12 col-lg-4">
      <div class="chart-box">
        <h5 class="mb-3">Most Active Labs</h5>
        <div style="position: relative; height: 300px; width: 100%;">
          <canvas id="pieChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="row g-3 mb-4">
    <div class="col-12">
      <div class="table-box">
        <h5 class="mb-3">Recent Reports</h5>
        <div class="table-responsive">
          <table class="table table-hover text-center align-middle">
            <thead class="table-primary">
              <tr>
                <th>Date</th>
                <th>Lab</th>
                <th>Successful</th>
                <th>Failed</th>
              </tr>
            </thead>
            <tbody id="reportTableBody">
              <tr><td colspan="4" class="text-muted">Loading data...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="mt-3 d-flex flex-wrap gap-2">
          <button class="btn btn-success download flex-fill flex-sm-grow-0" id="downloadBtn">
            <i class="fas fa-download me-1"></i> Download CSV
          </button>
          <button class="btn btn-warning text-white print flex-fill flex-sm-grow-0" id="printBtn">
            <i class="fas fa-print me-1"></i> Print
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  import { auth, signOut, onAuthStateChanged, db, ref, onValue } from './firebase-config.js';

  // 1. PELARASAN TEMA DARK / LIGHT MODE AUTOMATIK
  const isDarkMode = localStorage.getItem("theme") === "dark";
  if (isDarkMode) {
    document.body.classList.add("dark-mode");
  }

  // 2. SEMAKAN KESELAMATAN (AUTH PROTECTION)
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "index.html";
    } else if (user.displayName) {
      document.getElementById("adminHeaderName").innerText = `${user.displayName} 👤`;
    }
  });

  // 3. FUNGSI LOGOUT FIREBASE
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", (e) => {
      e.preventDefault();
      signOut(auth)
        .then(() => {
          window.location.href = "index.html";
        })
        .catch((error) => {
          console.error("Logout Error:", error);
          alert("Gagal untuk log keluar. Sila cuba lagi.");
        });
    });
  }

  // Set bulan semasa pada dropdown filter
  document.getElementById("reportMonth").value = new Date().getMonth();

  // 4. AMBIL JUMLAH REGISTERED USERS DARI FIREBASE
  onValue(ref(db, 'users'), (snapshot) => {
    const users = snapshot.val();
    document.getElementById("registeredUsers").innerText = users ? Object.keys(users).length : 0;
  });

  // Variable Global Carta
  let pieChartInstance = null;
  let barChartInstance = null;
  let allLogsData = [];

  // 5. BACA LOG AKSES DARI FIREBASE REALTIME
  onValue(ref(db, 'access_logs'), (snapshot) => {
    const data = snapshot.val();
    allLogsData = [];

    if (data) {
      Object.keys(data).forEach((key) => {
        allLogsData.push(data[key]);
      });
    }
    processAndRenderReports(allLogsData);
  });

  // FUNGSI PROSES & PAPAR CARTA DAN JADUAL
  function processAndRenderReports(logs) {
    let total = logs.length;
    let success = 0;
    let failed = 0;
    const labCounts = {};
    const reportBody = document.getElementById("reportTableBody");
    reportBody.innerHTML = "";

    logs.forEach((log) => {
      const status = (log.status || '').toLowerCase();
      if (status.includes('success') || status.includes('granted')) {
        success++;
      } else {
        failed++;
      }

      const labName = log.labName || log.location || 'Unknown Lab';
      labCounts[labName] = (labCounts[labName] || 0) + 1;
    });

    document.getElementById("totalAccess").innerText = total;
    document.getElementById("successAccess").innerText = success;
    document.getElementById("failedAccess").innerText = failed;

    // Tampilkan 5 log terkini ke dalam jadual
    if (logs.length > 0) {
      const recentLogs = [...logs].reverse().slice(0, 5);
      recentLogs.forEach((log) => {
        const isSuccess = (log.status || '').toLowerCase().includes('success') || (log.status || '').toLowerCase().includes('granted');
        reportBody.innerHTML += `
          <tr>
            <td>${log.date || log.time || 'N/A'}</td>
            <td>${log.labName || log.location || 'N/A'}</td>
            <td>${isSuccess ? 1 : 0}</td>
            <td>${!isSuccess ? 1 : 0}</td>
          </tr>`;
      });
    } else {
      reportBody.innerHTML = `<tr><td colspan="4" class="text-muted">No report data available</td></tr>`;
    }

    // Tetapan Warna Teks Carta mengikut Tema
    const chartTextColor = isDarkMode ? '#e0e0e0' : '#6c757d';

    // KEMASKINI PIE CHART (MOST ACTIVE LABS)
    const labLabels = Object.keys(labCounts);
    const labValues = Object.values(labCounts);

    if (pieChartInstance) pieChartInstance.destroy();
    pieChartInstance = new Chart(document.getElementById('pieChart'), {
      type: 'pie',
      data: {
        labels: labLabels.length > 0 ? labLabels : ['No Data'],
        datasets: [{
          data: labValues.length > 0 ? labValues : [1],
          backgroundColor: ['#0d6efd', '#198754', '#ffc107', '#dc3545', '#6c757d']
        }]
      },
      options: { 
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            labels: { color: chartTextColor }
          }
        }
      }
    });

    // KEMASKINI BAR CHART (ACCESS SUMMARY)
    if (barChartInstance) barChartInstance.destroy();
    barChartInstance = new Chart(document.getElementById('barChart'), {
      type: 'bar',
      data: {
        labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
        datasets: [
          {
            label: 'Successful Access',
            data: [Math.round(success * 0.2), Math.round(success * 0.3), Math.round(success * 0.25), Math.round(success * 0.25)],
            backgroundColor: '#0d6efd'
          },
          {
            label: 'Failed Access',
            data: [Math.round(failed * 0.2), Math.round(failed * 0.3), Math.round(failed * 0.25), Math.round(failed * 0.25)],
            backgroundColor: '#dc3545'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { 
            position: 'top',
            labels: { color: chartTextColor }
          }
        },
        scales: {
          x: { ticks: { color: chartTextColor }, grid: { display: false } },
          y: { ticks: { color: chartTextColor }, grid: { color: isDarkMode ? '#333' : '#e5e5e5' } }
        }
      }
    });
  }

  // BUTTON GENERATE REPORT FILTER
  document.getElementById("generateBtn").onclick = function() {
    processAndRenderReports(allLogsData);
  };

  // PRINT REPORT
  document.getElementById("printBtn").onclick = function() {
    window.print();
  };

  // DOWNLOAD CSV REPORT
  document.getElementById("downloadBtn").onclick = function() {
    if (allLogsData.length === 0) {
      alert("Tiada data untuk dimuat turun.");
      return;
    }

    let csvContent = "data:text/csv;charset=utf-8,Date,Lab,Status\n";
    allLogsData.forEach(log => {
      csvContent += `${log.date || 'N/A'},${log.labName || log.location || 'N/A'},${log.status || 'N/A'}\n`;
    });

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `smart_access_report_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };
</script>

</body>
</html>
