<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{ background:#f4f6f9; font-family: Segoe UI, sans-serif; }

/* SIDEBAR DASHBOARD */
.sidebar{ width:240px; height:100vh; background:#032b67; position:fixed; color:white; top:0; left:0; }
.logo{ text-align:center; padding:20px; border-bottom:1px solid rgba(255,255,255,.2); }
.logo h5{ margin-top:10px; }
.sidebar a{ display:block; color:white; text-decoration:none; padding:12px 20px; }
.sidebar a:hover, .sidebar a.active{ background:#0d6efd; }

/* CONTENT */
.content{ margin-left:240px; padding:20px; }

/* COMPONENTS */
.filter-box{ background:white; padding:20px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.1); }
.card-box{ border:none; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.1); background:white; }
.chart-box, .table-box{ background:white; padding:20px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.1); }

.value{ font-size:28px; font-weight:bold; }
.green{ color:green; } 
.red{ color:red; } 
.blue{ color:#0d6efd; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <a href="dashboard.html"><i class="fa fa-chart-line"></i> Dashboard</a>
  <a href="users.html"><i class="fa fa-users"></i> Users</a>
  <a href="accesslog.html"><i class="fa fa-clock"></i> Access Log</a>
  <a href="laboratory.html"><i class="fa fa-building"></i> Laboratories</a>
  <a href="reports.html" class="active"><i class="fa fa-file"></i> Reports</a>
  <a href="notification.html"><i class="fa fa-bell"></i> Notifications</a>
  <a href="settings.html"><i class="fa fa-cog"></i> Settings</a>
  <a href="profile.html"><i class="fa fa-user"></i> Profile</a>
  <a href="#" id="logoutBtn"><i class="fa fa-sign-out-alt"></i> Logout</a>
</div>

<!-- CONTENT -->
<div class="content">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3>Reports</h3>
    <div>Admin 👤</div>
  </div>

  <!-- FILTER -->
  <div class="filter-box mb-4">
    <div class="row g-3 align-items-center">
      <div class="col-auto">
        <label class="col-form-label fw-bold">Report Type</label>
      </div>
      <div class="col-auto">
        <select class="form-select">
          <option>Monthly Report</option>
          <option>Weekly Report</option>
          <option>Yearly Report</option>
        </select>
      </div>
      <div class="col-auto">
        <label class="col-form-label fw-bold">Month</label>
      </div>
      <div class="col-auto">
        <select class="form-select">
          <option>January</option>
          <option>February</option>
          <option>March</option>
          <option>April</option>
          <option>May</option>
          <option>June</option>
          <option>July</option>
          <option>August</option>
          <option>September</option>
          <option>October</option>
          <option>November</option>
          <option>December</option>
        </select>
      </div>
      <div class="col-auto">
        <button class="btn btn-primary generate">Generate Report</button>
      </div>
    </div>
  </div>

  <!-- SUMMARY CARDS -->
  <div class="row mb-4">
    <div class="col-md-3">
      <div class="card card-box p-3">
        <small class="text-muted fw-bold">Total Access</small>
        <div class="value blue" id="totalAccess">0</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card card-box p-3">
        <small class="text-muted fw-bold">Successful Access</small>
        <div class="value green" id="successAccess">0</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card card-box p-3">
        <small class="text-muted fw-bold">Failed Access</small>
        <div class="value red" id="failedAccess">0</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card card-box p-3">
        <small class="text-muted fw-bold">Registered Users</small>
        <div class="value" id="registeredUsers">0</div>
      </div>
    </div>
  </div>

  <!-- CHARTS -->
  <div class="row mb-4">
    <div class="col-md-8">
      <div class="chart-box">
        <h5 class="mb-3">Access Summary</h5>
        <canvas id="barChart"></canvas>
      </div>
    </div>
    <div class="col-md-4">
      <div class="chart-box">
        <h5 class="mb-3">Most Active Labs</h5>
        <canvas id="pieChart"></canvas>
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="row mb-4">
    <div class="col-md-12">
      <div class="table-box">
        <h5 class="mb-3">Recent Reports</h5>
        <table class="table table-hover text-center align-middle">
          <thead class="table-primary">
            <tr>
              <th>Date</th>
              <th>Lab</th>
              <th>Successful</th>
              <th>Failed</th>
            </tr>
          </thead>
          <tbody id="reportTableBody">
            <tr><td colspan="4" class="text-muted">Loading data...</td></tr>
          </tbody>
        </table>

        <div class="mt-3">
          <button class="btn btn-success me-2 download">
            <i class="fas fa-download"></i> Download PDF
          </button>
          <button class="btn btn-warning text-white print">
            <i class="fas fa-print"></i> Print
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  import { auth, signOut, onAuthStateChanged, db, ref, onValue } from './firebase-config.js';

  // 1. SEMAKAN KESELAMATAN (AUTH PROTECTION)
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "index.html";
    }
  });

  // 2. FUNGSI LOGOUT FIREBASE
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", (e) => {
      e.preventDefault();
      
      signOut(auth)
        .then(() => {
          window.location.href = "index.html";
        })
        .catch((error) => {
          console.error("Logout Error:", error);
          alert("Gagal untuk log keluar. Sila cuba lagi.");
        });
    });
  }

  // 3. KIRA JUMLAH REGISTERED USERS DARI FIREBASE
  onValue(ref(db, 'users'), (snapshot) => {
    const users = snapshot.val();
    document.getElementById("registeredUsers").innerText = users ? Object.keys(users).length : 0;
  });

  // 4. KIRA & PAPARKAN AKSES SERTA CARTA REALTIME DARI FIREBASE
  let pieChartInstance = null;

  onValue(ref(db, 'access_logs'), (snapshot) => {
    const data = snapshot.val();
    let total = 0, success = 0, failed = 0;
    const labCounts = {};
    const reportBody = document.getElementById("reportTableBody");
    reportBody.innerHTML = "";

    if (data) {
      const keys = Object.keys(data);
      total = keys.length;

      keys.forEach((key) => {
        const log = data[key];
        const status = (log.status || '').toLowerCase();
        
        if (status.includes('success') || status.includes('granted')) {
          success++;
        } else {
          failed++;
        }

        const labName = log.labName || log.location || 'Unknown Lab';
        labCounts[labName] = (labCounts[labName] || 0) + 1;
      });

      // Tampilkan 5 log terkini ke dalam jadual
      const recentKeys = keys.reverse().slice(0, 5);
      recentKeys.forEach((key) => {
        const log = data[key];
        const isSuccess = (log.status || '').toLowerCase().includes('success') || (log.status || '').toLowerCase().includes('granted');
        
        reportBody.innerHTML += `
          <tr>
            <td>${log.date || 'N/A'}</td>
            <td>${log.labName || log.location || 'N/A'}</td>
            <td>${isSuccess ? 1 : 0}</td>
            <td>${!isSuccess ? 1 : 0}</td>
          </tr>`;
      });
    } else {
      reportBody.innerHTML = `<tr><td colspan="4" class="text-muted">No report data available</td></tr>`;
    }

    document.getElementById("totalAccess").innerText = total;
    document.getElementById("successAccess").innerText = success;
    document.getElementById("failedAccess").innerText = failed;

    // KEMASKINI PIE CHART SECARA DINAMIK
    const labLabels = Object.keys(labCounts);
    const labValues = Object.values(labCounts);

    if (pieChartInstance) pieChartInstance.destroy();
    pieChartInstance = new Chart(document.getElementById('pieChart'), {
      type: 'pie',
      data: {
        labels: labLabels.length > 0 ? labLabels : ['No Data'],
        datasets: [{
          data: labValues.length > 0 ? labValues : [1],
          backgroundColor: ['#0d6efd', '#198754', '#ffc107', '#dc3545', '#6c757d']
        }]
      },
      options: { responsive: true }
    });
  });

  // BAR CHART STATIC
  new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
      datasets: [
        {
          label: 'Successful Access',
          data: [250, 310, 290, 292],
          backgroundColor: '#0d6efd'
        },
        {
          label: 'Failed Access',
          data: [35, 25, 40, 44],
          backgroundColor: '#dc3545'
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'top' }
      }
    }
  });

  // PRINT REPORT
  document.querySelector(".print").onclick = function() {
    window.print();
  }

  // DOWNLOAD PDF
  document.querySelector(".download").onclick = function() {
    alert("Report downloaded successfully.");
  }
</script>

</body>
</html>
