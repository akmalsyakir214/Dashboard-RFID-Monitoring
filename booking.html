<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pageTitle">Pengurusan Tempahan - Admin Smart Access</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<!-- Pustaka JSZip & pdfmake -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
</script>

<style>
  :root {
    --bg-color: #f4f6f9;
    --text-color: #212529;
    --card-bg: #ffffff;
    --sidebar-bg: #032b67;
    --sidebar-hover: #0d6efd;
    --border-color: #dee2e6;
    --input-bg: #ffffff;
    --input-text: #212529;
    --table-text: #212529;
  }

  html.dark-mode, body.dark-mode {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --card-bg: #1e1e1e;
    --sidebar-bg: #0b192c;
    --sidebar-hover: #1e40af;
    --border-color: #333333;
    --input-bg: #2d2d2d;
    --input-text: #ffffff;
    --table-text: #e0e0e0;
  }

  body { 
    background: var(--bg-color); 
    color: var(--text-color);
    font-family: 'Segoe UI', sans-serif; 
    margin: 0;
    transition: background 0.3s, color 0.3s;
  }

  .sidebar { 
    width: 240px; 
    height: 100vh; 
    background: var(--sidebar-bg); 
    position: fixed; 
    color: white; 
    top: 0; 
    left: 0; 
    z-index: 1000;
    transition: background 0.3s;
    overflow-y: auto;
  }

  .logo { 
    text-align: center; 
    padding: 20px; 
    border-bottom: 1px solid rgba(255,255,255,.2); 
  }

  .logo h5 { margin-top: 10px; }

  .sidebar a { 
    display: block; 
    color: white; 
    text-decoration: none; 
    padding: 12px 20px; 
    transition: background 0.2s;
  }

  .sidebar a:hover, .sidebar a.active { 
    background: var(--sidebar-hover); 
  }

  .content { 
    margin-left: 240px; 
    padding: 20px; 
  }

  .card-container {
    background: var(--card-bg);
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    padding: 20px;
    border: 1px solid var(--border-color);
    transition: background 0.3s, border-color 0.3s;
  }

  .table {
    color: var(--table-text);
  }

  html.dark-mode .table th, 
  html.dark-mode .table td {
    background-color: var(--card-bg);
    color: var(--text-color);
    border-color: var(--border-color);
  }

  .table-hover tbody tr:hover {
    background-color: rgba(13, 110, 253, 0.05);
  }

  html.dark-mode .table-hover tbody tr:hover {
    background-color: rgba(59, 130, 246, 0.1);
  }

  .time-badge {
    display: inline-block;
    background: rgba(13, 110, 253, 0.12);
    color: #0d6efd;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.82rem;
    font-weight: 600;
    margin: 2px 2px 2px 0;
  }

  body.dark-mode .time-badge {
    background: rgba(59, 130, 246, 0.2);
    color: #60a5fa;
  }

  .btn-custom-csv {
    background-color: #198754;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 8px 18px;
    font-weight: 500;
    font-size: 0.95rem;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background-color 0.2s ease;
  }

  .btn-custom-csv:hover {
    background-color: #146c43;
    color: #ffffff;
  }

  .btn-custom-print {
    background-color: #ffc107;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 8px 18px;
    font-weight: 500;
    font-size: 0.95rem;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background-color 0.2s ease;
  }

  .btn-custom-print:hover {
    background-color: #e0a800;
    color: #ffffff;
  }

  @media (max-width: 991.98px) {
    .sidebar { width: 100%; height: auto; position: relative; }
    .content { margin-left: 0; padding: 15px; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <div class="sidebar-menu">
    <a href="dashboard.html"><i class="fa fa-chart-line me-2"></i> <span data-i18n="menuDashboard">Dashboard</span></a>
    <a href="users.html"><i class="fa fa-users me-2"></i> <span data-i18n="menuUsers">Users</span></a>
    <a href="booking.html" class="active"><i class="fa fa-calendar-check me-2"></i> <span data-i18n="menuBookings">Bookings</span></a>
    <a href="accesslog.html"><i class="fa fa-clock me-2"></i> <span data-i18n="menuAccessLog">Access Log</span></a>
    <a href="laboratory.html"><i class="fa fa-building me-2"></i> <span data-i18n="menuLaboratories">Laboratories</span></a>
    <a href="reports.html"><i class="fa fa-file me-2"></i> <span data-i18n="menuReports">Reports</span></a>
    <a href="settings.html"><i class="fa fa-cog me-2"></i> <span data-i18n="menuSettings">Settings</span></a>
    <a href="profile.html"><i class="fa fa-user me-2"></i> <span data-i18n="menuProfile">Profile</span></a>
    <a href="#" id="logoutBtn"><i class="fa fa-sign-out-alt me-2"></i> <span data-i18n="menuLogout">Logout</span></a>
  </div>
</div>

<div class="content">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div>
      <h3 class="mb-0" data-i18n="pageHeader">Pengurusan Tempahan Makmal</h3>
      <p class="text-muted small mb-0" data-i18n="pageSubHeader">Semak dan luluskan permohonan tempahan daripada pengguna.</p>
    </div>
    <div class="d-flex align-items-center gap-3">
      <button id="themeToggleBtn" class="btn btn-sm btn-outline-secondary rounded-circle" style="width: 38px; height: 38px;" title="Tukar Mod Paparan">
        <i class="fa fa-moon" id="themeIcon"></i>
      </button>
      <div id="adminHeaderName" class="fw-bold text-primary" data-i18n="loadingText">Admin 🛡️</div>
    </div>
  </div>

  <div class="card-container">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h5 class="mb-0 fw-bold"><i class="fa fa-list me-2"></i><span data-i18n="listTitle">Senarai Permohonan</span></h5>
      <div class="d-flex gap-2">
        <button id="exportExcelBtn" class="btn-custom-csv">
          <i class="fa-solid fa-download"></i> <span data-i18n="downloadCsvBtn">Download CSV</span>
        </button>
        <button id="printBtn" class="btn-custom-print">
          <i class="fa-solid fa-print"></i> <span data-i18n="printBtn">Print</span>
        </button>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th data-i18n="thUser">Pengguna</th>
            <th data-i18n="thLab">Makmal</th>
            <th data-i18n="thDateTime">Tarikh & Masa</th>
            <th data-i18n="thReason">Tujuan</th>
            <th data-i18n="thStatus">Status</th>
            <th class="text-center" data-i18n="thAction">Tindakan</th>
          </tr>
        </thead>
        <tbody id="bookingsTableBody">
          <tr>
            <td colspan="6" class="text-center text-muted py-4" data-i18n="loadingBookings">Memuatkan senarai tempahan...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const currentPath = window.location.pathname.split("/").pop();
    const sidebarLinks = document.querySelectorAll(".sidebar-menu a");

    sidebarLinks.forEach(link => {
      const href = link.getAttribute("href");
      if (href === currentPath) {
        link.classList.add("active");
      }
    });
  });
</script>

<script type="module">
  import { auth, signOut, onAuthStateChanged, db, ref, get, child, update, onValue } from './firebase-config.js';

  // KAMUS TERJEMAHAN BAHASA (EN & MS)
  const translations = {
    en: {
      pageTitle: "Booking Management - Admin Smart Access",
      menuDashboard: "Dashboard",
      menuUsers: "Users",
      menuBookings: "Bookings",
      menuAccessLog: "Access Log",
      menuLaboratories: "Laboratories",
      menuReports: "Reports",
      menuSettings: "Settings",
      menuProfile: "Profile",
      menuLogout: "Logout",
      pageHeader: "Laboratory Booking Management",
      pageSubHeader: "Review and approve booking requests from users.",
      loadingText: "Loading...",
      listTitle: "Application List",
      downloadCsvBtn: "Download CSV",
      printBtn: "Print",
      thUser: "User",
      thLab: "Laboratory",
      thDateTime: "Date & Time",
      thReason: "Purpose",
      thStatus: "Status",
      thAction: "Action",
      loadingBookings: "Loading booking list...",
      noBookingsFound: "No booking requests found.",
      defaultUserName: "User",
      defaultLabName: "Laboratory",
      defaultReason: "No notes",
      btnApprove: "Approve",
      btnReject: "Reject",
      btnReset: "Reset",
      confirmApprove: "Are you sure you want to approve this booking?",
      confirmReject: "Are you sure you want to reject this booking?",
      confirmReset: "Are you sure you want to reset this booking?",
      alertFailedUpdate: "Failed to update booking status: ",
      alertNoDataExport: "No booking data to export."
    },
    ms: {
      pageTitle: "Pengurusan Tempahan - Admin Smart Access",
      menuDashboard: "Papan Utama",
      menuUsers: "Pengguna",
      menuBookings: "Tempahan",
      menuAccessLog: "Log Akses",
      menuLaboratories: "Makmal",
      menuReports: "Laporan",
      menuSettings: "Tetapan",
      menuProfile: "Profil",
      menuLogout: "Log Keluar",
      pageHeader: "Pengurusan Tempahan Makmal",
      pageSubHeader: "Semak dan luluskan permohonan tempahan daripada pengguna.",
      loadingText: "Memuatkan...",
      listTitle: "Senarai Permohonan",
      downloadCsvBtn: "Download CSV",
      printBtn: "Print",
      thUser: "Pengguna",
      thLab: "Makmal",
      thDateTime: "Tarikh & Masa",
      thReason: "Tujuan",
      thStatus: "Status",
      thAction: "Tindakan",
      loadingBookings: "Memuatkan senarai tempahan...",
      noBookingsFound: "Tiada permohonan tempahan ditemui.",
      defaultUserName: "Pengguna",
      defaultLabName: "Makmal",
      defaultReason: "Tiada catatan",
      btnApprove: "Lulus",
      btnReject: "Tolak",
      btnReset: "Semula",
      confirmApprove: "Adakah anda pasti mahu meluluskan tempahan ini?",
      confirmReject: "Adakah anda pasti mahu menolak tempahan ini?",
      confirmReset: "Adakah anda pasti mahu menetapkan semula tempahan ini?",
      alertFailedUpdate: "Gagal mengemaskini status tempahan: ",
      alertNoDataExport: "Tiada data tempahan untuk dieksport."
    }
  };

  function setLanguage(lang) {
    const t = translations[lang] || translations.en;
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (t[key]) {
        if (el.tagName === "TITLE") {
          document.title = t[key];
        } else {
          el.innerText = t[key];
        }
      }
    });
  }

  // Muatkan bahasa semasa mengikut localStorage
  const currentLang = localStorage.getItem("language") || "ms";
  setLanguage(currentLang);

  let currentBookingsExportData = [];

  const themeToggleBtn = document.getElementById("themeToggleBtn");
  const themeIcon = document.getElementById("themeIcon");

  function updateThemeUI(isDark) {
    if (isDark) {
      document.documentElement.classList.add("dark-mode");
      document.body.classList.add("dark-mode");
      themeIcon.classList.remove("fa-moon");
      themeIcon.classList.add("fa-sun");
    } else {
      document.documentElement.classList.remove("dark-mode");
      document.body.classList.remove("dark-mode");
      themeIcon.classList.remove("fa-sun");
      themeIcon.classList.add("fa-moon");
    }
  }

  if (localStorage.getItem("theme") === "dark") {
    updateThemeUI(true);
  } else {
    updateThemeUI(false);
  }

  themeToggleBtn.addEventListener("click", () => {
    const isDark = document.documentElement.classList.contains("dark-mode");
    localStorage.setItem("theme", isDark ? "light" : "dark");
    updateThemeUI(!isDark);
  });

  // SEMAK SAMA ADA ADMIN DISAHKAN
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    const dbRef = ref(db);
    let adminName = user.displayName || 'Admin';

    try {
      const snapshot = await get(child(dbRef, `users/${user.uid}`));
      if (snapshot.exists() && snapshot.val().name) {
        adminName = snapshot.val().name;
      }
    } catch (e) {
      console.error(e);
    }

    document.getElementById("adminHeaderName").innerText = `${adminName} 🛡️`;
    loadBookingsData();
  });

  // BACA DATA MASA NYATA (REALTIME) DARI NODE 'lab_requests'
  function loadBookingsData() {
    const requestsRef = ref(db, 'lab_requests');
    onValue(requestsRef, (snapshot) => {
      const tbody = document.getElementById("bookingsTableBody");
      tbody.innerHTML = "";
      currentBookingsExportData = [];

      const langNow = localStorage.getItem("language") || "ms";
      const tMsg = translations[langNow] || translations.ms;

      if (!snapshot.exists()) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">${tMsg.noBookingsFound}</td></tr>`;
        return;
      }

      const bookingsData = snapshot.val();
      const keys = Object.keys(bookingsData).reverse(); // Susun dari yang terkini

      keys.forEach(requestId => {
        const item = bookingsData[requestId];
        const rawStatus = (item.status || 'pending').toLowerCase();

        let badgeClass = 'bg-warning text-dark';
        let statusText = 'Pending';

        if (rawStatus === 'approved' || rawStatus === 'diluluskan') {
          badgeClass = 'bg-success';
          statusText = 'Approved';
        } else if (rawStatus === 'rejected' || rawStatus === 'ditolak') {
          badgeClass = 'bg-danger';
          statusText = 'Rejected';
        } else if (rawStatus === 'cancelled' || rawStatus === 'dibatalkan') {
          badgeClass = 'bg-secondary';
          statusText = 'Cancelled';
        }

        const userName = item.userName || item.name || tMsg.defaultUserName;
        const userEmail = item.userEmail || item.email || '-';
        const labName = item.labName || item.lab || tMsg.defaultLabName;
        const bookingDate = item.bookingDate || item.date || 'N/A';
        const reason = item.reason || item.purpose || tMsg.defaultReason;

        let timeDisplay = "";
        let plainTimeString = "";
        if (item.timeSlots && Array.isArray(item.timeSlots) && item.timeSlots.length > 0) {
          timeDisplay = item.timeSlots.map(t => `<span class="time-badge"><i class="fa-regular fa-clock me-1"></i>${t}</span>`).join(" ");
          plainTimeString = item.timeSlots.join(", ");
        } else if (item.timeSlot || item.time) {
          const tVal = item.timeSlot || item.time;
          timeDisplay = `<span class="time-badge"><i class="fa-regular fa-clock me-1"></i>${tVal}</span>`;
          plainTimeString = tVal;
        } else {
          timeDisplay = `<small class="text-muted">N/A</small>`;
          plainTimeString = "N/A";
        }

        currentBookingsExportData.push({
          userName,
          userEmail,
          labName,
          bookingDate,
          timeString: plainTimeString,
          reason,
          status: statusText
        });

        tbody.innerHTML += `
          <tr>
            <td>
              <div class="fw-bold">${userName}</div>
              <small class="text-muted">${userEmail}</small>
            </td>
            <td><strong>${labName}</strong></td>
            <td>
              <div class="fw-bold mb-1">${bookingDate}</div>
              <div>${timeDisplay}</div>
            </td>
            <td>${reason}</td>
            <td><span class="badge ${badgeClass}">${statusText}</span></td>
            <td class="text-center">
              ${rawStatus === 'pending' ? `
                <button onclick="window.updateStatus('${requestId}', 'Approved')" class="btn btn-sm btn-success me-1" title="${tMsg.btnApprove}">
                  <i class="fa fa-check me-1"></i> ${tMsg.btnApprove}
                </button>
                <button onclick="window.updateStatus('${requestId}', 'Rejected')" class="btn btn-sm btn-danger" title="${tMsg.btnReject}">
                  <i class="fa fa-xmark me-1"></i> ${tMsg.btnReject}
                </button>
              ` : `
                <button onclick="window.updateStatus('${requestId}', 'Pending')" class="btn btn-sm btn-outline-secondary" title="${tMsg.btnReset}">
                  <i class="fa fa-rotate-left me-1"></i> ${tMsg.btnReset}
                </button>
              `}
            </td>
          </tr>
        `;
      });
    });
  }

  // FUNGSI KEMASKINI STATUS TEMPAHAN DALAM FIREBASE
  window.updateStatus = async function(requestId, newStatus) {
    const langNow = localStorage.getItem("language") || "ms";
    const tMsg = translations[langNow] || translations.ms;

    let confirmMsg = tMsg.confirmReset;
    if (newStatus === 'Approved') confirmMsg = tMsg.confirmApprove;
    if (newStatus === 'Rejected') confirmMsg = tMsg.confirmReject;

    if (confirm(confirmMsg)) {
      try {
        const targetRef = ref(db, `lab_requests/${requestId}`);
        await update(targetRef, { 
          status: newStatus,
          updatedAt: new Date().toISOString()
        });
      } catch (error) {
        console.error("Ralat kemas kini status:", error);
        alert(tMsg.alertFailedUpdate + error.message);
      }
    }
  };

  // LOGOUT
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", (e) => {
      e.preventDefault();
      signOut(auth).then(() => window.location.href = "index.html");
    });
  }

  // FUNGSI EXPORT KE CSV
  document.getElementById("exportExcelBtn").addEventListener("click", () => {
    const langNow = localStorage.getItem("language") || "ms";
    const tMsg = translations[langNow] || translations.ms;

    if (currentBookingsExportData.length === 0) {
      alert(tMsg.alertNoDataExport);
      return;
    }

    let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
    csvContent += "No,Nama Pengguna,E-mel Pengguna,Makmal,Tarikh,Masa/Slot,Tujuan,Status\n";

    currentBookingsExportData.forEach((item, index) => {
      const cleanReason = `"${item.reason.replace(/"/g, '""')}"`;
      const row = [
        index + 1,
        `"${item.userName}"`,
        `"${item.userEmail}"`,
        `"${item.labName}"`,
        `"${item.bookingDate}"`,
        `"${item.timeString}"`,
        cleanReason,
        `"${item.status}"`
      ].join(",");
      csvContent += row + "\n";
    });

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `Laporan_Tempahan_${new Date().toISOString().slice(0, 10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });

  // FUNGSI CETAK (PRINT)
  document.getElementById("printBtn").addEventListener("click", () => {
    window.print();
  });
</script>

</body>
</html>
