<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - Smart Access</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
</script>

<style>
  /* VARIABLE TEMA (DEFAULT LIGHT MODE) */
  :root {
    --bg-color: #f4f6f9;
    --text-color: #212529;
    --card-bg: #ffffff;
    --sidebar-bg: #032b67;
    --sidebar-hover: #0d6efd;
    --sidebar-mobile-bg: #021f4b;
    --border-color: #ced4da;
    --input-bg: #ffffff;
    --input-text: #212529;
    --subtext-color: #6c757d;
  }

  /* DARK MODE OVERRIDES */
  html.dark-mode, body.dark-mode {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --card-bg: #1e1e1e;
    --sidebar-bg: #0b192c;
    --sidebar-hover: #1e40af;
    --sidebar-mobile-bg: #070f1e;
    --border-color: #444444;
    --input-bg: #2d2d2d;
    --input-text: #ffffff;
    --subtext-color: #aaa;
  }

  body { 
    background: var(--bg-color); 
    color: var(--text-color);
    font-family: 'Segoe UI', sans-serif; 
    margin: 0;
    transition: background 0.3s, color 0.3s;
  }

  /* SIDEBAR DASHBOARD */
  .sidebar { 
    width: 240px; 
    height: 100vh; 
    background: var(--sidebar-bg); 
    position: fixed; 
    color: white; 
    top: 0; 
    left: 0; 
    z-index: 1000;
    transition: background 0.3s;
  }

  .logo { 
    text-align: center; 
    padding: 20px; 
    border-bottom: 1px solid rgba(255,255,255,.2); 
  }

  .logo h5 { 
    margin-top: 10px; 
  }

  .sidebar-menu {
    display: block;
  }

  .sidebar a { 
    display: block; 
    color: white; 
    text-decoration: none; 
    padding: 12px 20px; 
    transition: background 0.2s;
  }

  .sidebar a:hover, .sidebar a.active { 
    background: var(--sidebar-hover); 
  }

  /* MAIN CONTENT */
  .content { 
    margin-left: 240px; 
    padding: 20px; 
  }

  .profile-card {
    background: var(--card-bg);
    color: var(--text-color);
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    transition: background 0.3s, color 0.3s;
  }

  .form-control {
    background-color: var(--input-bg);
    color: var(--input-text);
    border-color: var(--border-color);
  }

  .form-control:focus {
    background-color: var(--input-bg);
    color: var(--input-text);
    border-color: #0d6efd;
  }

  .form-control:disabled {
    background-color: rgba(127, 127, 127, 0.15);
    color: var(--subtext-color);
  }

  .avatar-icon {
    font-size: 5rem;
    color: #0d6efd;
  }

  /* RESPONSIVE UNTUK TELEFON (< 992px) */
  @media (max-width: 991.98px) {
    .sidebar {
      width: 100%;
      height: auto;
      position: relative;
    }

    .logo {
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo i {
      font-size: 1.8rem !important;
    }

    .logo h5 {
      margin: 0;
      font-size: 1.1rem;
    }

    .sidebar-menu {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      background: var(--sidebar-mobile-bg);
      padding: 5px 0;
    }

    .sidebar a {
      padding: 10px 15px;
      font-size: 0.9rem;
    }

    .content {
      margin-left: 0;
      padding: 15px;
    }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <div class="sidebar-menu">
    <a href="dashboard.html"><i class="fa fa-chart-line"></i> Dashboard</a>
    <a href="users.html"><i class="fa fa-users"></i> Users</a>
    <a href="booking.html"><i class="fa fa-calendar-check"></i> Bookings</a>
    <a href="accesslog.html"><i class="fa fa-clock"></i> Access Log</a>
    <a href="laboratory.html"><i class="fa fa-building"></i> Laboratories</a>
    <a href="reports.html"><i class="fa fa-file"></i> Reports</a>
    <a href="notification.html"><i class="fa fa-bell"></i> Notifications</a>
    <a href="help.html"><i class="fa fa-robot"></i> AI Assistant</a>
    <a href="settings.html"><i class="fa fa-cog"></i> Settings</a>
    <a href="profile.html" class="active"><i class="fa fa-user"></i> Profile</a>
    <a href="#" id="logoutBtn"><i class="fa fa-sign-out-alt"></i> Logout</a>
  </div>
</div>

<div class="content">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h3 class="mb-0">User Profile</h3>
    <div id="adminHeaderName" class="fw-bold text-muted">Admin 👤</div>
  </div>

  <div class="row g-4">
    <div class="col-12 col-md-4">
      <div class="profile-card text-center">
        <i class="fa fa-user-circle avatar-icon mb-3"></i>
        <h4 id="profileNameDisplay">Admin User</h4>
        <p class="badge bg-primary fs-6 mb-2" id="profileRoleDisplay">System Administrator</p>
        <p class="text-muted small mb-0" id="profileEmailDisplay">admin@smartaccess.com</p>
      </div>
    </div>

    <div class="col-12 col-md-8">
      <div class="profile-card">
        <h5 class="fw-bold mb-4"><i class="fa fa-user-edit me-2"></i>Edit Information</h5>
        <form id="profileForm">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" id="profFullName" class="form-control" placeholder="Enter full name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" id="profEmail" class="form-control" disabled>
            <div class="form-text text-muted">Email cannot be changed directly.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Role / Position</label>
            <input type="text" id="profRole" class="form-control" value="System Administrator" disabled>
          </div>
          <button type="submit" class="btn btn-primary" id="saveProfileBtn"><i class="fa fa-save me-1"></i> Update Profile</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  import { auth, signOut, onAuthStateChanged, updateProfile, db, ref, get, child, update } from './firebase-config.js';

  // 0. AUTO ACTIVE SIDEBAR MENU FIX
  document.addEventListener("DOMContentLoaded", () => {
    const currentPath = window.location.pathname.split("/").pop();
    document.querySelectorAll(".sidebar-menu a").forEach(link => {
      if (link.getAttribute("href") === currentPath) {
        link.classList.add("active");
      } else {
        link.classList.remove("active");
      }
    });
  });

  // 1. SINKRONKAN MOD GELAP KEPADA BODY
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
    document.body.classList.add("dark-mode");
  }

  let currentUserKey = null;

  // 2. SEMAKAN KESELAMATAN & ISIKAN MAKLUMAT PENGGUNA
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    const dbRef = ref(db);
    let userRole = 'user';
    let userName = user.displayName || 'Admin User';
    let userEmail = user.email || 'N/A';
    let targetUid = user.uid;

    const snapshot = await get(child(dbRef, `users/${user.uid}`));
    if (snapshot.exists()) {
      const data = snapshot.val();
      if (data.role) userRole = data.role.toString().toLowerCase();
      if (data.name) userName = data.name;
    } else {
      const allUsersSnap = await get(child(dbRef, 'users'));
      if (allUsersSnap.exists()) {
        const allUsers = allUsersSnap.val();
        Object.keys(allUsers).forEach(key => {
          if (allUsers[key].email && allUsers[key].email.toLowerCase() === user.email.toLowerCase()) {
            targetUid = key;
            if (allUsers[key].role) userRole = allUsers[key].role.toString().toLowerCase();
            if (allUsers[key].name) userName = allUsers[key].name;
          }
        });
      }
    }

    if (userRole !== 'admin') {
      alert("Akses ditolak! Halaman ini khusus untuk Pentadbir (Admin) sahaja.");
      window.location.href = "user-dashboard.html";
      return;
    }

    currentUserKey = targetUid;

    // Kemas kini Paparan UI
    const roleFormatted = userRole.toUpperCase() === 'ADMIN' ? 'System Administrator' : userRole;
    document.getElementById("adminHeaderName").innerText = `${userName} 👤`;
    document.getElementById("profileNameDisplay").innerText = userName;
    document.getElementById("profileRoleDisplay").innerText = roleFormatted;
    document.getElementById("profileEmailDisplay").innerText = userEmail;

    document.getElementById("profFullName").value = userName;
    document.getElementById("profEmail").value = userEmail;
    document.getElementById("profRole").value = roleFormatted;
  });

  // 3. KEMASKINI PROFIL DENGAN FIREBASE AUTH & REALTIME DATABASE
  document.getElementById("profileForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const newName = document.getElementById("profFullName").value.trim();
    const currentUser = auth.currentUser;
    const saveBtn = document.getElementById("saveProfileBtn");

    if (!newName) {
      alert("Sila masukkan nama penuh anda.");
      return;
    }

    try {
      saveBtn.disabled = true;
      saveBtn.innerHTML = `<i class="fa fa-spinner fa-spin me-1"></i> Updating...`;

      // 1. Kemas kini profil Auth
      if (currentUser) {
        await updateProfile(currentUser, { displayName: newName });
      }

      // 2. Kemas kini nod dalam Realtime Database menggunakan UID yang betul
      if (currentUserKey) {
        await update(ref(db, `users/${currentUserKey}`), {
          name: newName,
          updatedAt: new Date().toISOString()
        });
      }

      alert("Profil berjaya dikemas kini!");
      document.getElementById("adminHeaderName").innerText = `${newName} 👤`;
      document.getElementById("profileNameDisplay").innerText = newName;

    } catch (err) {
      console.error("Gagal mengemaskini profil:", err);
      alert("Gagal mengemaskini profil: " + err.message);
    } finally {
      saveBtn.disabled = false;
      saveBtn.innerHTML = `<i class="fa fa-save me-1"></i> Update Profile`;
    }
  });

  // 4. LOGOUT FIREBASE
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", (e) => {
      e.preventDefault();
      signOut(auth).then(() => {
        window.location.href = "index.html";
      }).catch(err => {
        console.error("Logout error:", err);
      });
    });
  }
</script>

</body>
</html>
