<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pageTitle">Profile - Smart Access</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
</script>

<style>
  /* VARIABLE TEMA (DEFAULT LIGHT MODE) */
  :root {
    --bg-color: #f4f6f9;
    --text-color: #212529;
    --card-bg: #ffffff;
    --sidebar-bg: #032b67;
    --sidebar-hover: #0d6efd;
    --sidebar-mobile-bg: #021f4b;
    --border-color: #ced4da;
    --input-bg: #ffffff;
    --input-text: #212529;
    --subtext-color: #6c757d;
  }

  /* DARK MODE OVERRIDES */
  html.dark-mode, body.dark-mode {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --card-bg: #1e1e1e;
    --sidebar-bg: #0b192c;
    --sidebar-hover: #1e40af;
    --sidebar-mobile-bg: #070f1e;
    --border-color: #444444;
    --input-bg: #2d2d2d;
    --input-text: #ffffff;
    --subtext-color: #b0bec5;
  }

  /* Tetapkan warna kelas text-muted agar cerah dan jelas dalam dark mode */
  html.dark-mode .text-muted, 
  body.dark-mode .text-muted {
    color: #b0bec5 !important;
  }

  body { 
    background: var(--bg-color); 
    color: var(--text-color);
    font-family: 'Segoe UI', sans-serif; 
    margin: 0;
    transition: background 0.3s, color 0.3s;
  }

  /* SIDEBAR DASHBOARD */
  .sidebar { 
    width: 240px; 
    height: 100vh; 
    background: var(--sidebar-bg); 
    position: fixed; 
    color: white; 
    top: 0; 
    left: 0; 
    z-index: 1000;
    transition: background 0.3s;
  }

  .logo { 
    text-align: center; 
    padding: 20px; 
    border-bottom: 1px solid rgba(255,255,255,.2); 
  }

  .logo h5 { 
    margin-top: 10px; 
  }

  .sidebar-menu {
    display: block;
  }

  .sidebar a { 
    display: block; 
    color: white; 
    text-decoration: none; 
    padding: 12px 20px; 
    transition: background 0.2s;
  }

  .sidebar a:hover, .sidebar a.active { 
    background: var(--sidebar-hover); 
  }

  /* MAIN CONTENT */
  .content { 
    margin-left: 240px; 
    padding: 20px; 
  }

  .profile-card {
    background: var(--card-bg);
    color: var(--text-color);
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    transition: background 0.3s, color 0.3s;
  }

  .form-control {
    background-color: var(--input-bg);
    color: var(--input-text);
    border-color: var(--border-color);
  }

  .form-control:focus {
    background-color: var(--input-bg);
    color: var(--input-text);
    border-color: #0d6efd;
  }

  .form-control:disabled {
    background-color: rgba(127, 127, 127, 0.15);
    color: var(--subtext-color);
  }

  .avatar-icon {
    font-size: 5rem;
    color: #0d6efd;
  }

  /* RESPONSIVE UNTUK TELEFON (< 992px) */
  @media (max-width: 991.98px) {
    .sidebar {
      width: 100%;
      height: auto;
      position: relative;
    }

    .logo {
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo i {
      font-size: 1.8rem !important;
    }

    .logo h5 {
      margin: 0;
      font-size: 1.1rem;
    }

    .sidebar-menu {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      background: var(--sidebar-mobile-bg);
      padding: 5px 0;
    }

    .sidebar a {
      padding: 10px 15px;
      font-size: 0.9rem;
    }

    .content {
      margin-left: 0;
      padding: 15px;
    }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <div class="sidebar-menu">
    <a href="dashboard.html"><i class="fa fa-chart-line"></i> <span data-i18n="menuDashboard">Dashboard</span></a>
    <a href="users.html"><i class="fa fa-users"></i> <span data-i18n="menuUsers">Users</span></a>
    <a href="booking.html"><i class="fa fa-calendar-check"></i> <span data-i18n="menuBookings">Bookings</span></a>
    <a href="accesslog.html"><i class="fa fa-clock"></i> <span data-i18n="menuAccessLog">Access Log</span></a>
    <a href="laboratory.html"><i class="fa fa-building"></i> <span data-i18n="menuLaboratories">Laboratories</span></a>
    <a href="reports.html"><i class="fa fa-file"></i> <span data-i18n="menuReports">Reports</span></a>
    <a href="settings.html"><i class="fa fa-cog"></i> <span data-i18n="menuSettings">Settings</span></a>
    <a href="profile.html" class="active"><i class="fa fa-user"></i> <span data-i18n="menuProfile">Profile</span></a>
    <a href="#" id="logoutBtn"><i class="fa fa-sign-out-alt"></i> <span data-i18n="menuLogout">Logout</span></a>
  </div>
</div>

<div class="content">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h3 class="mb-0" data-i18n="pageHeader">User Profile</h3>
    <div id="adminHeaderName" class="fw-bold text-muted" data-i18n="loadingText">Loading... 👤</div>
  </div>

  <div class="row g-4">
    <div class="col-12 col-md-4">
      <div class="profile-card text-center">
        <i class="fa fa-user-circle avatar-icon mb-3"></i>
        <h4 id="profileNameDisplay" data-i18n="loadingText">Loading...</h4>
        <p class="badge bg-primary fs-6 mb-2" id="profileRoleDisplay">System Administrator</p>
        <p class="text-muted small mb-0" id="profileEmailDisplay" data-i18n="loadingEmail">Loading email...</p>
      </div>
    </div>

    <div class="col-12 col-md-8">
      <div class="profile-card">
        <h5 class="fw-bold mb-4"><i class="fa fa-user-edit me-2"></i><span data-i18n="editInfoTitle">Edit Information</span></h5>
        <form id="profileForm">
          <div class="mb-3">
            <label class="form-label" data-i18n="fullNameLabel">Full Name</label>
            <input type="text" id="profFullName" class="form-control" data-i18n-placeholder="fullNamePlaceholder" placeholder="Enter full name" required>
          </div>
          <div class="mb-3">
            <label class="form-label" data-i18n="emailLabel">Email Address</label>
            <input type="email" id="profEmail" class="form-control" disabled>
            <div class="form-text text-muted" data-i18n="emailNote">Email cannot be changed directly.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" data-i18n="roleLabel">Role / Position</label>
            <input type="text" id="profRole" class="form-control" value="System Administrator" disabled>
          </div>
          <button type="submit" class="btn btn-primary" id="saveProfileBtn"><i class="fa fa-save me-1"></i> <span data-i18n="updateBtn">Update Profile</span></button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  import { auth, signOut, onAuthStateChanged, db, ref, get, child, update } from './firebase-config.js';
  import { updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // KAMUS TERJEMAHAN BAHASA (EN & MS)
  const translations = {
    en: {
      pageTitle: "Profile - Smart Access",
      menuDashboard: "Dashboard",
      menuUsers: "Users",
      menuBookings: "Bookings",
      menuAccessLog: "Access Log",
      menuLaboratories: "Laboratories",
      menuReports: "Reports",
      menuSettings: "Settings",
      menuProfile: "Profile",
      menuLogout: "Logout",
      pageHeader: "User Profile",
      loadingText: "Loading...",
      loadingEmail: "Loading email...",
      editInfoTitle: "Edit Information",
      fullNameLabel: "Full Name",
      fullNamePlaceholder: "Enter full name",
      emailLabel: "Email Address",
      emailNote: "Email cannot be changed directly.",
      roleLabel: "Role / Position",
      updateBtn: "Update Profile",
      updatingBtn: "Updating...",
      successMsg: "Profile successfully updated!",
      failNameMsg: "Please enter your full name.",
      failUpdateMsg: "Failed to update profile: "
    },
    ms: {
      pageTitle: "Profil - Smart Access",
      menuDashboard: "Papan Utama",
      menuUsers: "Pengguna",
      menuBookings: "Tempahan",
      menuAccessLog: "Log Akses",
      menuLaboratories: "Makmal",
      menuReports: "Laporan",
      menuSettings: "Tetapan",
      menuProfile: "Profil",
      menuLogout: "Log Keluar",
      pageHeader: "Profil Pengguna",
      loadingText: "Memuatkan...",
      loadingEmail: "Memuatkan emel...",
      editInfoTitle: "Kemaskini Maklumat",
      fullNameLabel: "Nama Penuh",
      fullNamePlaceholder: "Masukkan nama penuh",
      emailLabel: "Alamat Emel",
      emailNote: "Emel tidak boleh diubah secara terus.",
      roleLabel: "Peranan / Jawatan",
      updateBtn: "Kemaskini Profil",
      updatingBtn: "Mengemas kini...",
      successMsg: "Profil berjaya dikemas kini!",
      failNameMsg: "Sila masukkan nama penuh anda.",
      failUpdateMsg: "Gagal mengemaskini profil: "
    }
  };

  function setLanguage(lang) {
    const t = translations[lang] || translations.en;
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (t[key]) {
        if (el.tagName === "TITLE") {
          document.title = t[key];
        } else {
          el.innerText = t[key];
        }
      }
    });

    document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
      const key = el.getAttribute("data-i18n-placeholder");
      if (t[key]) {
        el.placeholder = t[key];
      }
    });
  }

  // Muatkan bahasa serta-merta mengikut localStorage
  const currentLang = localStorage.getItem("language") || "en";
  setLanguage(currentLang);

  // 0. AUTO ACTIVE SIDEBAR MENU FIX
  document.addEventListener("DOMContentLoaded", () => {
    const currentPath = window.location.pathname.split("/").pop();
    document.querySelectorAll(".sidebar-menu a").forEach(link => {
      if (link.getAttribute("href") === currentPath) {
        link.classList.add("active");
      } else {
        link.classList.remove("active");
      }
    });
  });

  // 1. SINKRONKAN MOD GELAP KEPADA BODY
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
    document.body.classList.add("dark-mode");
  }

  let currentUserKey = null;

  // 2. SEMAKAN KESELAMATAN & PAPARKAN EMAIL SERTA NAMA PENGGUNA
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    const dbRef = ref(db);
    let userRole = 'user';
    let userEmail = user.email || 'Email tidak ditemui';
    let userName = user.displayName || userEmail.split('@')[0];
    let targetUid = user.uid;

    try {
      // Semak data pengguna mengikut UID dalam Realtime Database
      const snapshot = await get(child(dbRef, `users/${user.uid}`));
      if (snapshot.exists()) {
        const data = snapshot.val();
        if (data.role) userRole = data.role.toString().toLowerCase();
        if (data.name) userName = data.name;
        if (data.email) userEmail = data.email;
      } else {
        // Sekiranya node menggunakan kunci selain UID, carian secara padanan email dibuat
        const allUsersSnap = await get(child(dbRef, 'users'));
        if (allUsersSnap.exists()) {
          const allUsers = allUsersSnap.val();
          Object.keys(allUsers).forEach(key => {
            if (allUsers[key].email && allUsers[key].email.toLowerCase() === user.email.toLowerCase()) {
              targetUid = key;
              if (allUsers[key].role) userRole = allUsers[key].role.toString().toLowerCase();
              if (allUsers[key].name) userName = allUsers[key].name;
              if (allUsers[key].email) userEmail = allUsers[key].email;
            }
          });
        }
      }

      // Halang akses jika pengguna bukan Admin
      if (userRole !== 'admin') {
        alert("Akses ditolak! Halaman ini khusus untuk Pentadbir (Admin) sahaja.");
        window.location.href = "user-dashboard.html";
        return;
      }

      currentUserKey = targetUid;

      // Kemas kini Paparan UI Secara Dinamik
      const roleFormatted = userRole.toUpperCase() === 'ADMIN' ? 'System Administrator' : userRole;
      
      // Paparan Nama dan Email di bahagian Kad Kiri & Header
      document.getElementById("adminHeaderName").innerText = `${userName} 👤`;
      document.getElementById("profileNameDisplay").innerText = userName;
      document.getElementById("profileRoleDisplay").innerText = roleFormatted;
      document.getElementById("profileEmailDisplay").innerText = userEmail;

      // Paparan Nama, Email dan Role pada Borang Edit (Kanan)
      document.getElementById("profFullName").value = userName;
      document.getElementById("profEmail").value = userEmail;
      document.getElementById("profRole").value = roleFormatted;

    } catch (err) {
      console.error("Gagal memuatkan profil:", err);
    }
  });

  // 3. KEMASKINI PROFIL DENGAN FIREBASE AUTH & REALTIME DATABASE
  document.getElementById("profileForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const newName = document.getElementById("profFullName").value.trim();
    const currentUser = auth.currentUser;
    const saveBtn = document.getElementById("saveProfileBtn");
    const langNow = localStorage.getItem("language") || "en";
    const tMsg = translations[langNow] || translations.en;

    if (!newName) {
      alert(tMsg.failNameMsg);
      return;
    }

    try {
      saveBtn.disabled = true;
      saveBtn.innerHTML = `<i class="fa fa-spinner fa-spin me-1"></i> ${tMsg.updatingBtn}`;

      // 1. Kemas kini profil Auth (displayName)
      if (currentUser) {
        await updateProfile(currentUser, { displayName: newName });
      }

      // 2. Kemas kini rekod dalam Realtime Database
      if (currentUserKey) {
        await update(ref(db, `users/${currentUserKey}`), {
          name: newName,
          updatedAt: new Date().toISOString()
        });
      }

      alert(tMsg.successMsg);
      
      // Kemas kini paparan secara langsung tanpa refresh
      document.getElementById("adminHeaderName").innerText = `${newName} 👤`;
      document.getElementById("profileNameDisplay").innerText = newName;

    } catch (err) {
      console.error("Gagal mengemaskini profil:", err);
      alert(tMsg.failUpdateMsg + err.message);
    } finally {
      saveBtn.disabled = false;
      saveBtn.innerHTML = `<i class="fa fa-save me-1"></i> <span data-i18n="updateBtn">${tMsg.updateBtn}</span>`;
    }
  });

  // 4. LOGOUT FIREBASE
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", (e) => {
      e.preventDefault();
      signOut(auth).then(() => {
        window.location.href = "index.html";
      }).catch(err => {
        console.error("Logout error:", err);
      });
    });
  }
</script>

</body>
</html>
