<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f4f6f9;
}

/* SIDEBAR */

.sidebar{
position:fixed;
left:0;
top:0;
width:300px;
height:100vh;
background:#052b6f;
color:white;
}

.logo{
text-align:center;
padding:25px;
}

.logo i{
font-size:65px;
margin-bottom:15px;
}

.logo h2{
font-size:20px;
}

.sidebar hr{
border:none;
border-top:1px solid rgba(255,255,255,.2);
}

.sidebar ul{
list-style:none;
padding-top:15px;
}

.sidebar ul li{
margin:10px 0;
}

.sidebar ul li a{
display:flex;
align-items:center;
gap:15px;
padding:15px 25px;
text-decoration:none;
color:white;
font-size:18px;
transition:.3s;
}

.sidebar ul li a:hover{
background:rgba(255,255,255,.1);
}

.active{
background:rgba(255,255,255,.12);
border-left:4px solid white;
}

/* MAIN */

.main-content{
margin-left:300px;
padding:30px;
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.top-bar h2{
color:#333;
}

.profile-card{
background:white;
border-radius:12px;
padding:30px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.profile-header{
display:flex;
align-items:center;
margin-bottom:30px;
}

.avatar{
width:110px;
height:110px;
border-radius:50%;
background:#052b6f;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:50px;
margin-right:25px;
}

.profile-header h3{
font-size:24px;
margin-bottom:5px;
}

.profile-header p{
color:gray;
}

.form-group{
margin-bottom:20px;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:6px;
font-size:15px;
}

.btn{
margin-top:20px;
background:#0d6efd;
color:white;
padding:12px 25px;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

.btn:hover{
background:#084298;
}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">

<i class="fas fa-shield-alt"></i>

<h2>SMART ACCESS</h2>

</div>

<li><a href="settings.html"><i class="fas fa-cog"></i>Settings</a></li>

<li><a class="active" href="profile.html"><i class="fas fa-user"></i>Profile</a></li>

<li><a href="logout.php"><i class="fas fa-sign-out-alt"></i>Logout</a></li>

</ul>

</div>

<!-- MAIN -->

<div class="main-content">

<div class="top-bar">

<h2>Profile</h2>

<div>

Admin <i class="fas fa-user-circle"></i>

</div>

</div>

<div class="profile-card">

<div class="profile-header">

<div class="avatar">

<i class="fas fa-user"></i>

</div>

<div>

<h3>Administrator</h3>

<p>System Administrator</p>

</div>

</div>

<div class="form-group">

<label>Full Name</label>

<input type="text" value="Administrator">

</div>

<div class="form-group">

<label>Email Address</label>

<input type="email" value="admin@gmail.com">

</div>

<div class="form-group">

<label>Phone Number</label>

<input type="text" value="+60 12-3456789">

</div>

<div class="form-group">

<label>Username</label>

<input type="text" value="admin">

</div>

<div class="form-group">

<label>New Password</label>

<input type="password" placeholder="Enter new password">

</div>

<div class="form-group">

<label>Confirm Password</label>

<input type="password" placeholder="Confirm password">

</div>

<button class="btn" onclick="updateProfile()">

<i class="fas fa-save"></i>

Update Profile

</button>

</div>

</div>

<script>

function updateProfile(){

alert("Profile updated successfully!");

}

</script>

</body>
</html>
