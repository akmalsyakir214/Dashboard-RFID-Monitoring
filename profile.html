<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - Smart Access</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>
  body { 
    background: #f4f6f9; 
    font-family: 'Segoe UI', sans-serif; 
    margin: 0;
  }

  /* ==================== 1. LAPTOP / DESKTOP VIEW ==================== */
  .sidebar { 
    width: 240px; 
    height: 100vh; 
    background: #032b67; 
    position: fixed; 
    color: white; 
    top: 0; 
    left: 0; 
    z-index: 1000;
  }

  .logo { 
    text-align: center; 
    padding: 20px; 
    border-bottom: 1px solid rgba(255,255,255,.2); 
  }

  .logo h5 { 
    margin-top: 10px; 
  }

  .sidebar-menu {
    display: block;
  }

  .sidebar a { 
    display: block; 
    color: white; 
    text-decoration: none; 
    padding: 12px 20px; 
    transition: background 0.2s;
  }

  .sidebar a:hover, .sidebar a.active { 
    background: #0d6efd; 
  }

  .content { 
    margin-left: 240px; 
    padding: 20px; 
  }

  .profile-card {
    background: white;
    border-radius: 10px;
    padding: 30px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
  }

  .profile-header {
    display: flex;
    align-items: center;
    margin-bottom: 30px;
  }

  .avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #032b67;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 40px;
    margin-right: 20px;
    flex-shrink: 0;
  }

  .profile-header h4 {
    margin-bottom: 2px;
    font-weight: 600;
  }

  .profile-header p {
    color: gray;
    margin: 0;
  }

  /* ==================== 2. PHONE VIEW ONLY (< 992px) ==================== */
  @media (max-width: 991.98px) {
    .sidebar {
      width: 100%;
      height: auto;
      position: relative;
    }

    .logo {
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo i {
      font-size: 1.8rem !important;
    }

    .logo h5 {
      margin: 0;
      font-size: 1.1rem;
    }

    .sidebar-menu {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      background: #021f4b;
      padding: 5px 0;
    }

    .sidebar a {
      padding: 10px 15px;
      font-size: 0.9rem;
    }

    .content {
      margin-left: 0;
      padding: 15px;
    }

    .profile-card {
      padding: 20px;
    }

    .profile-header {
      flex-direction: column;
      text-align: center;
      gap: 15px;
    }

    .avatar {
      margin-right: 0;
    }
  }
</style>
</head>
<body>

<!-- SIDEBAR DASHBOARD -->
<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <div class="sidebar-menu">
    <a href="dashboard.html"><i class="fa fa-chart-line"></i> Dashboard</a>
    <a href="users.html"><i class="fa fa-users"></i> Users</a>
    <a href="accesslog.html"><i class="fa fa-clock"></i> Access Log</a>
    <a href="laboratory.html"><i class="fa fa-building"></i> Laboratories</a>
    <a href="reports.html"><i class="fa fa-file"></i> Reports</a>
    <a href="notification.html"><i class="fa fa-bell"></i> Notifications</a>
    <a href="settings.html"><i class="fa fa-cog"></i> Settings</a>
    <a href="profile.html" class="active"><i class="fa fa-user"></i> Profile</a>
    <a href="logout.html" id="logoutBtn"><i class="fa fa-sign-out-alt"></i> Logout</a>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="content">

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h3 class="mb-0">Profile</h3>
    <div id="adminHeaderName">Admin 👤</div>
  </div>

  <div class="profile-card">

    <div class="profile-header">
      <div class="avatar">
        <i class="fas fa-user"></i>
      </div>
      <div>
        <h4 id="profileDisplayName">Administrator</h4>
        <p id="profileRole">System Administrator</p>
      </div>
    </div>

    <form id="profileForm">
      <div class="mb-3">
        <label class="form-label fw-semibold">Full Name</label>
        <input type="text" id="fullName" class="form-control" value="Administrator" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Email Address</label>
        <input type="email" id="email" class="form-control" value="admin@gmail.com" disabled>
        <small class="text-muted">E-mel tidak boleh diubah secara terus demi keselamatan.</small>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Phone Number</label>
        <input type="text" id="phone" class="form-control" value="+60 12-3456789">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <input type="text" id="username" class="form-control" value="admin">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">New Password</label>
        <input type="password" id="newPassword" class="form-control" placeholder="Biarkan kosong jika tidak mahu tukar">
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-control" placeholder="Pengesahan kata laluan baru">
      </div>

      <button type="submit" class="btn btn-primary px-4 w-100 w-md-auto">
        <i class="fas fa-save me-2"></i>Update Profile
      </button>
    </form>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- SCRIPT FIREBASE -->
<script type="module">
  import { auth, signOut, onAuthStateChanged, updatePassword, updateProfile, db, ref, get, child, set } from './firebase-config.js';

  let currentUser = null;

  // 1. SEMAKAN KESELAMATAN (AUTH PROTECTION) & PAPARKAN MAKLUMAT PENGGUNA
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "index.html";
    } else {
      currentUser = user;
      document.getElementById("email").value = user.email || "";
      if (user.displayName) {
        document.getElementById("fullName").value = user.displayName;
        document.getElementById("profileDisplayName").innerText = user.displayName;
        document.getElementById("adminHeaderName").innerText = `${user.displayName} 👤`;
      }

      // Membaca data tambahan seperti phone/username dari Realtime Database jika wujud
      const dbRef = ref(db);
      get(child(dbRef, `admins/${user.uid}`)).then((snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          if(data.phone) document.getElementById("phone").value = data.phone;
          if(data.username) document.getElementById("username").value = data.username;
        }
      }).catch((error) => {
        console.error("Error reading admin profile:", error);
      });
    }
  });

  // 2. FUNGSI LOGOUT FIREBASE
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", (e) => {
      e.preventDefault();
      
      signOut(auth)
        .then(() => {
          window.location.href = "index.html";
        })
        .catch((error) => {
          console.error("Logout Error:", error);
          alert("Gagal untuk log keluar. Sila cuba lagi.");
        });
    });
  }

  // 3. FUNGSI KEMAS KINI PROFAIL & KATA LALUAN
  document.getElementById("profileForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const fullName = document.getElementById("fullName").value;
    const phone = document.getElementById("phone").value;
    const username = document.getElementById("username").value;
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (!currentUser) return;

    try {
      // Kemas kini Display Name di Firebase Auth
      await updateProfile(currentUser, { displayName: fullName });

      // Simpan maklumat tambahan di Realtime Database
      await set(ref(db, `admins/${currentUser.uid}`), {
        fullName: fullName,
        phone: phone,
        username: username,
        email: currentUser.email
      });

      // Kemas kini kata laluan jika diisi
      if (newPassword) {
        if (newPassword !== confirmPassword) {
          alert("Kata laluan baru dan pengesahan kata laluan tidak padan!");
          return;
        }
        await updatePassword(currentUser, newPassword);
      }

      // Kemas kini paparan UI
      document.getElementById("profileDisplayName").innerText = fullName;
      document.getElementById("adminHeaderName").innerText = `${fullName} 👤`;

      alert("Profile updated successfully!");
      document.getElementById("newPassword").value = "";
      document.getElementById("confirmPassword").value = "";

    } catch (error) {
      console.error("Update Profile Error:", error);
      alert("Gagal mengemaskini profail: " + error.message);
    }
  });
</script>

</body>
</html>
