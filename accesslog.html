<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Log - Smart Access</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>
  /* VARIABLE TEMA (DEFAULT LIGHT MODE) */
  :root {
    --bg-color: #f4f6f9;
    --text-color: #212529;
    --card-bg: #ffffff;
    --sidebar-bg: #032b67;
    --sidebar-hover: #0d6efd;
    --sidebar-mobile-bg: #021f4b;
    --table-border: #dee2e6;
    --success-color: #28a745;
    --failed-color: #dc3545;
    --modal-bg: #ffffff;
  }

  /* DARK MODE OVERRIDES */
  body.dark-mode {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --card-bg: #1e1e1e;
    --sidebar-bg: #0b192c;
    --sidebar-hover: #1e40af;
    --sidebar-mobile-bg: #070f1e;
    --table-border: #333333;
    --success-color: #34d399;
    --failed-color: #f87171;
    --modal-bg: #1e1e1e;
  }

  body { 
    background: var(--bg-color); 
    color: var(--text-color);
    font-family: 'Segoe UI', sans-serif; 
    margin: 0;
    transition: background 0.3s, color 0.3s;
  }

  /* SIDEBAR DASHBOARD */
  .sidebar { 
    width: 240px; 
    height: 100vh; 
    background: var(--sidebar-bg); 
    position: fixed; 
    color: white; 
    top: 0; 
    left: 0; 
    z-index: 1000;
    transition: background 0.3s;
  }

  .logo { 
    text-align: center; 
    padding: 20px; 
    border-bottom: 1px solid rgba(255,255,255,.2); 
  }

  .logo h5 { 
    margin-top: 10px; 
  }

  .sidebar-menu {
    display: block;
  }

  .sidebar a { 
    display: block; 
    color: white; 
    text-decoration: none; 
    padding: 12px 20px; 
    transition: background 0.2s;
  }

  .sidebar a:hover, .sidebar a.active { 
    background: var(--sidebar-hover); 
  }

  /* MAIN CONTENT */
  .content { 
    margin-left: 240px; 
    padding: 20px; 
  }

  .card-box {
    background: var(--card-bg);
    color: var(--text-color);
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    transition: background 0.3s, color 0.3s;
  }

  .success { color: var(--success-color); font-weight: bold; }
  .failed { color: var(--failed-color); font-weight: bold; }

  /* ADJUSTMENT JADUAL DALAM DARK MODE */
  body.dark-mode .table {
    color: var(--text-color);
    border-color: var(--table-border);
  }

  body.dark-mode .table th, 
  body.dark-mode .table td {
    background-color: var(--card-bg);
    color: var(--text-color);
    border-color: var(--table-border);
  }

  /* MODAL DARK MODE STYLING */
  body.dark-mode .modal-content {
    background-color: var(--modal-bg);
    color: var(--text-color);
    border: 1px solid var(--table-border);
  }
  
  body.dark-mode .btn-close {
    filter: invert(1) grayscale(100%) brightness(200%);
  }

  /* RESPONSIVE UNTUK TELEFON (< 992px) */
  @media (max-width: 991.98px) {
    .sidebar {
      width: 100%;
      height: auto;
      position: relative;
    }

    .logo {
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo i {
      font-size: 1.8rem !important;
    }

    .logo h5 {
      margin: 0;
      font-size: 1.1rem;
    }

    .sidebar-menu {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      background: var(--sidebar-mobile-bg);
      padding: 5px 0;
    }

    .sidebar a {
      padding: 10px 15px;
      font-size: 0.9rem;
    }

    .content {
      margin-left: 0;
      padding: 15px;
    }

    .card-box {
      padding: 15px;
    }
  }
</style>

<!-- SKRIP SEGERA APABILA PAGE LOAD UNTUK ELAK SCREEN FLICKER -->
<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
</script>
</head>
<body>

<!-- SIDEBAR DASHBOARD -->
<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <div class="sidebar-menu">
    <a href="dashboard.html"><i class="fa fa-chart-line"></i> Dashboard</a>
    <a href="users.html"><i class="fa fa-users"></i> Users</a>
    <a href="accesslog.html" class="active"><i class="fa fa-clock"></i> Access Log</a>
    <a href="laboratory.html"><i class="fa fa-building"></i> Laboratories</a>
    <a href="reports.html"><i class="fa fa-file"></i> Reports</a>
    <a href="notification.html"><i class="fa fa-bell"></i> Notifications</a>
    <a href="settings.html"><i class="fa fa-cog"></i> Settings</a>
    <a href="profile.html"><i class="fa fa-user"></i> Profile</a>
    <a href="logout.html" id="logoutBtn"><i class="fa fa-sign-out-alt"></i> Logout</a>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="content">

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h3 class="mb-0">Access Log</h3>
    <div class="d-flex align-items-center gap-3">
      <!-- BUTTON UNTUK CLEAR LOG -->
      <button class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#confirmClearModal">
        <i class="fa fa-trash me-1"></i> Clear Log
      </button>
      <div>Admin 👤</div>
    </div>
  </div>

  <div class="card-box">
    <!-- Balut table dengan table-responsive supaya tidak terpotong pada telefon -->
    <div class="table-responsive">
      <table class="table table-hover align-middle text-center mb-0">
        <thead class="table-primary">
          <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Name</th>
            <th>UID</th>
            <th>Laboratory</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="accessLogBody"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- MODAL PENGESAHAN PADAM LOG -->
<div class="modal fade" id="confirmClearModal" tabindex="-1" aria-labelledby="confirmClearModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmClearModalLabel">Clear Access Logs</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to permanently delete all access logs? This action cannot be undone.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmClearBtn">Delete All Logs</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  // Dimasukkan 'remove' daripada Firebase Realtime Database module
  import { auth, signOut, onAuthStateChanged, db, ref, onValue, remove } from './firebase-config.js';

  // 1. PELARASAN TEMA DARK / LIGHT MODE AUTOMATIK
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
  }

  // 2. SEMAKAN KESELAMATAN (HALANG AKSES JIKA TIADA USER)
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "index.html";
    }
  });

  // 3. FUNGSI LOGOUT FIREBASE
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", (e) => {
      e.preventDefault();
      
      signOut(auth)
        .then(() => {
          window.location.href = "index.html";
        })
        .catch((error) => {
          console.error("Logout Error:", error);
          alert("Gagal untuk log keluar. Sila cuba lagi.");
        });
    });
  }

  // 4. FUNGSI LOAD ACCESS LOG (REALTIME DATABASE)
  const logsRef = ref(db, 'access_logs');

  onValue(logsRef, (snapshot) => {
    const body = document.getElementById("accessLogBody");
    body.innerHTML = "";
    const data = snapshot.val();

    if (data) {
      const sortedKeys = Object.keys(data).reverse();
      sortedKeys.forEach((key) => {
        const log = data[key];
        const statusClass = (log.status || '').toLowerCase().includes('success') ? 'success' : 'failed';

        body.innerHTML += `
          <tr>
            <td>${log.date || 'N/A'}</td>
            <td>${log.time || 'N/A'}</td>
            <td>${log.userName || log.name || 'Unknown'}</td>
            <td>${log.uid || 'N/A'}</td>
            <td>${log.labName || log.location || 'N/A'}</td>
            <td class="${statusClass}">${log.status || 'N/A'}</td>
          </tr>`;
      });
    } else {
      body.innerHTML = `<tr><td colspan="6" class="text-muted">No logs available</td></tr>`;
    }
  });

  // 5. FUNGSI PADAM SEMUA ACCESS LOG (CLEAR LOG)
  const confirmClearBtn = document.getElementById("confirmClearBtn");
  if (confirmClearBtn) {
    confirmClearBtn.addEventListener("click", () => {
      remove(logsRef)
        .then(() => {
          // Tutup Modal Bootstrap secara manual selepas padam
          const modalEl = document.getElementById('confirmClearModal');
          const modalInstance = bootstrap.Modal.getInstance(modalEl);
          if (modalInstance) {
            modalInstance.hide();
          }
        })
        .catch((error) => {
          console.error("Error clearing logs: ", error);
          alert("Gagal memadam log akses: " + error.message);
        });
    });
  }
</script>

</body>
</html>
