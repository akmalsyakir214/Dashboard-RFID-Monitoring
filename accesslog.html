<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Log</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
body{ background:#f4f6f9; }
.sidebar{ width:240px; height:100vh; background:#032b67; position:fixed; }
.logo{ text-align:center; color:white; padding:20px; }
.sidebar a{ display:block; color:white; text-decoration:none; padding:12px 20px; }
.sidebar a:hover{ background:#0d6efd; }
.content{ margin-left:240px; padding:20px; }
.card-box{ background:white; border-radius:10px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.1); }
.success{ color:green; font-weight:bold; }
.failed{ color:red; font-weight:bold; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <a href="dashboard.html"><i class="fa fa-chart-line"></i> Dashboard</a>
  <a href="users.html"><i class="fa fa-users"></i> Users</a>
  <a href="accesslog.html"><i class="fa fa-clock"></i> Access Log</a>
  <a href="laboratory.html"><i class="fa fa-building"></i> Laboratories</a>
  <a href="reports.html"><i class="fa fa-file"></i> Reports</a>
  <a href="notification.html"><i class="fa fa-bell"></i> Notifications</a>
  <a href="settings.html"><i class="fa fa-cog"></i> Settings</a>
  <a href="profile.html"><i class="fa fa-user"></i> Profile</a>
  <a href="login.html"><i class="fa fa-sign-out-alt"></i> Logout</a>
</div>

<div class="content">
  <div class="card-box">
    <h3 class="mb-4">Access Log</h3>

    <table class="table table-bordered table-hover">
      <thead class="table-primary">
        <tr>
          <th>Date</th>
          <th>Time</th>
          <th>Name</th>
          <th>UID</th>
          <th>Laboratory</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="accessLogBody"></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { db, ref, onValue } from './firebase-config.js';

  const logsRef = ref(db, 'access_logs');

  onValue(logsRef, (snapshot) => {
    const body = document.getElementById("accessLogBody");
    body.innerHTML = "";
    const data = snapshot.val();

    if (data) {
      const sortedKeys = Object.keys(data).reverse();
      sortedKeys.forEach((key) => {
        const log = data[key];
        const statusClass = (log.status || '').toLowerCase().includes('success') ? 'success' : 'failed';

        body.innerHTML += `
          <tr>
            <td>${log.date || 'N/A'}</td>
            <td>${log.time || 'N/A'}</td>
            <td>${log.userName || log.name || 'Unknown'}</td>
            <td>${log.uid || 'N/A'}</td>
            <td>${log.labName || log.location || 'N/A'}</td>
            <td class="${statusClass}">${log.status}</td>
          </tr>`;
      });
    }
  });
</script>
</body>
</html>
