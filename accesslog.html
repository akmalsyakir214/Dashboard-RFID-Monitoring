<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Log - Smart Access</title>

<!-- SKRIP SEGERA DALAM HEAD UNTUK ELAK WHITE FLICKER -->
<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
</script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>
  /* VARIABLE TEMA (DEFAULT LIGHT MODE) */
  :root {
    --bg-color: #f4f6f9;
    --text-color: #212529;
    --card-bg: #ffffff;
    --sidebar-bg: #032b67;
    --sidebar-hover: #0d6efd;
    --sidebar-mobile-bg: #021f4b;
    --table-border: #dee2e6;
    --success-color: #198754;
    --danger-color: #dc3545;
  }

  /* DARK MODE OVERRIDES */
  :root.dark-mode {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --card-bg: #1e1e1e;
    --sidebar-bg: #0b192c;
    --sidebar-hover: #1e40af;
    --sidebar-mobile-bg: #070f1e;
    --table-border: #333333;
    --success-color: #34d399;
    --danger-color: #f87171;
  }

  html {
    background-color: var(--bg-color);
  }

  body { 
    background-color: var(--bg-color); 
    color: var(--text-color);
    font-family: 'Segoe UI', sans-serif; 
    margin: 0; 
    transition: background 0.3s, color 0.3s;
  }

  /* SIDEBAR DASHBOARD */
  .sidebar { 
    width: 240px; 
    height: 100vh; 
    background: var(--sidebar-bg); 
    position: fixed; 
    color: white; 
    top: 0; 
    left: 0; 
    z-index: 1000; 
    transition: background 0.3s;
  }
  .logo { 
    text-align: center; 
    padding: 20px; 
    border-bottom: 1px solid rgba(255,255,255,.2); 
  }
  .logo h5 { margin-top: 10px; }
  .sidebar-menu { display: block; }
  .sidebar a { 
    display: block; 
    color: white; 
    text-decoration: none; 
    padding: 12px 20px; 
    transition: background 0.2s; 
  }
  .sidebar a:hover, .sidebar a.active { background: var(--sidebar-hover); }

  /* MAIN CONTENT */
  .content { margin-left: 240px; padding: 20px; }

  .card-box {
    background: var(--card-bg);
    color: var(--text-color);
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    transition: background 0.3s, color 0.3s;
  }

  .text-success-custom { color: var(--success-color); font-weight: bold; }
  .text-danger-custom { color: var(--danger-color); font-weight: bold; }

  /* DARK MODE JADUAL */
  html.dark-mode .table {
    color: var(--text-color);
    border-color: var(--table-border);
  }
  html.dark-mode .table th, 
  html.dark-mode .table td {
    background-color: var(--card-bg);
    color: var(--text-color);
    border-color: var(--table-border);
  }

  /* RESPONSIVE TELEFON (< 992px) */
  @media (max-width: 991.98px) {
    .sidebar { width: 100%; height: auto; position: relative; }
    .logo { padding: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .logo i { font-size: 1.8rem !important; }
    .logo h5 { margin: 0; font-size: 1.1rem; }
    .sidebar-menu { display: flex; overflow-x: auto; white-space: nowrap; background: var(--sidebar-mobile-bg); padding: 5px 0; }
    .sidebar a { padding: 10px 15px; font-size: 0.9rem; }
    .content { margin-left: 0; padding: 15px; }
  }
</style>
</head>
<body>

<!-- SIDEBAR DASHBOARD -->
<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <div class="sidebar-menu">
    <a href="dashboard.html"><i class="fa fa-chart-line"></i> Dashboard</a>
    <a href="users.html"><i class="fa fa-users"></i> Users</a>
    <a href="accesslog.html" class="active"><i class="fa fa-clock"></i> Access Log</a>
    <a href="laboratory.html"><i class="fa fa-building"></i> Laboratories</a>
    <a href="reports.html"><i class="fa fa-file"></i> Reports</a>
    <a href="notification.html"><i class="fa fa-bell"></i> Notifications</a>
    <a href="settings.html"><i class="fa fa-cog"></i> Settings</a>
    <a href="profile.html"><i class="fa fa-user"></i> Profile</a>
    <a href="logout.html" id="logoutBtn"><i class="fa fa-sign-out-alt"></i> Logout</a>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="content">

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h3 class="mb-0">Access Log</h3>
    <div>Admin 👤</div>
  </div>

  <div class="card-box">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h5 class="m-0 fw-semibold">Realtime Access History</h5>
      <button class="btn btn-outline-primary btn-sm" onclick="window.print()">
        <i class="fa fa-print me-1"></i> Print Log
      </button>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle text-center mb-0">
        <thead class="table-primary">
          <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Name</th>
            <th>UID</th>
            <th>Laboratory</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="accessLogBody">
          <tr><td colspan="6" class="text-muted">Loading access records...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- SCRIPT FIREBASE -->
<script type="module">
  import { auth, signOut, onAuthStateChanged, db, ref, onValue } from './firebase-config.js';

  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
    document.body.classList.add("dark-mode");
  }

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "index.html";
    }
  });

  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", (e) => {
      e.preventDefault();
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    });
  }

  // AMBIL DATA LOGS REALTIME DARI FIREBASE
  const logsRef = ref(db, 'access_logs');

  onValue(logsRef, (snapshot) => {
    const body = document.getElementById("accessLogBody");
    body.innerHTML = "";
    const data = snapshot.val();

    if (data) {
      const sortedKeys = Object.keys(data).reverse();
      sortedKeys.forEach((key) => {
        const log = data[key];
        const isGranted = (log.status || '').toLowerCase().includes('success') || (log.status || '').toLowerCase().includes('granted');
        const statusClass = isGranted ? 'text-success-custom' : 'text-danger-custom';
        const badgeClass = isGranted ? 'bg-success' : 'bg-danger';

        body.innerHTML += `
          <tr>
            <td>${log.date || 'N/A'}</td>
            <td>${log.time || 'N/A'}</td>
            <td>${log.userName || log.name || 'Unknown'}</td>
            <td><code>${log.uid || 'N/A'}</code></td>
            <td>${log.labName || log.location || 'N/A'}</td>
            <td><span class="badge ${badgeClass}">${log.status || 'Granted'}</span></td>
          </tr>`;
      });
    } else {
      body.innerHTML = `<tr><td colspan="6" class="text-muted">No logs available</td></tr>`;
    }
  });
</script>

</body>
</html>
