<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Log - Smart Access</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>
  :root {
    --bg-color: #f4f6f9;
    --text-color: #212529;
    --card-bg: #ffffff;
    --sidebar-bg: #032b67;
    --sidebar-hover: #0d6efd;
    --sidebar-mobile-bg: #021f4b;
    --table-border: #dee2e6;
    --success-color: #28a745;
    --failed-color: #dc3545;
    --modal-bg: #ffffff;
  }

  body.dark-mode {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --card-bg: #1e1e1e;
    --sidebar-bg: #0b192c;
    --sidebar-hover: #1e40af;
    --sidebar-mobile-bg: #070f1e;
    --table-border: #333333;
    --success-color: #34d399;
    --failed-color: #f87171;
    --modal-bg: #1e1e1e;
  }

  body { 
    background: var(--bg-color); 
    color: var(--text-color);
    font-family: 'Segoe UI', sans-serif; 
    margin: 0;
    transition: background 0.3s, color 0.3s;
  }

  .sidebar { 
    width: 240px; 
    height: 100vh; 
    background: var(--sidebar-bg); 
    position: fixed; 
    color: white; 
    top: 0; 
    left: 0; 
    z-index: 1000;
    transition: background 0.3s;
  }

  .logo { 
    text-align: center; 
    padding: 20px; 
    border-bottom: 1px solid rgba(255,255,255,.2); 
  }

  .logo h5 { margin-top: 10px; }

  .sidebar-menu { display: block; }

  .sidebar a { 
    display: block; 
    color: white; 
    text-decoration: none; 
    padding: 12px 20px; 
    transition: background 0.2s;
  }

  .sidebar a:hover, .sidebar a.active { 
    background: var(--sidebar-hover); 
  }

  .content { 
    margin-left: 240px; 
    padding: 20px; 
  }

  .card-box {
    background: var(--card-bg);
    color: var(--text-color);
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    transition: background 0.3s, color 0.3s;
  }

  .success { color: var(--success-color); font-weight: bold; }
  .failed { color: var(--failed-color); font-weight: bold; }

  body.dark-mode .table {
    color: var(--text-color);
    border-color: var(--table-border);
  }

  body.dark-mode .table th, 
  body.dark-mode .table td {
    background-color: var(--card-bg);
    color: var(--text-color);
    border-color: var(--table-border);
  }

  body.dark-mode .modal-content {
    background-color: var(--modal-bg);
    color: var(--text-color);
    border: 1px solid var(--table-border);
  }
  
  body.dark-mode .btn-close {
    filter: invert(1) grayscale(100%) brightness(200%);
  }

  @media (max-width: 991.98px) {
    .sidebar { width: 100%; height: auto; position: relative; }
    .logo { padding: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .logo i { font-size: 1.8rem !important; }
    .logo h5 { margin: 0; font-size: 1.1rem; }
    .sidebar-menu { display: flex; overflow-x: auto; white-space: nowrap; background: var(--sidebar-mobile-bg); padding: 5px 0; }
    .sidebar a { padding: 10px 15px; font-size: 0.9rem; }
    .content { margin-left: 0; padding: 15px; }
    .card-box { padding: 15px; }
  }
</style>

<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
</script>
</head>
<body>

<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <div class="sidebar-menu">
    <a href="dashboard.html"><i class="fa fa-chart-line"></i> Dashboard</a>
    <a href="users.html"><i class="fa fa-users"></i> Users</a>
    <a href="booking.html"><i class="fa fa-calendar-check"></i> Bookings</a>
    <a href="accesslog.html"><i class="fa fa-clock"></i> Access Log</a>
    <a href="laboratory.html"><i class="fa fa-building"></i> Laboratories</a>
    <a href="reports.html"><i class="fa fa-file"></i> Reports</a>
    <a href="notification.html"><i class="fa fa-bell"></i> Notifications</a>
    <a href="settings.html"><i class="fa fa-cog"></i> Settings</a>
    <a href="profile.html"><i class="fa fa-user"></i> Profile</a>
    <a href="#" id="logoutBtn"><i class="fa fa-sign-out-alt"></i> Logout</a>
  </div>
</div>

<div class="content">

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h3 class="mb-0">Access Log</h3>
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#confirmClearModal">
        <i class="fa fa-trash me-1"></i> Clear Log
      </button>
      <div id="adminNameDisplay" class="fw-bold text-primary">Admin 👤</div>
    </div>
  </div>

  <div class="card-box">
    <div class="table-responsive">
      <table class="table table-hover align-middle text-center mb-0">
        <thead class="table-primary">
          <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Name</th>
            <th>UID</th>
            <th>Laboratory</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="accessLogBody">
          <tr><td colspan="6" class="text-muted">Loading logs...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<div class="modal fade" id="confirmClearModal" tabindex="-1" aria-labelledby="confirmClearModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmClearModalLabel">Clear Access Logs</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to permanently delete all access logs? This action cannot be undone.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmClearBtn">Delete All Logs</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const currentPath = window.location.pathname.split("/").pop();
    const sidebarLinks = document.querySelectorAll(".sidebar-menu a");

    sidebarLinks.forEach(link => {
      const href = link.getAttribute("href");
      if (href === currentPath) {
        link.classList.add("active");
      }
    });
  });
</script>

<script type="module">
  import { auth, signOut, onAuthStateChanged, db, ref, get, child, onValue, remove } from './firebase-config.js';

  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
  }

  // KAWALAN AKSES PERANAN (ADMIN PROTECTION)
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    const dbRef = ref(db);
    let userRole = 'user';
    let userName = user.displayName || user.email || 'Admin';

    const snapshot = await get(child(dbRef, `users/${user.uid}`));
    if (snapshot.exists()) {
      const data = snapshot.val();
      if (data.role) userRole = data.role.toString().toLowerCase();
      if (data.name) userName = data.name;
    } else {
      const allUsersSnap = await get(child(dbRef, 'users'));
      if (allUsersSnap.exists()) {
        const allUsers = allUsersSnap.val();
        Object.keys(allUsers).forEach(key => {
          if (allUsers[key].email && allUsers[key].email.toLowerCase() === user.email.toLowerCase()) {
            if (allUsers[key].role) userRole = allUsers[key].role.toString().toLowerCase();
            if (allUsers[key].name) userName = allUsers[key].name;
          }
        });
      }
    }

    if (userRole !== 'admin') {
      alert("Akses ditolak! Halaman ini khusus untuk Pentadbir (Admin) sahaja.");
      window.location.href = "user-dashboard.html";
      return;
    }

    document.getElementById("adminNameDisplay").innerText = `${userName} 👤`;
  });

  // LOGOUT
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", (e) => {
      e.preventDefault();
      signOut(auth).then(() => {
        window.location.href = "index.html";
      }).catch(error => {
        console.error("Logout Error:", error);
      });
    });
  }

  // FUNGSI MEMBACA ACCESS LOG (REALTIME DATABASE)
  const logsRef = ref(db, 'access_logs');

  onValue(logsRef, (snapshot) => {
    const body = document.getElementById("accessLogBody");
    body.innerHTML = "";
    const data = snapshot.val();

    if (data) {
      const sortedKeys = Object.keys(data).reverse();
      sortedKeys.forEach((key) => {
        const log = data[key];
        const statusStr = (log.status || '').toLowerCase();
        const isSuccess = statusStr.includes('success') || statusStr.includes('granted') || statusStr === 'allowed';
        const statusClass = isSuccess ? 'success' : 'failed';
        const displayStatus = log.status || (isSuccess ? 'Granted' : 'Denied');

        let logDate = log.date || 'N/A';
        let logTime = log.time || log.timestamp || 'N/A';

        // Mengendalikan format timestamp string gabungan "YYYY-MM-DD HH:MM:SS"
        if (log.timestamp && log.timestamp.includes(' ')) {
          const parts = log.timestamp.split(' ');
          logDate = parts[0];
          logTime = parts[1];
        }

        const logUid = log.rfid || log.cardUid || log.uid || 'N/A';

        body.innerHTML += `
          <tr>
            <td>${logDate}</td>
            <td>${logTime}</td>
            <td>${log.userName || log.name || 'User'}</td>
            <td><code>${logUid}</code></td>
            <td>${log.labName || log.location || 'Makmal Komputer 1'}</td>
            <td class="${statusClass}">${displayStatus}</td>
          </tr>`;
      });
    } else {
      body.innerHTML = `<tr><td colspan="6" class="text-muted">No logs available</td></tr>`;
    }
  });

  // CLEAR LOGS
  const confirmClearBtn = document.getElementById("confirmClearBtn");
  if (confirmClearBtn) {
    confirmClearBtn.addEventListener("click", () => {
      remove(logsRef).then(() => {
        const modalEl = document.getElementById('confirmClearModal');
        const modalInstance = bootstrap.Modal.getInstance(modalEl);
        if (modalInstance) {
          modalInstance.hide();
        }
      }).catch(error => {
        alert("Gagal memadam log akses: " + error.message);
      });
    });
  }
</script>

</body>
</html>
