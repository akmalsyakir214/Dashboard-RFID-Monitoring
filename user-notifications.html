<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notifications - Smart Access</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
</script>

<style>
  /* VARIABLE TEMA (DEFAULT LIGHT MODE) */
  :root {
    --bg-color: #f4f6f9;
    --text-color: #212529;
    --card-bg: #ffffff;
    --sidebar-bg: #032b67;
    --sidebar-hover: #0d6efd;
    --sidebar-mobile-bg: #021f4b;
    --border-color: #dee2e6;
    --subtext-color: #6c757d;
    --input-bg: #ffffff;
    --input-text: #212529;
  }

  /* DARK MODE OVERRIDES */
  html.dark-mode, body.dark-mode {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --card-bg: #1e1e1e;
    --sidebar-bg: #0b192c;
    --sidebar-hover: #1e40af;
    --sidebar-mobile-bg: #070f1e;
    --border-color: #333333;
    --subtext-color: #aaa;
    --input-bg: #2d2d2d;
    --input-text: #ffffff;
  }

  body { 
    background: var(--bg-color); 
    color: var(--text-color);
    font-family: 'Segoe UI', sans-serif; 
    margin: 0;
    transition: background 0.3s, color 0.3s;
  }

  /* SIDEBAR DASHBOARD */
  .sidebar { 
    width: 240px; 
    height: 100vh; 
    background: var(--sidebar-bg); 
    position: fixed; 
    color: white; 
    top: 0; 
    left: 0; 
    z-index: 1000;
    transition: background 0.3s;
  }

  .logo { 
    text-align: center; 
    padding: 20px; 
    border-bottom: 1px solid rgba(255,255,255,.2); 
  }

  .logo h5 { 
    margin-top: 10px; 
  }

  .sidebar-menu {
    display: block;
  }

  .sidebar a { 
    display: block; 
    color: white; 
    text-decoration: none; 
    padding: 12px 20px; 
    transition: background 0.2s;
  }

  .sidebar a:hover, .sidebar a.active { 
    background: var(--sidebar-hover); 
  }

  /* MAIN CONTENT */
  .content { 
    margin-left: 240px; 
    padding: 20px; 
  }

  .notification-card { 
    background: var(--card-bg); 
    color: var(--text-color);
    border-radius: 10px; 
    padding: 20px; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.08); 
    transition: background 0.3s, color 0.3s;
  }

  .notification-item { 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    padding: 15px 0; 
    border-bottom: 1px solid var(--border-color); 
  }

  .notification-item:last-child { 
    border-bottom: none; 
  }

  .mark-read { 
    text-decoration: none; 
    color: #0d6efd; 
    font-weight: 600; 
    cursor: pointer; 
    font-size: 14px; 
  }

  .mark-read:hover { 
    text-decoration: underline; 
  }

  /* RESPONSIVE UNTUK TELEFON (< 992px) */
  @media (max-width: 991.98px) {
    .sidebar {
      width: 100%;
      height: auto;
      position: relative;
    }

    .logo {
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo i {
      font-size: 1.8rem !important;
    }

    .logo h5 {
      margin: 0;
      font-size: 1.1rem;
    }

    .sidebar-menu {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      background: var(--sidebar-mobile-bg);
      padding: 5px 0;
    }

    .sidebar a {
      padding: 10px 15px;
      font-size: 0.9rem;
    }

    .content {
      margin-left: 0;
      padding: 15px;
    }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <div class="sidebar-menu">
    <a href="user-dashboard.html"><i class="fa fa-chart-line"></i> Dashboard</a>
    <a href="user-labs.html"><i class="fa fa-door-open"></i> Status Makmal</a>
    <a href="user-booking.html"><i class="fa fa-calendar-plus"></i> Lab Booking</a>
    <a href="user-notifications.html" class="active"><i class="fa fa-bell"></i> Notifications</a>
    <a href="user-profile.html"><i class="fa fa-user"></i> Profile</a>
    <a href="user-settings.html"><i class="fa fa-gear"></i> Settings</a>
    <a href="user-help.html"><i class="fa fa-robot"></i> AI Help Bot</a>
    <a href="#" id="logoutBtn"><i class="fa fa-sign-out-alt"></i> Logout</a>
  </div>
</div>

<div class="content">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div class="d-flex align-items-center gap-3">
      <h3 class="mb-0">Pemberitahuan Peribadi</h3>
    </div>
    <div class="d-flex align-items-center gap-3">
      <div id="userHeaderName" class="fw-bold text-primary">User 👤</div>
      <a href="#" class="mark-read" id="clearNotifBtn"><i class="fa fa-trash-alt me-1"></i> Padam Semua</a>
    </div>
  </div>

  <div class="notification-card" id="userNotifList">
    <div class="text-center text-muted py-4">Memuatkan notifikasi...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  import { auth, signOut, onAuthStateChanged, db, ref, get, child, onValue, update } from './firebase-config.js';

  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
    document.body.classList.add("dark-mode");
  }

  let currentUserUid = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    currentUserUid = user.uid;
    const dbRef = ref(db);
    let userName = user.displayName || 'User';

    const snapshot = await get(child(dbRef, `users/${user.uid}`));
    if (snapshot.exists()) {
      const data = snapshot.val();
      if (data.name) userName = data.name;
    } else {
      const allUsersSnap = await get(child(dbRef, 'users'));
      if (allUsersSnap.exists()) {
        const allUsers = allUsersSnap.val();
        Object.keys(allUsers).forEach(key => {
          if (allUsers[key].email && allUsers[key].email.toLowerCase() === user.email.toLowerCase()) {
            if (allUsers[key].name) userName = allUsers[key].name;
          }
        });
      }
    }

    document.getElementById("userHeaderName").innerText = `${userName} 👤`;

    // Tarik notifikasi khusus untuk user semasa
    const notificationsRef = ref(db, 'notifications');
    onValue(notificationsRef, (snapshot) => {
      const data = snapshot.val();
      const listContainer = document.getElementById("userNotifList");
      listContainer.innerHTML = "";

      if (!data) {
        listContainer.innerHTML = `<div class="text-center text-muted py-4">Tiada pemberitahuan baharu untuk anda.</div>`;
        return;
      }

      let hasNotification = false;
      const keys = Object.keys(data).reverse();

      keys.forEach((key) => {
        const item = data[key];
        
        // Tapis hanya notifikasi milik user ini sahaja
        if (item.userId === user.uid) {
          hasNotification = true;
          let badgeColor = item.type === 'success' ? 'bg-success' : 'bg-danger';

          // Jika status read masih false, kemas kini jadi true secara automatik
          if (item.read === false) {
            update(ref(db, `notifications/${key}`), { read: true });
          }

          listContainer.innerHTML += `
            <div class="notification-item">
              <div>
                <h6 class="mb-1 fw-bold">${item.title}</h6>
                <p class="mb-0 text-muted" style="font-size: 14px;">${item.message}</p>
              </div>
              <div class="text-end">
                <span class="badge ${badgeColor} mb-1">${item.type === 'success' ? 'Diluluskan' : 'Ditolak'}</span>
                <div style="font-size: 11px; color: gray;">${item.timestamp}</div>
              </div>
            </div>
          `;
        }
      });

      if (!hasNotification) {
        listContainer.innerHTML = `<div class="text-center text-muted py-4">Tiada pemberitahuan baharu untuk anda.</div>`;
      }
    });
  });

  // Fungsi Padam / Kosongkan Notifikasi Milik User Ini Sahaja
  document.getElementById("clearNotifBtn").addEventListener("click", async (e) => {
    e.preventDefault();
    if (!currentUserUid) return;

    if (confirm("Adakah anda pasti untuk memadam semua pemberitahuan anda?")) {
      try {
        const snapshot = await get(ref(db, 'notifications'));
        if (snapshot.exists()) {
          const data = snapshot.val();
          const updates = {};
          
          Object.keys(data).forEach((key) => {
            if (data[key].userId === currentUserUid) {
              updates[key] = null; 
            }
          });

          await update(ref(db, 'notifications'), updates);
          alert("Semua pemberitahuan anda telah dipadam.");
        }
      } catch (error) {
        console.error("Ralat memadam notifikasi:", error);
        alert("Gagal memadam notifikasi.");
      }
    }
  });

  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", (e) => {
      e.preventDefault();
      signOut(auth).then(() => {
        window.location.href = "index.html";
      }).catch(err => {
        console.error("Logout error:", err);
      });
    });
  }
</script>

</body>
</html>
