<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Access - Register</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>
  /* VARIABLE TEMA (DEFAULT LIGHT MODE) */
  :root {
    --bg-gradient: linear-gradient(135deg, #032b67 0%, #0d6efd 100%);
    --card-bg: #ffffff;
    --text-color: #212529;
    --muted-color: #6c757d;
    --header-color: #032b67;
    --input-bg: #ffffff;
    --input-text: #212529;
    --input-border: #ced4da;
    --input-group-bg: #e9ecef;
    --input-group-text: #495057;
  }

  /* DARK MODE OVERRIDES */
  body.dark-mode {
    --bg-gradient: linear-gradient(135deg, #070f1e 0%, #0d1b2a 100%);
    --card-bg: #1e1e1e;
    --text-color: #ffffff;
    --muted-color: #b0b0b0;
    --header-color: #ffffff;
    --input-bg: #2b2b2b;
    --input-text: #ffffff;
    --input-border: #444444;
    --input-group-bg: #3d3d3d;
    --input-group-text: #ffffff;
  }

  body {
    background: var(--bg-gradient);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: var(--text-color);
    padding: 20px 0;
    transition: background 0.3s, color 0.3s;
  }

  .register-card {
    background: var(--card-bg);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 420px;
    padding: 30px;
    position: relative;
    transition: background 0.3s;
  }

  .logo-header {
    text-align: center;
    color: var(--header-color);
    margin-bottom: 20px;
  }

  .logo-header i {
    color: #0d6efd;
  }

  .logo-header small {
    color: var(--muted-color) !important;
  }

  .form-label {
    color: var(--text-color);
    font-weight: 500;
  }

  .form-control {
    background-color: var(--input-bg);
    color: var(--input-text) !important;
    border-color: var(--input-border);
  }

  .form-control:focus {
    background-color: var(--input-bg);
    color: var(--input-text) !important;
  }

  .form-control::placeholder {
    color: var(--muted-color);
  }

  .input-group-text {
    background-color: var(--input-group-bg);
    color: var(--input-group-text);
    border-color: var(--input-border);
  }

  .btn-primary {
    background-color: #0d6efd;
    border: none;
    padding: 10px;
    font-weight: 600;
  }

  .btn-primary:hover {
    background-color: #032b67;
  }

  .alert {
    display: none;
    font-size: 0.9rem;
  }

  .theme-toggle-container {
    position: absolute;
    top: 15px;
    right: 15px;
  }
</style>

<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
</script>
</head>
<body>

<div class="register-card">
  <!-- BUTANG TOGGLE TEMA LIGHT / DARK -->
  <div class="theme-toggle-container">
    <button class="btn btn-sm btn-outline-secondary" id="themeToggleBtn" type="button">
      <i class="fa-solid fa-moon" id="themeIcon"></i>
    </button>
  </div>

  <div class="logo-header">
    <i class="fa-solid fa-user-plus fa-3x mb-2"></i>
    <h4 class="fw-bold">SMART ACCESS</h4>
    <small class="text-muted">Register New Account & RFID Card</small>
  </div>

  <!-- NOTIFIKASI STATUS (SUCCESS / ERROR) -->
  <div id="statusAlert" class="alert alert-dismissible fade show" role="alert">
    <span id="alertMessage"></span>
  </div>

  <form id="registerForm">
    <!-- NAMA PENUH -->
    <div class="mb-3">
      <label for="name" class="form-label">Full Name</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fa fa-user"></i></span>
        <input type="text" class="form-control" id="name" placeholder="Ahmad Bin Ali" required>
      </div>
    </div>

    <!-- E-MEL -->
    <div class="mb-3">
      <label for="email" class="form-label">Email Address</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fa fa-envelope"></i></span>
        <input type="email" class="form-control" id="email" placeholder="user@email.com" required autocomplete="email">
      </div>
    </div>

    <!-- UID KAD RFID -->
    <div class="mb-3">
      <label for="rfidUid" class="form-label">RFID Card UID</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fa fa-id-card"></i></span>
        <input type="text" class="form-control" id="rfidUid" placeholder="e.g. A1B2C3D4" required>
      </div>
      <small class="text-muted" style="font-size: 0.8rem;">Masukkan UID Kad RFID yang diimbas (cth: A1B2C3D4).</small>
    </div>

    <!-- KATA LALUAN -->
    <div class="mb-4">
      <label for="password" class="form-label">Password</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fa fa-lock"></i></span>
        <input type="password" class="form-control" id="password" placeholder="Min. 6 aksara" minlength="6" required autocomplete="new-password">
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 mb-3" id="registerBtn">
      <span id="btnText">Register Account</span>
      <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
    </button>

    <div class="text-center">
      <small class="text-muted">Already have an account? <a href="index.html" class="text-primary text-decoration-none fw-bold">Login Here</a></small>
    </div>
  </form>
</div>

<script type="module">
  // Pastikan import ini betul mengikut export di firebase-config.js anda
  import { auth, createUserWithEmailAndPassword, db, ref, set } from './firebase-config.js';

  // 1. LOGIK TEMA DARK / LIGHT
  const themeToggleBtn = document.getElementById("themeToggleBtn");
  const themeIcon = document.getElementById("themeIcon");

  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
    if(themeIcon) themeIcon.classList.replace("fa-moon", "fa-sun");
  }

  if(themeToggleBtn) {
    themeToggleBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
      const isDark = document.body.classList.contains("dark-mode");
      if (isDark) {
        themeIcon.classList.replace("fa-moon", "fa-sun");
        localStorage.setItem("theme", "dark");
      } else {
        themeIcon.classList.replace("fa-sun", "fa-moon");
        localStorage.setItem("theme", "light");
      }
    });
  }

  // 2. LOGIK BORANG & NOTIFIKASI
  const registerForm = document.getElementById("registerForm");
  const statusAlert = document.getElementById("statusAlert");
  const registerBtn = document.getElementById("registerBtn");
  const btnText = document.getElementById("btnText");
  const btnSpinner = document.getElementById("btnSpinner");

  // Fungsi khusus memaparkan Notifikasi secara paksa
  function displayNotification(title, message, type) {
    statusAlert.className = `alert alert-${type} mb-3`;
    statusAlert.innerHTML = `
      <div class="d-flex align-items-center">
        <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'} fa-2x me-3"></i>
        <div>
          <strong>${title}</strong><br>
          <small>${message}</small>
        </div>
      </div>
    `;
    // Paksa elemen untuk kelihatan pada skrin
    statusAlert.style.setProperty("display", "block", "important");
  }

  registerForm.addEventListener("submit", async (e) => {
    // Halang halaman daripada reload
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const rfidUid = document.getElementById("rfidUid").value.trim().toUpperCase();
    const password = document.getElementById("password").value;

    // Kunci butang semasa memproses
    registerBtn.disabled = true;
    btnText.innerText = "Processing...";
    btnSpinner.classList.remove("d-none");

    try {
      // Step 1: Cipta Pengguna di Firebase Auth
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // Step 2: Simpan Rekod di Realtime Database
      await set(ref(db, `users/${user.uid}`), {
        uid: user.uid,
        name: name,
        email: email,
        rfid: rfidUid,
        role: "user",
        createdAt: new Date().toISOString()
      });

      // PAPAR NOTIFIKASI BERJAYA
      displayNotification(
        "Registration Successful!",
        "Account created and RFID saved. Redirecting to login...",
        "success"
      );

      registerForm.reset();

      setTimeout(() => {
        window.location.href = "index.html";
      }, 2500);

    } catch (error) {
      console.error("Registration Error:", error);

      // Kembalikan keadaan butang
      registerBtn.disabled = false;
      btnText.innerText = "Register Account";
      btnSpinner.classList.add("d-none");

      // PAPAR NOTIFIKASI GAGAL
      let errTitle = "Registration Failed";
      let errMsg = error.message;

      if (error.code === "auth/email-already-in-use") {
        errTitle = "Email Already Registered";
        errMsg = "This email address is already registered. Please login instead.";
      } else if (error.code === "auth/weak-password") {
        errTitle = "Weak Password";
        errMsg = "Password must be at least 6 characters long.";
      } else if (error.code === "PERMISSION_DENIED") {
        errTitle = "Database Blocked";
        errMsg = "Auth account created, but writing to Realtime Database was denied by Rules.";
      }

      displayNotification(errTitle, `${errMsg} <br><code style="font-size:0.75rem;">(${error.code})</code>`, "danger");
    }
  });
</script>

</body>
</html>
