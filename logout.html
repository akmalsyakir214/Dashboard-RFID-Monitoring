<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logout - Smart Access</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>
  /* VARIABLE TEMA (DEFAULT LIGHT MODE) */
  :root {
    --bg-color: #f4f6f9;
    --text-color: #212529;
    --muted-color: #6c757d;
    --card-bg: #ffffff;
    --border-color: #ced4da;
  }

  /* DARK MODE OVERRIDES */
  body.dark-mode {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --muted-color: #a0a0a0;
    --card-bg: #1e1e1e;
    --border-color: #444444;
  }

  body {
    background: var(--bg-color);
    color: var(--text-color);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    padding: 20px;
    transition: background 0.3s, color 0.3s;
  }

  .logout-card {
    background: var(--card-bg);
    color: var(--text-color);
    padding: 40px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
    width: 100%;
    max-width: 400px;
    transition: background 0.3s, color 0.3s;
  }

  .text-muted {
    color: var(--muted-color) !important;
  }

  .icon {
    font-size: 60px;
    color: #dc3545;
    margin-bottom: 20px;
  }

  .btn-group-custom {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 20px;
  }

  .btn-group-custom .btn {
    flex: 1;
    padding: 10px;
    font-weight: 600;
  }

  /* PHONE VIEW (< 768px) */
  @media (max-width: 767.98px) {
    .logout-card {
      padding: 25px 20px;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .logout-card h3 {
      font-size: 1.5rem;
    }

    .btn-group-custom {
      flex-direction: column;
    }
  }
</style>

<!-- SKRIP SEGERA APABILA PAGE LOAD UNTUK ELAK SCREEN FLICKER -->
<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
</script>
</head>
<body>

<div class="logout-card">
  <div class="icon">
    <i class="fas fa-sign-out-alt"></i>
  </div>

  <h3 class="fw-bold">Logout</h3>
  <p class="text-muted">Are you sure you want to logout?</p>

  <div class="btn-group-custom">
    <button id="logoutBtn" class="btn btn-danger">
      <i class="fas fa-sign-out-alt me-1"></i> Logout
    </button>
    <a href="dashboard.html" class="btn btn-secondary">
      Cancel
    </a>
  </div>
</div>

<script type="module">
  import { auth, signOut, onAuthStateChanged } from './firebase-config.js';

  // 1. KEKALKAN MOD GELAP PADA DOM BODY
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
  }

  // 2. SEMAKAN KESELAMATAN (REDIRECT KE index.html JIKA TIADA USER)
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "index.html";
    }
  });

  // 3. FUNGSI LOGOUT FIREBASE
  document.getElementById("logoutBtn").addEventListener("click", () => {
    signOut(auth)
      .then(() => {
        window.location.href = "index.html";
      })
      .catch((error) => {
        alert("Logout failed!");
        console.error("Logout Error:", error);
      });
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
