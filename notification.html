<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications - Smart Access</title>

<!-- SKRIP SEGERA DALAM HEAD UNTUK ELAK WHITE FLICKER -->
<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
</script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>
  /* VARIABLE TEMA (DEFAULT LIGHT MODE) */
  :root {
    --bg-color: #f4f6f9;
    --text-color: #212529;
    --card-bg: #ffffff;
    --sidebar-bg: #032b67;
    --sidebar-hover: #0d6efd;
    --sidebar-mobile-bg: #021f4b;
    --border-color: #dee2e6;
  }

  /* DARK MODE OVERRIDES */
  :root.dark-mode {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --card-bg: #1e1e1e;
    --sidebar-bg: #0b192c;
    --sidebar-hover: #1e40af;
    --sidebar-mobile-bg: #070f1e;
    --border-color: #333333;
  }

  html {
    background-color: var(--bg-color);
  }

  body { 
    background-color: var(--bg-color); 
    color: var(--text-color);
    font-family: 'Segoe UI', sans-serif; 
    margin: 0; 
    transition: background 0.3s, color 0.3s;
  }

  /* SIDEBAR DASHBOARD */
  .sidebar { 
    width: 240px; 
    height: 100vh; 
    background: var(--sidebar-bg); 
    position: fixed; 
    color: white; 
    top: 0; 
    left: 0; 
    z-index: 1000; 
    transition: background 0.3s;
  }
  .logo { 
    text-align: center; 
    padding: 20px; 
    border-bottom: 1px solid rgba(255,255,255,.2); 
  }
  .logo h5 { margin-top: 10px; }
  .sidebar-menu { display: block; }
  .sidebar a { 
    display: block; 
    color: white; 
    text-decoration: none; 
    padding: 12px 20px; 
    transition: background 0.2s; 
  }
  .sidebar a:hover, .sidebar a.active { background: var(--sidebar-hover); }

  /* MAIN CONTENT */
  .content { margin-left: 240px; padding: 20px; }

  .card-box {
    background: var(--card-bg);
    color: var(--text-color);
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    transition: background 0.3s, color 0.3s;
  }

  .notif-item {
    padding: 15px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .notif-item:last-child {
    border-bottom: none;
  }

  .notif-icon {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    margin-right: 15px;
  }

  .bg-icon-warning { background: rgba(255, 193, 7, 0.2); color: #ffc107; }
  .bg-icon-danger { background: rgba(220, 53, 69, 0.2); color: #dc3545; }
  .bg-icon-info { background: rgba(13, 110, 253, 0.2); color: #0d6efd; }

  /* RESPONSIVE TELEFON (< 992px) */
  @media (max-width: 991.98px) {
    .sidebar { width: 100%; height: auto; position: relative; }
    .logo { padding: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .logo i { font-size: 1.8rem !important; }
    .logo h5 { margin: 0; font-size: 1.1rem; }
    .sidebar-menu { display: flex; overflow-x: auto; white-space: nowrap; background: var(--sidebar-mobile-bg); padding: 5px 0; }
    .sidebar a { padding: 10px 15px; font-size: 0.9rem; }
    .content { margin-left: 0; padding: 15px; }
  }
</style>
</head>
<body>

<!-- SIDEBAR DASHBOARD -->
<div class="sidebar">
  <div class="logo">
    <i class="fa-solid fa-shield-halved fa-3x"></i>
    <h5>SMART ACCESS</h5>
  </div>
  <div class="sidebar-menu">
    <a href="dashboard.html"><i class="fa fa-chart-line"></i> Dashboard</a>
    <a href="users.html"><i class="fa fa-users"></i> Users</a>
    <a href="accesslog.html"><i class="fa fa-clock"></i> Access Log</a>
    <a href="laboratory.html"><i class="fa fa-building"></i> Laboratories</a>
    <a href="reports.html"><i class="fa fa-file"></i> Reports</a>
    <a href="notification.html" class="active"><i class="fa fa-bell"></i> Notifications</a>
    <a href="settings.html"><i class="fa fa-cog"></i> Settings</a>
    <a href="profile.html"><i class="fa fa-user"></i> Profile</a>
    <a href="logout.html" id="logoutBtn"><i class="fa fa-sign-out-alt"></i> Logout</a>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="content">

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h3 class="mb-0">Notifications</h3>
    <div>Admin 👤</div>
  </div>

  <div class="card-box">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h5 class="m-0 fw-semibold">System Alerts & Logs</h5>
      <button class="btn btn-outline-danger btn-sm" id="clearNotifBtn">
        <i class="fa fa-trash me-1"></i> Clear All Alerts
      </button>
    </div>

    <div id="notificationList">
      <div class="text-center text-muted py-4">Loading notifications...</div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- SCRIPT FIREBASE -->
<script type="module">
  import { auth, signOut, onAuthStateChanged, db, ref, onValue, remove } from './firebase-config.js';

  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
    document.body.classList.add("dark-mode");
  }

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "index.html";
    }
  });

  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", (e) => {
      e.preventDefault();
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    });
  }

  // AMBIL DATA NOTIFIKASI REALTIME
  const notifRef = ref(db, 'notifications');

  onValue(notifRef, (snapshot) => {
    const list = document.getElementById("notificationList");
    list.innerHTML = "";
    const data = snapshot.val();

    if (data) {
      const keys = Object.keys(data).reverse();
      keys.forEach((key) => {
        const notif = data[key];
        let iconClass = "bg-icon-info fa-bell";
        if (notif.type === "danger" || notif.type === "alert") iconClass = "bg-icon-danger fa-exclamation-triangle";
        if (notif.type === "warning") iconClass = "bg-icon-warning fa-exclamation-circle";

        list.innerHTML += `
          <div class="notif-item">
            <div class="d-flex align-items-center">
              <div class="notif-icon ${iconClass}">
                <i class="fa ${iconClass.split(' ')[1]}"></i>
              </div>
              <div>
                <h6 class="mb-1 fw-bold">${notif.title || 'System Alert'}</h6>
                <p class="mb-0 text-muted small">${notif.message || 'No description available.'}</p>
                <small class="text-secondary" style="font-size: 0.75rem;">${notif.timestamp ? new Date(notif.timestamp).toLocaleString() : 'Just now'}</small>
              </div>
            </div>
            <button class="btn btn-link text-danger p-0 ms-2" onclick="deleteNotif('${key}')">
              <i class="fa fa-times"></i>
            </button>
          </div>`;
      });
    } else {
      list.innerHTML = `<div class="text-center text-muted py-4">No new notifications</div>`;
    }
  });

  // PADAM SATU NOTIFIKASI
  window.deleteNotif = function(key) {
    remove(ref(db, `notifications/${key}`));
  };

  // KOSONGKAN SEMUA NOTIFIKASI
  document.getElementById("clearNotifBtn").addEventListener("click", () => {
    if (confirm("Are you sure you want to clear all notifications?")) {
      remove(ref(db, 'notifications'));
    }
  });
</script>

</body>
</html>
